<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一人前ロードマップ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDGothic:wght@400;700&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
/* Layout: 方眼ノートの上に、1本の道（ロードマップ）と駅（ステージ）。レッスンは1列で上から読む */
:root {
  --paper: #eef2ef;
  --grid: #dfe6e1;
  --panel: #ffffff;
  --ink: #1b2822;
  --muted: #5a6b62;
  --rule: #d3dcd6;
  --accent: #1d6b57;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe5;
  --now: #ffe58a;
  --now-ink: #1b2822;
  --term: #18201c;
  --term-ink: #d6f5e3;
  --c-kw: #17799f;
  --c-str: #b8481f;
  --c-num: #7b3fb2;
  --c-com: #6f7d76;
  --c-pp: #5a5f9a;
  --ok: #1f8a4c;
  --ng: #b23a3a;
  --f-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", sans-serif;
  --f-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --f-code: "BIZ UDGothic", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121815; --grid: #1a221e; --panel: #19211d; --ink: #e2eae5; --muted: #98a9a0;
    --rule: #2c3833; --accent: #5cc4a6; --accent-ink: #0d1411; --accent-soft: #1f302a;
    --now: #5c4b12; --now-ink: #fff3c4; --term: #0c110f; --term-ink: #d6f5e3;
    --c-kw: #62c3e8; --c-str: #f08c63; --c-num: #c79df0; --c-com: #8a968f; --c-pp: #a3a8e0;
    --ok: #5fd08e; --ng: #f07c7c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121815; --grid: #1a221e; --panel: #19211d; --ink: #e2eae5; --muted: #98a9a0;
  --rule: #2c3833; --accent: #5cc4a6; --accent-ink: #0d1411; --accent-soft: #1f302a;
  --now: #5c4b12; --now-ink: #fff3c4; --term: #0c110f; --term-ink: #d6f5e3;
  --c-kw: #62c3e8; --c-str: #f08c63; --c-num: #c79df0; --c-com: #8a968f; --c-pp: #a3a8e0;
  --ok: #5fd08e; --ng: #f07c7c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.8;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--paper);
}
.wrap {
  max-width: 1040px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 72px;
  display: grid; gap: 28px;
}
.wrap.narrow { max-width: 800px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.35; }
h1 { font-size: clamp(28px, 5vw, 40px); font-weight: 900; letter-spacing: .02em; }
h2 { font-size: 22px; font-weight: 700; }
h3 { font-size: 17px; font-weight: 700; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
a { color: var(--accent); }
code { font-family: var(--f-code); font-size: .92em; background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.eyebrow { font-size: 12px; letter-spacing: .14em; color: var(--muted); font-weight: 700; }
.lead { color: var(--muted); max-width: 62ch; }
.lead b { color: var(--ink); }
.muted { color: var(--muted); }
.panel { background: var(--panel); border: 1.5px solid var(--rule); border-radius: 14px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-size: 12px; border-radius: 6px; padding: 1px 8px; border: 1px solid var(--rule); color: var(--muted); font-weight: 700; line-height: 1.6; }
.badge.static { border-color: var(--c-kw); color: var(--c-kw); }
.badge.dynamic { border-color: var(--c-str); color: var(--c-str); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  border-radius: 12px; padding: 10px 20px; font-weight: 700; min-height: 46px;
}
.btn.ghost { background: var(--panel); color: var(--accent); }
.btn.small { min-height: 34px; padding: 3px 12px; border-radius: 8px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: default; }
.back { font-size: 14px; font-weight: 700; text-decoration: none; }

/* ---- ホーム ---- */
.head { display: grid; gap: 10px; }
.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; counter-reset: how; }
.how li { padding: 14px 16px; display: grid; gap: 4px; align-content: start; counter-increment: how; }
.how li::before {
  content: counter(how); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink); font-family: var(--f-display); font-weight: 900; line-height: 1;
}
.how b { font-family: var(--f-display); font-size: 17px; }
.how span { font-size: 14px; color: var(--muted); line-height: 1.6; }
.langs { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.lang {
  padding: 16px; display: grid; gap: 8px; align-content: start; text-decoration: none; color: inherit;
  transition: border-color .15s, transform .15s;
}
.lang:hover { border-color: var(--accent); transform: translateY(-2px); }
.lang-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.lang h3 { font-size: 24px; }
.lang .tag { font-weight: 700; line-height: 1.5; }
.lang .about { font-size: 14px; color: var(--muted); line-height: 1.6; }
.meter { height: 8px; background: var(--rule); border-radius: 4px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.meter-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lang .go { font-weight: 700; color: var(--accent); font-size: 14px; }

/* ---- 言語の全体図 ---- */
.hero { display: grid; gap: 10px; }
.two { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; }
.box { padding: 16px 18px; display: grid; gap: 10px; align-content: start; }
.box-title { font-size: 12px; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
.ready li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 4px 0; line-height: 1.6; }
.ready li::before { content: ""; width: 16px; height: 16px; margin-top: 5px; border: 2px solid var(--accent); border-radius: 4px; }
.cta { padding: 16px 18px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.cta .meter-row { flex: 1 1 220px; }
.done-banner { background: var(--accent); color: var(--accent-ink); border-radius: 14px; padding: 16px 18px; display: grid; gap: 4px; }
.done-banner b { font-family: var(--f-display); font-size: 20px; }

.route { position: relative; display: grid; gap: 14px; }
.route::before, .route::after {
  content: ""; position: absolute; left: 21px; top: 22px; width: 4px; border-radius: 2px;
}
.route::before { bottom: 22px; background: var(--rule); }
.route::after { height: calc((100% - 44px) * var(--p, 0)); background: var(--accent); transform-origin: top; animation: draw 1s ease-out both; }
@keyframes draw { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.stage { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 12px; position: relative; z-index: 1; animation: rise .5s ease-out both; animation-delay: calc(var(--k) * 90ms); }
@keyframes rise { from { transform: translateY(10px); opacity: .35; } to { transform: none; opacity: 1; } }
.station {
  width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
  background: var(--panel); border: 3px solid var(--rule); font-family: var(--f-display); font-weight: 900; font-size: 20px; line-height: 1;
}
.stage.started .station { border-color: var(--accent); color: var(--accent); }
.stage.complete .station { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.stage-card { padding: 14px 16px; display: grid; gap: 10px; }
.stage-head { display: grid; gap: 2px; }
.stage-head .can { font-size: 14px; color: var(--muted); line-height: 1.6; }
.stage-head .can b { color: var(--ink); font-weight: 700; }
.lessons { display: grid; gap: 6px; }
.lrow {
  display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--rule); text-decoration: none; color: inherit; background: var(--paper);
  transition: border-color .15s;
}
.lrow:hover { border-color: var(--accent); }
.lrow .n { font-family: var(--f-code); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lrow .t { font-weight: 700; line-height: 1.5; }
.lrow .s { font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.lrow.done .s { color: var(--ok); }
.lrow.next { border-color: var(--accent); background: var(--accent-soft); }
.lrow.next .s { color: var(--accent); }
.after li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 3px 0; line-height: 1.6; }
.after li::before { content: "→"; color: var(--accent); font-weight: 700; }

/* ---- レッスン ---- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--panel); border: 1.5px solid var(--rule); border-radius: 12px; padding: 8px 14px;
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; align-items: center;
  box-shadow: 0 6px 18px -14px rgba(0,0,0,.4);
}
.topbar .where { font-size: 13px; color: var(--muted); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dots { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(18, minmax(0, 1fr)); gap: 3px; }
.dots a { height: 6px; border-radius: 3px; background: var(--rule); }
.dots a.done { background: var(--accent); }
.dots a.cur { background: var(--now); outline: 2px solid var(--accent); outline-offset: 1px; }
.dots a:nth-child(3n+1):not(:first-child) { margin-left: 4px; }
.ltitle { display: grid; gap: 6px; }
.goal { padding: 12px 16px; border-left: 5px solid var(--accent); border-radius: 0 12px 12px 0; background: var(--panel); display: grid; gap: 2px; }
.goal .box-title { color: var(--accent); }
.prose { display: grid; gap: 12px; max-width: 66ch; }
.sec { display: grid; gap: 12px; }
.sec > h2 { display: flex; align-items: center; gap: 10px; }
.sec > h2 .step {
  font-size: 12px; font-family: var(--f-body); letter-spacing: .08em; color: var(--accent-ink); background: var(--accent);
  border-radius: 6px; padding: 2px 8px; white-space: nowrap; line-height: 1.6;
}

.codebox { overflow: hidden; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 8px 0; border-bottom: 1.5px solid var(--rule); align-items: flex-end; }
.tab { border: 1.5px solid var(--rule); border-bottom: 0; background: var(--paper); border-radius: 8px 8px 0 0; padding: 4px 12px; font-family: var(--f-code); font-size: 13px; color: var(--muted); margin-bottom: -1.5px; }
.tab[aria-selected="true"] { background: var(--panel); color: var(--ink); font-weight: 700; border-bottom: 1.5px solid var(--panel); }
.tabs .copy { margin-left: auto; margin-bottom: 6px; }
.copy { border: 1px solid var(--rule); background: transparent; border-radius: 6px; font-size: 12px; padding: 1px 10px; color: var(--muted); }
.code { font-family: var(--f-code); font-size: 14px; line-height: 1.7; padding: 10px 0 12px; counter-reset: ln; }
.cl { display: grid; grid-template-columns: 3em minmax(0, 1fr); }
.cl::before { counter-increment: ln; content: counter(ln); color: var(--muted); text-align: right; padding-right: 12px; font-size: 12px; user-select: none; opacity: .7; padding-top: 2px; }
.cl span.tx { white-space: pre-wrap; overflow-wrap: anywhere; padding-right: 12px; tab-size: 4; }
.k { color: var(--c-kw); font-weight: 700; }
.s { color: var(--c-str); }
.n { color: var(--c-num); }
.c { color: var(--c-com); }
.p { color: var(--c-pp); font-weight: 700; }
.runline { border-top: 1.5px solid var(--rule); padding: 8px 14px; font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--muted); }

.predict { padding: 16px 18px; display: grid; gap: 12px; }
.term { background: var(--term); color: var(--term-ink); border: 1.5px solid var(--rule); border-radius: 10px; padding: 10px 14px; font-family: var(--f-code); font-size: 14px; line-height: 1.7; }
.term .tl { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.7em; animation: typed .25s ease both; }
@keyframes typed { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
.term-title { font-size: 11px; color: #8fb5a2; letter-spacing: .1em; font-family: var(--f-body); }

.points { display: grid; gap: 8px; }
.points li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 10px 14px; line-height: 1.7; }
.points li::before { content: ""; width: 10px; height: 10px; margin-top: 9px; border-radius: 50%; background: var(--accent); }

.quiz { padding: 16px 18px; display: grid; gap: 12px; }
.quiz .q { font-weight: 700; }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; border: 1.5px solid var(--rule); background: var(--paper); border-radius: 10px; padding: 10px 14px; line-height: 1.6; overflow-wrap: anywhere; }
.choice:hover { border-color: var(--accent); }
.choice.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--panel)); font-weight: 700; }
.choice.wrong { border-color: var(--ng); background: color-mix(in srgb, var(--ng) 12%, var(--panel)); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.verdict { font-weight: 700; }
.verdict.ok { color: var(--ok); }
.verdict.ng { color: var(--ng); }

.task { padding: 16px 18px; display: grid; gap: 10px; }
.hintbox { padding: 10px 14px; border-radius: 10px; background: var(--paper); border: 1.5px dashed var(--rule); font-size: 15px; }
.lnav { display: flex; gap: 12px; justify-content: space-between; flex-wrap: wrap; align-items: center; }

/* ---- 図 ---- */
.dg { padding: 16px; display: grid; gap: 12px; border-style: dashed; }
.dg-cap { font-size: 14px; color: var(--muted); line-height: 1.6; }
.dg-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.dg-col { display: grid; gap: 8px; }
.bx {
  border: 1.5px solid var(--rule); border-radius: 10px; padding: 6px 12px; font-size: 14px; line-height: 1.5;
  background: var(--panel); text-align: center; font-family: var(--f-code);
}
.bx small { display: block; color: var(--muted); font-size: 11px; font-family: var(--f-body); }
.bx.tool { border-style: dashed; }
.lit { animation: lit var(--dur, 4s) linear infinite; animation-delay: var(--d, 0s); }
@keyframes lit {
  0% { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  20%, 100% { border-color: var(--rule); box-shadow: none; }
}
.ar { width: 26px; height: 12px; position: relative; flex: none; }
.ar::before { content: ""; position: absolute; left: 0; right: 4px; top: 5px; height: 2px; background: var(--rule); }
.ar::after { content: ""; position: absolute; right: 0; top: 1px; border: 5px solid transparent; border-left: 7px solid var(--rule); border-right: 0; }
.ar i { position: absolute; top: 3px; left: 0; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: travel var(--dur, 4s) linear infinite; animation-delay: var(--d, 0s); opacity: 0; }
@keyframes travel { 0% { left: 0; opacity: 1; } 14% { left: 18px; opacity: 1; } 15%, 100% { opacity: 0; } }
.vbox { border: 2px solid var(--c-num); border-radius: 10px; min-width: 84px; text-align: center; padding: 4px 10px 6px; display: grid; background: var(--panel); }
.vbox .vname { font-family: var(--f-code); font-size: 12px; color: var(--c-num); font-weight: 700; }
.vbox .vval { font-family: var(--f-code); font-size: 20px; font-weight: 700; line-height: 1.3; }
.swap { display: inline-grid; }
.swap > * { grid-area: 1 / 1; animation: swapA 5s infinite; }
.swap > *:last-child { animation-name: swapB; }
@keyframes swapA { 0%, 45% { opacity: 1; transform: none; } 50%, 95% { opacity: 0; transform: translateY(-6px); } 100% { opacity: 1; } }
@keyframes swapB { 0%, 45% { opacity: 0; transform: translateY(6px); } 50%, 95% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.alt-a { animation: altA 5s infinite; }
.alt-b { animation: altB 5s infinite; }
@keyframes altA { 0%, 45% { border-color: var(--accent); background: var(--accent-soft); } 50%, 100% { border-color: var(--rule); background: var(--panel); } }
@keyframes altB { 0%, 45% { border-color: var(--rule); background: var(--panel); } 50%, 95% { border-color: var(--accent); background: var(--accent-soft); } 100% { border-color: var(--rule); } }
.cells { display: flex; flex-wrap: wrap; gap: 6px; }
.cell { display: grid; gap: 2px; justify-items: center; }
.cell .bx { min-width: 52px; font-size: 18px; font-weight: 700; }
.cell small { font-size: 11px; color: var(--muted); font-family: var(--f-code); }
.cell.round .bx { border-radius: 50%; width: 44px; height: 44px; min-width: 0; padding: 0; display: grid; place-items: center; }
.kv { display: grid; grid-template-columns: auto 26px auto; gap: 6px 8px; align-items: center; justify-content: start; }
.tt { display: grid; grid-template-columns: repeat(4, auto); gap: 6px 8px; justify-content: start; align-items: center; font-size: 14px; }
.tt .h { font-size: 11px; color: var(--muted); font-weight: 700; }
.tt .okm { color: var(--ok); font-weight: 700; font-size: 18px; }

@media (max-width: 760px) {
  .how, .two { grid-template-columns: minmax(0, 1fr); }
  .topbar .where { font-size: 12px; }
}
@media (max-width: 480px) {
  body { font-size: 15px; }
  .route::before, .route::after { left: 17px; }
  .stage { grid-template-columns: 38px minmax(0, 1fr); gap: 8px; }
  .station { width: 38px; height: 38px; font-size: 17px; }
  .code { font-size: 12.5px; }
  .cl { grid-template-columns: 2.4em minmax(0, 1fr); }
  .cl::before { padding-right: 8px; }
  .lrow { grid-template-columns: 24px minmax(0, 1fr) auto; padding: 8px 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .swap > *:last-child { display: none; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
'use strict';
const DATA = {"stages":[{"no":1,"title":"はじめの一歩","lessons":["01","02","03"],"can":"プログラムを動かし、計算した結果を表示できる"},{"no":2,"title":"流れをつくる","lessons":["04","05","06"],"can":"条件で動きを変え、くりかえし、関数にまとめられる"},{"no":3,"title":"データをまとめる","lessons":["07","08","09"],"can":"たくさんのデータを、配列・辞書・文字列であつかえる"},{"no":4,"title":"大きく作る","lessons":["10","11","12"],"can":"データと処理をまとめ、ファイルを分けて整理できる"},{"no":5,"title":"こわれないプログラム","lessons":["13","14","15"],"can":"失敗にそなえ、ファイルを読み書きし、テストで確かめられる"},{"no":6,"title":"一人前へ","lessons":["16","17","18"],"can":"その言語の道具を使いこなし、小さな作品を自分で作れる"}],"lessons":{"10":{"title":"データと処理をまとめる","goal":"関係のあるデータと、それをあつかう処理を、1つにまとめられるようになる。","body":["銀行の口座には、「持ち主」「残高」というデータと、「入金する」「残高を見る」という操作があります。これをばらばらの変数と関数で持つと、どれがどれの物か、すぐにわからなくなります。","クラスや構造体は「設計図」です。設計図から、実物（インスタンス）をいくつでも作れます。実物は、それぞれが自分のデータを持っています。","もう1つ大事なのは、中のデータを外から勝手に変えられないように守ることです。「残高は、入金の操作を通してしか変えられない」としておけば、おかしな値になるのを防げます。"],"diagram":"class","quiz":{"q":"同じ設計図から作った2つの実物 a と b。a の残高を増やすと、b の残高は？","choices":["いっしょに増える","変わらない","0 になる"],"answer":1,"why":"実物は、それぞれが自分のデータを持っています。a を変えても、b は変わりません。"},"task":"名前と体力（HP）を持つ「キャラクター」を作り、「ダメージを受ける」操作を足してみよう。HP が 0 より小さくならないようにしよう。","hint":"ダメージを引いたあと、0 より小さければ 0 にします。"},"11":{"special":true,"title":"この言語ならでは ①"},"12":{"title":"ファイルを分ける","goal":"プログラムをいくつかのファイルに分けて、たがいに使えるようになる。","body":["プログラムが大きくなると、1つのファイルでは、どこに何があるかわからなくなります。そこで、役割ごとにファイルを分けます。","分けるときに大事なのは、「外に見せる物」と「中だけで使う物」を区別することです。外に見せる物が少ないほど、あとで中身を直しやすくなります。","ほかの人が作ったライブラリを使うのも、同じしくみです。ここがわかると、世界中の人が作った部品を、自分のプログラムに組みこめるようになります。"],"diagram":"module","quiz":{"q":"ファイルを分ける、いちばんの理由は？","choices":["プログラムが速くなるから","どこに何があるかがわかりやすく、直しやすくなるから","ファイルの数が多いほうがよいから"],"answer":1,"why":"ファイルを分けるのは、人間のためです。役割ごとに分かれていれば、読むのも直すのも楽になります。"},"task":"「長方形の面積」と「円の面積」を計算する関数をまとめたファイルを新しく作り、メインのファイルから使ってみよう。","hint":"下のコードの「あいさつ」のファイルをまねして、もう1つファイルを作ります。"},"13":{"title":"エラーにそなえる","goal":"失敗するかもしれない処理に、きちんと対応できるようになる。","body":["プログラムは失敗します。ファイルがない、数のはずが文字だった、0 で割った、通信が切れた。どれだけ気をつけても、起きるときは起きます。","大事なのは、「失敗をなかったことにしない」ことです。失敗に気づき、何が起きたかをわかりやすく伝え、できるなら立てなおす。これがエラー処理です。","やり方は、言語によって大きく2つに分かれます。失敗したら「例外」を投げて、別の場所で受けとめる方式。そして、失敗を「値」として返し、呼んだ側がその場で確かめる方式です。"],"diagram":"error","quiz":{"q":"エラーが起きたとき、いちばんよくない対応は？","choices":["何が起きたかを表示する","何もせず、エラーをなかったことにして先に進む","処理を中止する"],"answer":1,"why":"エラーをなかったことにすると、おかしなデータのまま動きつづけ、原因がわからなくなります。"},"task":"文字列を数に変えて 2 倍にする関数を作り、数でない文字列を渡されたときは「数を入れてください」と表示するようにしてみよう。","hint":"下のコードの「数ではありません」の部分が、そのまま使えます。"},"14":{"title":"ファイルの読み書き","goal":"データをファイルに保存し、読みもどせるようになる。","body":["変数の中身は、プログラムが終わると消えてしまいます。残しておきたいデータは、ファイルに書きます。","流れは、どの言語でも同じです。開く → 読む（または書く）→ 閉じる。閉じるのを忘れると、書いたはずのデータが消えることがあります。自動で閉じてくれる書き方があれば、それを使います。","ファイルは、「ないかもしれない」「読めないかもしれない」物です。だから、エラー処理といつもセットです。文字コードは UTF-8 にそろえておくと、文字化けを防げます。"],"diagram":"file","quiz":{"q":"すでにあるファイルを「書きこみ」で開いて書くと、もとの中身は？","choices":["後ろに追加される","消えて、新しい中身になる","変わらない"],"answer":1,"why":"「書きこみ」は、中身を消して新しく書きます。後ろに足したいときは「追加」で開きます。"},"task":"好きな言葉を 3 つファイルに書き、読みこんで、番号つきで逆の順番に表示してみよう。","hint":"読みこんだ行を配列にしてから、逆の順番にします。"},"15":{"title":"テストを書く","goal":"プログラムが正しく動くことを、プログラムで確かめられるようになる。","body":["ある所を直したら、別の所がこわれた。プログラミングでは、本当によくあります。でも、直すたびに全部を手で確かめるのは無理です。","テストは、「この入力なら、この結果になるはず」をコードで書いた物です。一度書いておけば、コマンド1つで、何度でも全部を確かめられます。","テストがあると、安心してコードを直せます。仕事では、テストのないコードは「まだ完成していない」と見なされることが多いです。"],"diagram":"test","quiz":{"q":"テストを書く、いちばんの利点は？","choices":["プログラムが速くなる","コードを直したとき、こわれていないかをすぐ確かめられる","コードが短くなる"],"answer":1,"why":"テストは「こわれたら、すぐ知らせてくれる見はり番」です。だから、安心して直せます。"},"task":"「うるう年かどうか」を返す関数を作り、2024（うるう年）、2023（ちがう）、1900（ちがう）、2000（うるう年）のテストを書いてみよう。","hint":"4 で割り切れる年はうるう年。ただし、100 で割り切れる年はちがいます。でも、400 で割り切れる年はうるう年です。"},"16":{"special":true,"title":"この言語ならでは ②"},"17":{"title":"道具をそろえる","goal":"その言語の仕事で使われる道具（ライブラリの管理、書き方をそろえる道具、まちがいを探す道具）を知る。","body":["一人前の人は、コードを書く力だけでなく、道具を使いこなしています。道具は、めんどうな作業を引き受け、まちがいを早く見つけてくれます。","まず「パッケージ管理」。世界中の人が作ったライブラリを、コマンド1つで入れられます。次に「フォーマッタ」。書き方を自動でそろえます。そして「リンター」。あやしい書き方を教えてくれます。","わからないことは、まず公式のドキュメントで調べます。エラーメッセージは、最後まで読みます。この2つの習慣が、いちばんの道具です。"],"diagram":"tools","quiz":{"q":"フォーマッタ（書き方を自動でそろえる道具）を使う理由は？","choices":["プログラムが速くなるから","だれが書いても同じ見た目になり、読みやすくなるから","まちがいが全部なおるから"],"answer":1,"why":"見た目がそろっていると、中身に集中して読めます。「どこで改行するか」で話し合う時間もなくなります。"},"task":"自分のパソコンにこの言語を入れて、下のコマンドを上から順にためしてみよう。これまでのレッスンのコードに、書き方をそろえる道具をかけてみよう。","hint":"入れ方は、公式サイトの「インストール」や「Download」のページにあります。"},"18":{"title":"卒業制作：単語カウンター","goal":"これまで学んだことを全部使って、1つの役に立つプログラムを読み、自分でも作れるようになる。","body":["文章の中に、どの単語が何回出てくるかを数えるプログラムです。小さなプログラムですが、関数、くりかえし、辞書、文字列、ならべかえ、エラー処理が全部入っています。","まずコードを読んで、「どの部分が何をしているか」を声に出して説明してみましょう。説明できたら、次は何も見ずに、自分で一から書いてみます。書けたら、このコースは卒業です。","作るときのコツは、いきなり全部を書かないことです。仕事を小さく分け、1つ書くたびに動かして確かめます。一人前の人ほど、小さく作って、こまめに動かしています。"],"diagram":"build","quiz":{"q":"大きなプログラムを作るとき、よい進め方は？","choices":["全部書き終わってから、はじめて動かす","小さく分けて、1つ書くたびに動かして確かめる","長い関数を1つだけ書く"],"answer":1,"why":"小さく作って確かめれば、まちがいの場所がすぐわかります。全部書いてから動かすと、どこが悪いのか探すのが大変です。"},"task":"自分で改造してみよう。(1) 上位 3 個ではなく 5 個表示する。(2) 文章をファイルから読みこむ。(3) 3 文字以下の単語は数えない。","hint":"(2) は「ファイルの読み書き」、(3) は「条件分岐」のレッスンを見なおそう。"},"01":{"title":"動かして、表示する","goal":"プログラムを書いて動かし、画面に文字を表示できるようになる。","body":["プログラムは、コンピュータへの「命令を書いた文章」です。とくに指示がなければ、上から順に1行ずつ実行されます。","最初の一歩は、画面に文字を出すことです。地味に見えますが、「いま、ここまで動いている」「この値はいくつか」を確かめる、いちばんの方法でもあります。一人前になっても毎日使います。","コードの中には「コメント」を書けます。人間のためのメモで、コンピュータは読み飛ばします。「なぜこう書いたか」を残しておくと、未来の自分が助かります。"],"diagram":"flow","quiz":{"q":"プログラムは、ふつうどの順番で実行される？","choices":["上から下へ、1行ずつ","下から上へ","短い行から先に"],"answer":0,"why":"とくに指示（条件分岐やくりかえし）がなければ、上から順に1行ずつ実行されます。"},"task":"自分の名前と、好きな食べ物を表示するように書きかえてみよう。","hint":"表示の命令を2行書きます。文字は \" \" で囲みます。"},"02":{"title":"変数と型","goal":"値に名前をつけて入れておく「変数」と、値の種類である「型」がわかる。","body":["変数は、値を入れておく「名前のついた箱」です。一度入れておけば、名前を書くだけで何度でも使えます。中身をあとから入れかえることもできます。","値には種類があります。整数、小数、文字列（文字のならび）、真・偽（はい／いいえ）。これを「型」といいます。数は計算でき、文字列はつなげられる、というように、型によってできることが変わります。","言語には、変数の型を書いて決める物（静的型）と、書かなくてよい物（動的型）があります。型を書く言語は、まちがいを動かす前に見つけてくれます。書かない言語は、短く手軽に書けます。"],"diagram":"var","quiz":{"q":"15 と \"15\" のちがいは？","choices":["どちらも同じ","15 は数、\"15\" は文字列","\"15\" のほうが大きい"],"answer":1,"why":"クォートで囲むと文字列になります。見た目は同じでも、文字列のままでは計算できません。"},"task":"自分の名前・年れい・身長を変数に入れて、表示してみよう。そのあと年れいを 10 増やして、もう一度表示しよう。","hint":"年れいは整数、身長は小数、名前は文字列にします。"},"03":{"title":"計算と文字列","goal":"数の計算と、文字列をつなげることができるようになる。","body":["足し算・引き算・かけ算・割り算は + - * / で書きます。% は「割り算のあまり」です。「2 で割ったあまりが 0 なら偶数」のように、思ったよりよく使います。","割り算には注意が必要です。整数どうしの割り算が「切りすて」になる言語と、小数になる言語があります。この言語はどちらか、下のコードで確かめましょう。","文字列は、つなげて長い文字列にできます。変数の値を文字列の中にうめこむ書き方も、どの言語にもあります。メッセージを作るときに毎回使います。"],"diagram":"concat","quiz":{"q":"17 % 5（17 を 5 で割ったあまり）はいくつ？","choices":["3","2","3.4"],"answer":1,"why":"17 = 5 × 3 + 2 なので、あまりは 2 です。"},"task":"たて 8、横 5 の長方形の面積と、まわりの長さを計算して、「面積: 40」のように表示してみよう。","hint":"面積は たて × 横、まわりの長さは (たて + 横) × 2 です。"},"04":{"title":"条件分岐","goal":"条件によって、することを変えられるようになる。","body":["「もし〜なら、こうする。そうでなければ、ああする」。これが条件分岐です。プログラムが「考えている」ように見えるのは、条件分岐があるからです。","条件は、「成り立つ（真）」か「成り立たない（偽）」のどちらかになる式です。大きい・小さい・等しいの比較で作り、「かつ」「または」で組み合わせます。","条件は上から順に調べられ、最初に当てはまった所だけが実行されます。だから、書く順番が大事です。"],"diagram":"branch","quiz":{"q":"点数が 85 のとき、「80 以上なら A、60 以上なら B、それ以外は C」の順で調べると、表示されるのは？","choices":["A だけ","A と B の両方","B だけ"],"answer":0,"why":"85 は「60 以上」にも当てはまりますが、実行されるのは最初に当てはまった所だけです。"},"task":"年れいの変数を作り、6 さい未満なら「無料」、13 さい未満なら「子ども料金」、それ以外は「大人料金」と表示してみよう。","hint":"小さいほうの条件から順に書きます。年れいを変えて、3つとも表示されるか確かめよう。"},"05":{"title":"くりかえし","goal":"同じ処理を、決まった回数や、条件が成り立つあいだ、くりかえせるようになる。","body":["コンピュータは、同じことを何万回でも、まちがえずにくりかえせます。くりかえしを書けると、できることが一気に広がります。","くりかえしには2種類あります。「10 回」のように回数が決まっているものと、「〜のあいだ」のように条件で続けるものです。","条件がずっと成り立ったままだと、永遠に終わらない「無限ループ」になります。だれもが一度はやります。あわてずに Ctrl + C で止めましょう。"],"diagram":"loop","quiz":{"q":"1 から 10 までくりかえして、数を全部足すといくつ？","choices":["10","55","100"],"answer":1,"why":"1 + 2 + … + 10 = 55 です。くりかえしと「合計を入れる変数」の組み合わせは、定番中の定番です。"},"task":"1 から 30 までの数のうち、3 の倍数だけを表示してみよう。","hint":"「3 で割ったあまりが 0」なら 3 の倍数です。"},"06":{"title":"関数","goal":"処理に名前をつけてまとめ、何度でも呼び出せるようになる。","body":["関数は、「材料（引数）を入れると、結果（戻り値）が出てくる機械」です。一度作っておけば、名前を書くだけで何度でも使えます。","関数にまとめると、同じ処理を何度も書かずにすみます。名前を見れば何をしているかがわかり、直すときも1か所ですみます。","コツは「1つの関数には、1つの仕事」です。関数が長くなってきたら、分けどきです。"],"diagram":"func","quiz":{"q":"関数を作っただけで、どこからも呼び出さなかったら？","choices":["自動で1回動く","何も起きない","必ずエラーになる"],"answer":1,"why":"関数は、作っただけでは動きません。名前を書いて呼び出したときに、はじめて動きます。"},"task":"3つの数を受けとって、いちばん大きい数を返す関数を作ってみよう。","hint":"まず1つ目を「いまのところ一番」として、2つ目・3つ目とくらべていきます。"},"07":{"title":"配列・リスト","goal":"たくさんのデータを順番にならべて、まとめてあつかえるようになる。","body":["30 人分の点数を、変数 30 個で持つのは大変です。配列（リスト）は、データを順番にならべて、1つにまとめた物です。","中のデータは番号で取り出します。番号は 0 から始まります。3 個入っていれば、使える番号は 0・1・2 です。はんいの外の番号を使うのは、いちばん多いまちがいの1つです。","配列は、くりかえしと組み合わせて使います。「全部足す」「いちばん大きい物を探す」「条件に合う物だけ取り出す」。データを処理するプログラムの基本形です。"],"diagram":"array","quiz":{"q":"5 個のデータが入った配列で、最後のデータの番号は？","choices":["5","4","6"],"answer":1,"why":"番号は 0 から始まるので、5 個なら 0・1・2・3・4。最後は 4 です。"},"task":"5 日分の気温を配列に入れて、平均気温と、いちばん低い気温を表示してみよう。","hint":"合計を個数で割ると平均です。いちばん低い気温は、最高点の探し方を逆にします。"},"08":{"title":"辞書・マップ","goal":"「名前」で値を出し入れできる、辞書（マップ）を使えるようになる。","body":["配列は番号でデータを取り出しました。辞書（マップ、連想配列、ハッシュともいいます）は、「キー」という名前で値を取り出します。「りんご → 120 円」のような組を、いくつも入れておけます。","電話帳、単語帳、設定など、「〜に対する〜」というデータは、全部辞書で表せます。Web でやりとりするデータ（JSON）も、この形です。","辞書を使うときは、「そのキーがなかったら？」をいつも考えます。言語によって、エラーになったり、「何もない」という値が返ったりします。"],"diagram":"map","quiz":{"q":"辞書（マップ）がいちばん向いているのは？","choices":["順番にならんだ点数の一覧","商品名から値段を調べる","1 から 100 まで足す"],"answer":1,"why":"「名前から値を調べる」のが辞書の仕事です。順番にならんだデータなら、配列が向いています。"},"task":"3 人の名前と年れいを辞書に入れて、全員を「〇〇 は △ さい」と表示してみよう。そのあと、いない人の名前で調べたときに「いません」と表示しよう。","hint":"キーを名前、値を年れいにします。"},"09":{"title":"文字列を使いこなす","goal":"文字列を、分ける・つなぐ・探す・置きかえることができるようになる。","body":["プログラムがあつかうデータの多くは文字です。人が入力した物、ファイルの中身、Web からとどいたデータ。どれも最初は文字列でやってきます。","よく使う操作は決まっています。分ける、つなぐ、探す、置きかえる、前後の空白を取る、大文字・小文字をそろえる。この6つができれば、たいていの仕事はこなせます。","日本語には注意が必要です。言語によっては、長さを「文字数」ではなく「バイト数」で数えます。日本語は1文字が3バイトあるので、数が合わなくなります。"],"diagram":"split","quiz":{"q":"\"a-b-c\" を \"-\" で分けると、いくつに分かれる？","choices":["2 つ","3 つ","5 つ"],"answer":1,"why":"区切りの \"-\" が 2 つあるので、\"a\"・\"b\"・\"c\" の 3 つに分かれます。"},"task":"\"2026-04-01\" という文字列を \"-\" で分けて、「2026年04月01日」と表示してみよう。","hint":"分けると 3 つの文字列になります。それぞれのあとに「年」「月」「日」をつなげます。"}},"langs":[{"id":"c","name":"C","type":"静的型","exec":"コンパイル","tagline":"コンピュータのしくみに、いちばん近い言語","about":"OS、家電やロボットの中のプログラム、ほかの言語そのものを作るのに使われます。メモリを自分で管理するので、コンピュータが中で何をしているかがよくわかります。","run":"gcc -Wall main.c -o main && ./main","flow":[["main.c","あなたが書く"],["gcc","コンパイラ","tool"],["main","機械語のファイル"],["CPU","が直接実行"]],"flowNote":"前もって機械語に翻訳するので、とても速く動きます。","ready":["ポインタを使って、関数から変数や配列を書きかえられる","malloc と free で、メモリを借りて、もれなく返せる","ヘッダとソースにファイルを分けて、Makefile でビルドできる","警告ゼロでコンパイルし、サニタイザでメモリのまちがいを見つけられる"],"next":["連結リストやハッシュ表など、データ構造を自分で作る","ファイルやネットワークをあつかう、小さなコマンドを作る","マイコン（Arduino や Raspberry Pi Pico）で、機械を動かす"],"lessons":{"10":{"points":["C にはクラスがありません。かわりに、データを `struct` にまとめ、それをあつかう関数を作ります。","`typedef struct { ... } Account;` と書くと、`Account` という名前の型として使えます。","関数に構造体を渡すと「コピー」が渡されます。中身を変えたいときは、`&a` で「場所（アドレス）」を渡します。","ポインタから中身を取り出すときは `->` を使います（`acc->balance`）。"],"files":[{"name":"main.c","main":true,"shell":false,"code":"#include \u003cstdio.h>\n\ntypedef struct {\n    char owner[32];\n    int balance;\n} Account;\n\n// 中身を変えるので、ポインタ（場所）で受けとる\nvoid deposit(Account *acc, int amount) {\n    acc->balance += amount;\n}\n\n// 読むだけなので const をつける\nvoid show(const Account *acc) {\n    printf(\"%s の残高: %d 円\\n\", acc->owner, acc->balance);\n}\n\nint main(void) {\n    Account a = {\"さくら\", 1000};\n    Account b = {\"たろう\", 300};\n\n    deposit(&a, 500);      // a の場所を渡す。a だけが増える\n    show(&a);\n    show(&b);\n    return 0;\n}"}],"output":"さくら の残高: 1500 円\nたろう の残高: 300 円","run":"gcc -Wall main.c -o main && ./main"},"11":{"points":["`&x` は「x の場所（アドレス）」、`*p` は「p が指している場所の中身」です。","`int *p` は「int の場所を入れる変数」。これがポインタです。","関数に場所を渡すと、関数の中から呼んだ側の変数を書きかえられます（`swap` が定番の例）。","配列の名前は、先頭の要素の場所を表します。`nums[i]` と `*(nums + i)` は同じ意味です。","どこも指していないポインタには `NULL` を入れます。`NULL` や、もう無い場所を `*` で読むと、プログラムが落ちます。"],"files":[{"name":"main.c","main":true,"shell":false,"code":"#include \u003cstdio.h>\n\n// 2つの変数の中身を入れかえる（場所を受けとる）\nvoid swap(int *a, int *b) {\n    int tmp = *a;\n    *a = *b;\n    *b = tmp;\n}\n\n// 配列は「先頭の場所」として渡される\nint sum(const int *nums, int count) {\n    int total = 0;\n    for (int i = 0; i \u003c count; i++) {\n        total += nums[i];\n    }\n    return total;\n}\n\nint main(void) {\n    int x = 5;\n    int *p = &x;            // p は x の場所を指す\n\n    printf(\"x = %d\\n\", x);\n    printf(\"*p = %d\\n\", *p);    // p が指す場所の中身\n\n    *p = 9;                 // p を通して x を書きかえる\n    printf(\"x = %d\\n\", x);\n\n    int a = 1, b = 2;\n    swap(&a, &b);           // 場所を渡す\n    printf(\"a = %d, b = %d\\n\", a, b);\n\n    int nums[] = {10, 20, 30};\n    printf(\"合計: %d\\n\", sum(nums, 3));\n    printf(\"2番目: %d\\n\", *(nums + 1));   // nums[1] と同じ\n\n    int *nothing = NULL;    // どこも指していない\n    if (nothing == NULL) {\n        printf(\"何も指していません\\n\");\n    }\n    return 0;\n}"}],"title":"ポインタ","goal":"「変数の場所（アドレス）」をあつかうポインタを使って、関数から変数を書きかえられるようになる。","intro":"ポインタは C でいちばん大事で、いちばんつまずきやすい所です。ポインタとは「変数がメモリのどこにあるか」という場所の情報です。場所がわかれば、はなれた所からその変数を読んだり書いたりできます。配列も文字列も、関数への受け渡しも、C ではすべてポインタで動いています。","quiz":{"q":"int x = 5; int *p = &x; *p = 9; のあと、x の値は？","choices":["5","9","場所を表す数"],"answer":1,"why":"p は x の場所を指しています。*p = 9 は「p が指している場所に 9 を入れる」なので、x が 9 になります。"},"task":"int の配列と個数を受けとり、全部の要素を2倍にする関数 double_all を作ってみよう。","hint":"void double_all(int *nums, int count) の中で、nums[i] *= 2; とします。配列を渡すと、先頭の場所が渡されます。","output":"x = 5\n*p = 5\nx = 9\na = 2, b = 1\n合計: 60\n2番目: 20\n何も指していません","run":"gcc -Wall main.c -o main && ./main"},"12":{"points":["C では、関数の「形」をヘッダファイル（`.h`）に、「中身」をソースファイル（`.c`）に書いて分けます。","使う側は `#include \"greeting.h\"` と書きます。自分で作ったヘッダは `\" \"`、最初からある物は `\u003c >` で囲みます。","`#ifndef` 〜 `#endif` は、同じヘッダを2回読みこまないためのおまじないです（インクルードガード）。","コンパイルするときは、`.c` ファイルを全部ならべます: `gcc main.c greeting.c -o main`"],"files":[{"name":"greeting.h","main":false,"shell":false,"code":"// あいさつを作る部品（関数の形だけを書く）\n#ifndef GREETING_H\n#define GREETING_H\n\nvoid hello(const char *name);\nvoid bye(const char *name);\n\n#endif"},{"name":"greeting.c","main":false,"shell":false,"code":"// あいさつを作る部品（関数の中身を書く）\n#include \u003cstdio.h>\n#include \"greeting.h\"\n\nvoid hello(const char *name) {\n    printf(\"こんにちは、%sさん\\n\", name);\n}\n\nvoid bye(const char *name) {\n    printf(\"さようなら、%sさん\\n\", name);\n}"},{"name":"main.c","main":true,"shell":false,"code":"#include \"greeting.h\"\n\nint main(void) {\n    hello(\"さくら\");\n    bye(\"さくら\");\n    return 0;\n}"}],"output":"こんにちは、さくらさん\nさようなら、さくらさん","run":"gcc -Wall main.c greeting.c -o main && ./main"},"13":{"points":["C には例外（try / catch）がありません。関数が「うまくいったか」を返す値で知らせ、呼ぶ側が必ず確かめます。","よくある形: 成功なら 0、失敗なら 0 以外を返す。結果そのものは、ポインタの引数に書きこみます。","返す値を確かめるのを忘れると、失敗に気づかないまま動きつづけます。確かめるのは呼ぶ側の責任です。","文字列を数に変えるときは `strtol` を使うと、「数に変えられなかった」ことがわかります（`atoi` ではわかりません）。"],"files":[{"name":"main.c","main":true,"shell":false,"code":"#include \u003cstdio.h>\n#include \u003cstdlib.h>\n\n// 成功なら 0、失敗なら -1 を返す。答えは *result に入れる\nint divide(int a, int b, int *result) {\n    if (b == 0) {\n        return -1;\n    }\n    *result = a / b;\n    return 0;\n}\n\n// 文字列を数にする。成功なら 0、失敗なら -1\nint parse_int(const char *text, int *result) {\n    char *end;\n    long value = strtol(text, &end, 10);\n    if (end == text || *end != '\\0') {    // 数として読めなかった\n        return -1;\n    }\n    *result = (int)value;\n    return 0;\n}\n\nint main(void) {\n    int answer;\n\n    if (divide(10, 2, &answer) == 0) {\n        printf(\"10 ÷ 2 = %d\\n\", answer);\n    }\n    if (divide(10, 0, &answer) != 0) {\n        printf(\"エラー: 0 で割ることはできません\\n\");\n    }\n\n    const char *text = \"abc\";\n    int number;\n    if (parse_int(text, &number) != 0) {\n        printf(\"\\\"%s\\\" は数ではありません\\n\", text);\n    }\n    printf(\"チェック終わり\\n\");\n    return 0;\n}"}],"output":"10 ÷ 2 = 5\nエラー: 0 で割ることはできません\n\"abc\" は数ではありません\nチェック終わり","run":"gcc -Wall main.c -o main && ./main"},"14":{"points":["ファイルは `fopen` で開き、使い終わったら必ず `fclose` で閉じます。","`\"w\"` は書きこみ（中身は消えて新しくなる）、`\"r\"` は読みこみ、`\"a\"` は後ろに追加です。","`fopen` は、開けなかったとき `NULL` を返します。必ず確かめてから使います。","`fprintf` でファイルに書き、`fgets` で1行ずつ読みます。`fgets` は改行もいっしょに読みこみます。"],"files":[{"name":"main.c","main":true,"shell":false,"code":"#include \u003cstdio.h>\n#include \u003cstring.h>\n\nint main(void) {\n    const char *lines[] = {\"牛乳を買う\", \"宿題をする\", \"本を読む\"};\n    int count = 3;\n\n    // 書きこむ\n    FILE *out = fopen(\"memo.txt\", \"w\");\n    if (out == NULL) {\n        printf(\"memo.txt を作れませんでした\\n\");\n        return 1;\n    }\n    for (int i = 0; i \u003c count; i++) {\n        fprintf(out, \"%s\\n\", lines[i]);\n    }\n    fclose(out);                              // 必ず閉じる\n    printf(\"%d 行 書きました\\n\", count);\n\n    // 読みこむ\n    FILE *in = fopen(\"memo.txt\", \"r\");\n    if (in == NULL) {\n        return 1;\n    }\n    char buf[256];\n    int no = 1;\n    while (fgets(buf, sizeof(buf), in) != NULL) {\n        buf[strcspn(buf, \"\\n\")] = '\\0';       // 行の終わりの改行を取る\n        printf(\"%d: %s\\n\", no, buf);\n        no++;\n    }\n    fclose(in);\n\n    // ないファイルを開こうとしたとき\n    FILE *none = fopen(\"ない.txt\", \"r\");\n    if (none == NULL) {\n        printf(\"ない.txt は開けませんでした\\n\");\n    }\n    return 0;\n}"}],"output":"3 行 書きました\n1: 牛乳を買う\n2: 宿題をする\n3: 本を読む\nない.txt は開けませんでした","run":"gcc -Wall main.c -o main && ./main"},"15":{"points":["`assert(条件)` は、条件が成り立たなければ、その場でプログラムを止めて、ファイル名と行番号を表示します。","C には決まったテストの道具がないので、まずは `assert` で「こうなるはず」を書くのが手軽です。","仕事では Unity や CTest、GoogleTest などのテストの道具が使われます。","テストしやすいように、「計算する関数」と「表示する所」を分けておきます。"],"files":[{"name":"main.c","main":true,"shell":false,"code":"#include \u003cassert.h>\n#include \u003cstdio.h>\n#include \u003cstring.h>\n\n// n に合う言葉を out に書きこむ\nvoid fizzbuzz(int n, char *out, size_t size) {\n    if (n % 15 == 0) {\n        snprintf(out, size, \"FizzBuzz\");\n    } else if (n % 3 == 0) {\n        snprintf(out, size, \"Fizz\");\n    } else if (n % 5 == 0) {\n        snprintf(out, size, \"Buzz\");\n    } else {\n        snprintf(out, size, \"%d\", n);\n    }\n}\n\n// 「n のとき expected になるはず」を確かめる\nvoid check(int n, const char *expected) {\n    char actual[16];\n    fizzbuzz(n, actual, sizeof(actual));\n    assert(strcmp(actual, expected) == 0);\n    printf(\"OK   %d は %s\\n\", n, expected);\n}\n\nint main(void) {\n    check(3, \"Fizz\");\n    check(5, \"Buzz\");\n    check(15, \"FizzBuzz\");\n    check(7, \"7\");\n    printf(\"すべてのテストに合格\\n\");\n    return 0;\n}"}],"output":"OK   3 は Fizz\nOK   5 は Buzz\nOK   15 は FizzBuzz\nOK   7 は 7\nすべてのテストに合格","run":"gcc -Wall main.c -o main && ./main"},"16":{"points":["`malloc(バイト数)` でメモリを借ります。失敗すると `NULL` が返るので、必ず確かめます。","`sizeof(int)` は int 1つ分の大きさ。`n * sizeof(int)` で n 個分を借りられます。","`realloc` は、借りたメモリの大きさを変えます。","使い終わったら `free` で返します。「1回借りたら、1回返す」がきまりです。","返したあとのポインタには `NULL` を入れておくと、まちがって使うのを防げます。"],"files":[{"name":"main.c","main":true,"shell":false,"code":"#include \u003cstdio.h>\n#include \u003cstdlib.h>\n\n// あとから大きくなる配列\ntypedef struct {\n    int *data;       // 借りたメモリの場所\n    int count;       // いま入っている数\n    int capacity;    // 入れられる数\n} IntList;\n\n// 後ろに追加する。いっぱいなら、入れ物を2倍に広げる\nint push(IntList *list, int value) {\n    if (list->count == list->capacity) {\n        int new_cap = list->capacity == 0 ? 2 : list->capacity * 2;\n        int *bigger = realloc(list->data, (size_t)new_cap * sizeof(int));\n        if (bigger == NULL) {\n            return -1;           // 借りられなかった\n        }\n        list->data = bigger;\n        list->capacity = new_cap;\n        printf(\"  （入れ物を %d 個分に広げました）\\n\", new_cap);\n    }\n    list->data[list->count] = value;\n    list->count++;\n    return 0;\n}\n\nint main(void) {\n    IntList list = {NULL, 0, 0};\n\n    for (int i = 1; i \u003c= 5; i++) {\n        if (push(&list, i * 10) != 0) {\n            printf(\"メモリが足りません\\n\");\n            return 1;\n        }\n    }\n\n    for (int i = 0; i \u003c list.count; i++) {\n        printf(\"%d \", list.data[i]);\n    }\n    printf(\"\\n個数: %d\\n\", list.count);\n\n    free(list.data);         // 借りたメモリを返す\n    list.data = NULL;        // もう使えないしるし\n    return 0;\n}"}],"title":"メモリを自分で管理する（malloc と free）","goal":"必要な大きさのメモリを malloc で借りて、free で返せるようになる。「あとから大きくなる配列」を作れるようになる。","intro":"ふつうの配列は、大きさを先に決めなければなりません。「何個になるか動かしてみないとわからない」ときは、動いている最中にメモリを借ります。借りたメモリは、自分で返さなければなりません。返し忘れ（メモリリーク）や、返したあとに使ってしまうまちがいは、C の仕事でいちばん多い不具合の原因です。","quiz":{"q":"malloc で借りたメモリを free しないまま、プログラムが長く動きつづけるとどうなる？","choices":["自動で返される","使えるメモリが少しずつへっていく（メモリリーク）","すぐにコンパイルエラーになる"],"answer":1,"why":"C には自動で片づけるしくみがありません。返し忘れたメモリは、プログラムが終わるまで使われたままになります。"},"task":"数を n 個入れられる配列を malloc で作り、1 から n までを入れて合計を表示し、最後に free する関数を書いてみよう。","hint":"int *nums = malloc(n * sizeof(int)); のあと、NULL でないか確かめてから使います。","output":"  （入れ物を 2 個分に広げました）\n  （入れ物を 4 個分に広げました）\n  （入れ物を 8 個分に広げました）\n10 20 30 40 50 \n個数: 5","run":"gcc -Wall main.c -o main && ./main"},"17":{"points":["`-Wall -Wextra` をつけてコンパイルすると、あやしい所を警告してくれます。警告は 0 にするのが目標です。","`-g -fsanitize=address` をつけると、配列のはんい外やメモリの返し忘れを、動かしたときに見つけてくれます。C を書くなら必ず使いたい道具です。","`make` は、「どのファイルをどうコンパイルするか」を `Makefile` に書いておき、1つのコマンドで作れるようにする道具です。","`gdb`（または `lldb`）は、プログラムを1行ずつ止めながら動かして、変数の中身を見られるデバッガです。"],"files":[{"name":"shell","main":false,"shell":true,"code":"# 警告を全部出してコンパイルする\ngcc -Wall -Wextra -o main main.c\n\n# メモリのまちがいを見つけるチェックつきでコンパイルして、動かす\ngcc -g -fsanitize=address,undefined -o main main.c\n./main\n\n# Makefile があるプロジェクトなら\nmake\nmake clean\n\n# 書き方をそろえる\nclang-format -i main.c\n\n# デバッガで1行ずつ動かす\ngdb ./main"}]},"18":{"points":["「単語に分ける → 数える → ならべる → 表示する」と、仕事ごとに関数を分けています。","辞書がないので、「単語と回数」の構造体の配列を使い、同じ単語を自分で探しています。","ならべかえは `qsort`。「どちらを先にするか」を決める関数を渡します（関数ポインタ）。","入れ物の大きさ（`MAX_WORDS`、`MAX_LEN`）をこえないように、毎回確かめています。"],"files":[{"name":"main.c","main":true,"shell":false,"code":"#include \u003cctype.h>\n#include \u003cstdio.h>\n#include \u003cstdlib.h>\n#include \u003cstring.h>\n\n#define MAX_WORDS 100\n#define MAX_LEN 32\n\ntypedef struct {\n    char word[MAX_LEN];\n    int count;\n} Entry;\n\n// 単語を1つ数える。全体の種類の数を返す\nint add_word(Entry entries[], int kinds, const char *word) {\n    for (int i = 0; i \u003c kinds; i++) {\n        if (strcmp(entries[i].word, word) == 0) {\n            entries[i].count++;\n            return kinds;\n        }\n    }\n    if (kinds \u003c MAX_WORDS) {\n        snprintf(entries[kinds].word, MAX_LEN, \"%s\", word);\n        entries[kinds].count = 1;\n        kinds++;\n    }\n    return kinds;\n}\n\n// 文章を単語に分けて数える。単語の総数を返す\nint count_words(const char *text, Entry entries[], int *kinds) {\n    char word[MAX_LEN];\n    int len = 0, total = 0;\n    for (const char *p = text;; p++) {\n        if (isalpha((unsigned char)*p) && len \u003c MAX_LEN - 1) {\n            word[len++] = (char)tolower((unsigned char)*p);\n        } else if (len > 0) {           // 単語の終わり\n            word[len] = '\\0';\n            *kinds = add_word(entries, *kinds, word);\n            total++;\n            len = 0;\n        }\n        if (*p == '\\0') {\n            break;\n        }\n    }\n    return total;\n}\n\n// 回数の多い順（同じならアルファベット順）\nint compare(const void *a, const void *b) {\n    const Entry *x = a, *y = b;\n    if (x->count != y->count) {\n        return y->count - x->count;\n    }\n    return strcmp(x->word, y->word);\n}\n\n// 成功なら 0、単語がなければ -1\nint report(const char *text) {\n    Entry entries[MAX_WORDS];\n    int kinds = 0;\n    int total = count_words(text, entries, &kinds);\n    if (total == 0) {\n        return -1;\n    }\n    qsort(entries, (size_t)kinds, sizeof(Entry), compare);\n    printf(\"全部で %d 語、%d 種類\\n\", total, kinds);\n    for (int i = 0; i \u003c 3 && i \u003c kinds; i++) {\n        printf(\"%s: %d\\n\", entries[i].word, entries[i].count);\n    }\n    return 0;\n}\n\nint main(void) {\n    report(\"The cat saw the dog. The dog saw the bird!\");\n\n    if (report(\"...\") != 0) {\n        printf(\"エラー: 単語がありません\\n\");\n    }\n    return 0;\n}"}],"output":"全部で 10 語、5 種類\nthe: 4\ndog: 2\nsaw: 2\nエラー: 単語がありません","run":"gcc -Wall main.c -o main && ./main"},"01":{"points":["C のプログラムは `main` 関数から動きはじめます。","`#include \u003cstdio.h>` は、「表示などの道具を使います」という宣言です。`printf` を使うのに必要です。","`printf` は自動では改行しません。改行したい所に `\\n` を書きます。","文の終わりには `;` が必要です。`/* */` の間と、`//` から行の終わりまではコメントです。","C は、コンパイル（機械の言葉に翻訳）してから動かします。`gcc main.c -o main` で翻訳、`./main` で実行です。"],"files":[{"name":"main.c","main":true,"shell":false,"code":"/* はじめてのプログラム */\n#include \u003cstdio.h>\n\nint main(void) {\n    printf(\"こんにちは！\\n\");\n    printf(\"プログラミングをはじめます。\\n\");\n    printf(\"1 + 2 = %d\\n\", 1 + 2);   // %d の所に、後ろの値が入ります\n    return 0;                        // 0 は「問題なく終わった」のしるし\n}"}],"output":"こんにちは！\nプログラミングをはじめます。\n1 + 2 = 3","run":"gcc -Wall main.c -o main && ./main"},"02":{"points":["変数を作るときは、`int age = 15;` のように、先に型を書きます。","よく使う型: `int`（整数）、`double`（小数）、`char`（1文字）、`bool`（真・偽。`\u003cstdbool.h>` が必要）。","文字列の専用の型はなく、`char` の配列で表します（`char name[] = \"...\"`）。","`printf` では、型に合わせて `%d`（整数）、`%f`（小数）、`%s`（文字列）、`%c`（1文字）を使い分けます。","値を入れずに使った変数の中身は「でたらめ」です。必ず最初に値を入れましょう。"],"files":[{"name":"main.c","main":true,"shell":false,"code":"#include \u003cstdio.h>\n#include \u003cstdbool.h>\n\nint main(void) {\n    char name[] = \"さくら\";      // 文字列（char の配列）\n    int age = 15;                // 整数\n    double height = 152.5;       // 小数\n    bool is_student = true;      // 真か偽か（中身は 1 か 0）\n\n    printf(\"名前: %s\\n\", name);\n    printf(\"年れい: %d\\n\", age);\n    printf(\"身長: %.1f\\n\", height);      // %.1f は「小数点より下を1けた」\n    printf(\"学生: %d\\n\", is_student);    // true は 1 と表示されます\n\n    age = age + 1;               // 変数は、あとから入れなおせます\n    printf(\"来年は %d さい\\n\", age);\n    return 0;\n}"}],"output":"名前: さくら\n年れい: 15\n身長: 152.5\n学生: 1\n来年は 16 さい","run":"gcc -Wall main.c -o main && ./main"},"03":{"points":["整数どうしの `/` は、小数点より下を切りすてます（7 / 2 は 3）。小数がほしいときは、どちらかを小数にします。","`%` は割り算のあまりです。表示で `%` そのものを出したいときは `%%` と書きます。","文字列は `+` でつなげられません。`snprintf` で、新しい入れ物に書きこんで作ります。","`strlen` は文字列の長さ（バイト数）を返します。日本語は1文字が3バイトなので、文字数とは合いません。"],"files":[{"name":"main.c","main":true,"shell":false,"code":"#include \u003cstdio.h>\n#include \u003cstring.h>\n\nint main(void) {\n    int a = 7;\n    int b = 2;\n    printf(\"7 + 2 = %d\\n\", a + b);\n    printf(\"7 - 2 = %d\\n\", a - b);\n    printf(\"7 * 2 = %d\\n\", a * b);\n    printf(\"7 / 2 = %d\\n\", a / b);            // 整数どうしは切りすて\n    printf(\"7 / 2.0 = %.1f\\n\", a / 2.0);      // 小数にすると 3.5\n    printf(\"7 %% 2 = %d\\n\", a % b);           // あまり\n\n    char family[] = \"山田\";\n    char given[] = \"太郎\";\n    char full[64];                            // つないだ結果を入れる場所\n    snprintf(full, sizeof(full), \"%s %s\", family, given);\n    printf(\"フルネーム: %s\\n\", full);\n    printf(\"文字数: %zu\\n\", strlen(\"program\"));\n    return 0;\n}"}],"output":"7 + 2 = 9\n7 - 2 = 5\n7 * 2 = 14\n7 / 2 = 3\n7 / 2.0 = 3.5\n7 % 2 = 1\nフルネーム: 山田 太郎\n文字数: 7","run":"gcc -Wall main.c -o main && ./main"},"04":{"points":["`if (条件) { }` の形です。`else if` で次の条件、`else` で「どれでもないとき」です。","C では、0 が「偽」、0 以外が「真」です。","等しいかどうかは `==`。`if (x = 5)` と `=` 1つで書くと「入れる」になり、いつも真になってしまいます。","「かつ」は `&&`、「または」は `||`、「〜でない」は `!` です。","文字列が同じかどうかは `==` ではなく `strcmp(a, b) == 0` で調べます。"],"files":[{"name":"main.c","main":true,"shell":false,"code":"#include \u003cstdio.h>\n#include \u003cstdbool.h>\n#include \u003cstring.h>\n\nint main(void) {\n    int score = 72;\n\n    if (score >= 80) {\n        printf(\"よくできました\\n\");\n    } else if (score >= 60) {\n        printf(\"合格\\n\");\n    } else {\n        printf(\"もう少し\\n\");\n    }\n\n    int age = 15;\n    bool has_ticket = true;\n    if (age >= 12 && has_ticket) {\n        printf(\"入場できます\\n\");\n    }\n\n    char answer[] = \"yes\";\n    if (strcmp(answer, \"yes\") == 0) {     // 文字列は strcmp でくらべる\n        printf(\"ようこそ\\n\");\n    }\n    return 0;\n}"}],"output":"合格\n入場できます\nようこそ","run":"gcc -Wall main.c -o main && ./main"},"05":{"points":["`for (はじめ; 続ける条件; 毎回すること)` の3つを `;` で区切ります。","`i++` は「i を 1 ふやす」、`count--` は「1 へらす」です。","`while (条件)` は、条件が成り立つあいだくりかえします。","`continue` は「今回は飛ばして次へ」、`break` は「くりかえしをやめる」です。"],"files":[{"name":"main.c","main":true,"shell":false,"code":"#include \u003cstdio.h>\n\nint main(void) {\n    // 決まった回数くりかえす\n    for (int i = 1; i \u003c= 5; i++) {\n        printf(\"%d 回目\\n\", i);\n    }\n\n    // 条件が成り立つあいだくりかえす\n    int count = 3;\n    while (count > 0) {\n        printf(\"%d\\n\", count);\n        count--;\n    }\n    printf(\"発射！\\n\");\n\n    // 1〜10 の偶数だけを足す\n    int total = 0;\n    for (int i = 1; i \u003c= 10; i++) {\n        if (i % 2 == 1) {\n            continue;      // 奇数は飛ばす\n        }\n        total += i;\n    }\n    printf(\"偶数の合計: %d\\n\", total);\n    return 0;\n}"}],"output":"1 回目\n2 回目\n3 回目\n4 回目\n5 回目\n3\n2\n1\n発射！\n偶数の合計: 30","run":"gcc -Wall main.c -o main && ./main"},"06":{"points":["`int add(int a, int b)` は、「int を2つ受けとって、int を返す」関数です。","何も返さない関数は `void`、引数がない関数は `(void)` と書きます。","関数は、使う所より前に書きます。あとに書きたいときは、先に「プロトタイプ宣言」（形だけ）を書いておきます。","引数には、値の「コピー」が渡されます。関数の中で変えても、呼んだ側の変数は変わりません。"],"files":[{"name":"main.c","main":true,"shell":false,"code":"#include \u003cstdio.h>\n#include \u003cstdbool.h>\n\n// プロトタイプ宣言: 「あとでこういう関数が出てきます」と先に知らせる\nint add(int a, int b);\nbool is_even(int n);\nvoid greet(const char *name);\n\nint main(void) {\n    printf(\"3 + 4 = %d\\n\", add(3, 4));\n    greet(\"さくら\");\n    printf(\"10 は偶数？ %d\\n\", is_even(10));   // 1 が真、0 が偽\n    printf(\"7 は偶数？ %d\\n\", is_even(7));\n    return 0;\n}\n\nint add(int a, int b) {\n    return a + b;\n}\n\nbool is_even(int n) {\n    return n % 2 == 0;\n}\n\nvoid greet(const char *name) {          // 何も返さない\n    printf(\"こんにちは、%sさん\\n\", name);\n}"}],"output":"3 + 4 = 7\nこんにちは、さくらさん\n10 は偶数？ 1\n7 は偶数？ 0","run":"gcc -Wall main.c -o main && ./main"},"07":{"points":["配列は `int scores[10];` のように、型と大きさを決めて作ります。あとから大きさは変えられません。","番号は 0 から始まります。大きさ 10 の配列で使えるのは `[0]` から `[9]` までです。","C は「はんいの外」をチェックしません。`scores[10]` に書くと、ほかのデータをこわしてしまいます。いちばん気をつける所です。","配列は自分の長さをおぼえていません。「いま何個入っているか」は、自分で変数に持ちます。"],"files":[{"name":"main.c","main":true,"shell":false,"code":"#include \u003cstdio.h>\n\n#define MAX 10     // 入れ物の大きさ\n\nint main(void) {\n    int scores[MAX] = {70, 85, 60};\n    int count = 3;                 // いま入っている数（自分で数える）\n\n    if (count \u003c MAX) {             // 空きがあるか確かめてから追加\n        scores[count] = 90;\n        count++;\n    }\n\n    printf(\"最初の点数: %d\\n\", scores[0]);\n    printf(\"人数: %d\\n\", count);\n\n    int total = 0;\n    int max = scores[0];\n    for (int i = 0; i \u003c count; i++) {\n        total += scores[i];\n        if (scores[i] > max) {\n            max = scores[i];\n        }\n    }\n    printf(\"合計: %d\\n\", total);\n    printf(\"平均: %.2f\\n\", (double)total / count);\n    printf(\"最高点: %d\\n\", max);\n    return 0;\n}"}],"output":"最初の点数: 70\n人数: 4\n合計: 305\n平均: 76.25\n最高点: 90","run":"gcc -Wall main.c -o main && ./main"},"08":{"points":["C には、辞書（マップ）が最初から入っていません。「キーと値を持つ構造体」の配列を作り、自分で探します。","`struct` は、いくつかのデータを1つにまとめた型です。`.` で中身を取り出します。","文字列のキーは `strcmp` でくらべます。","「見つからなかった」ことは、ありえない値（ここでは -1）を返して知らせています。","ほかの言語の辞書が中で何をしているかが、C で書くとよくわかります。"],"files":[{"name":"main.c","main":true,"shell":false,"code":"#include \u003cstdio.h>\n#include \u003cstring.h>\n\nstruct Item {\n    char name[32];\n    int price;\n};\n\n// 名前で探して、値段を返す。なければ -1\nint find_price(const struct Item items[], int count, const char *name) {\n    for (int i = 0; i \u003c count; i++) {\n        if (strcmp(items[i].name, name) == 0) {\n            return items[i].price;\n        }\n    }\n    return -1;\n}\n\nint main(void) {\n    struct Item items[10] = {{\"りんご\", 120}, {\"バナナ\", 80}};\n    int count = 2;\n\n    strcpy(items[count].name, \"みかん\");    // 追加\n    items[count].price = 60;\n    count++;\n\n    printf(\"りんご は %d 円\\n\", find_price(items, count, \"りんご\"));\n\n    if (find_price(items, count, \"ぶどう\") == -1) {\n        printf(\"ぶどう はありません\\n\");\n    }\n\n    printf(\"--- 一覧 ---\\n\");\n    for (int i = 0; i \u003c count; i++) {\n        printf(\"%s: %d 円\\n\", items[i].name, items[i].price);\n    }\n    printf(\"種類: %d\\n\", count);\n    return 0;\n}"}],"output":"りんご は 120 円\nぶどう はありません\n--- 一覧 ---\nりんご: 120 円\nバナナ: 80 円\nみかん: 60 円\n種類: 3","run":"gcc -Wall main.c -o main && ./main"},"09":{"points":["C の文字列は「`char` の配列」で、最後に終わりのしるし `\\0` が入っています。","文字列の道具は `\u003cstring.h>` にあります。`strlen`（長さ）、`strcpy`（コピー）、`strcmp`（くらべる）、`strstr`（探す）など。","`strtok` は、文字列を区切りで分けます。もとの文字列を書きかえるので、コピーしてから使います。","入れ物の大きさをこえて書きこむと、プログラムがこわれます。`snprintf` のように、大きさを渡せる関数を使いましょう。"],"files":[{"name":"main.c","main":true,"shell":false,"code":"#include \u003cstdio.h>\n#include \u003cstring.h>\n#include \u003cctype.h>\n\nint main(void) {\n    char text[] = \"apple,banana,cherry\";\n\n    // 分ける（strtok はもとの文字列を書きかえるので、コピーを使う）\n    char copy[64];\n    snprintf(copy, sizeof(copy), \"%s\", text);\n    char *fruits[10];\n    int count = 0;\n    for (char *p = strtok(copy, \",\"); p != NULL; p = strtok(NULL, \",\")) {\n        fruits[count] = p;\n        count++;\n    }\n    printf(\"%d 個\\n\", count);\n    printf(\"1番目: %s\\n\", fruits[0]);\n\n    // 大文字にする（1文字ずつ変える）\n    char upper[32];\n    size_t len = strlen(fruits[0]);\n    for (size_t i = 0; i \u003c len; i++) {\n        upper[i] = (char)toupper((unsigned char)fruits[0][i]);\n    }\n    upper[len] = '\\0';                  // 終わりのしるしを忘れずに\n    printf(\"大文字: %s\\n\", upper);\n\n    // ふくまれているか\n    printf(\"banana をふくむ？ %d\\n\", strstr(text, \"banana\") != NULL);\n\n    // つなぐ\n    char joined[64] = \"\";\n    for (int i = 0; i \u003c count; i++) {\n        if (i > 0) {\n            strncat(joined, \" / \", sizeof(joined) - strlen(joined) - 1);\n        }\n        strncat(joined, fruits[i], sizeof(joined) - strlen(joined) - 1);\n    }\n    printf(\"つなぐ: %s\\n\", joined);\n    return 0;\n}"}],"output":"3 個\n1番目: apple\n大文字: APPLE\nbanana をふくむ？ 1\nつなぐ: apple / banana / cherry","run":"gcc -Wall main.c -o main && ./main"}}},{"id":"python","name":"Python","type":"動的型","exec":"インタプリタ","tagline":"読みやすく、すぐためせる言語","about":"AI やデータ分析、作業の自動化、Web のサーバーなど、とても広く使われています。書く量が少なく、英語の文のように読めます。字下げがそのまま文法になっています。","run":"python3 main.py","flow":[["main.py","あなたが書く"],["python3","インタプリタ","tool"],["その場で実行","上から順に"]],"flowNote":"インタプリタがコードを読みながら実行します。コンパイルの手間がなく、すぐためせます。","ready":["リスト・辞書・内包表記を使って、データを自由に加工できる","関数とクラスに分け、型ヒントをつけて書ける","仮想環境を作り、pip でライブラリを入れて使える","pytest でテストを書き、ruff で書き方をそろえられる"],"next":["requests で Web からデータを取ってきて、まとめる","pandas でデータを分析して、グラフにする","FastAPI や Django で、Web アプリを作る"],"lessons":{"10":{"points":["`class` は「設計図」。`Account(\"さくら\", 1000)` で、設計図から実物（インスタンス）を作ります。","`__init__` は実物を作るときに1回だけ呼ばれ、最初の値を入れます。","`self` は「この実物自身」。メソッドの最初の引数に必ず書きます。","データと、それをあつかう関数を1か所にまとめられるのがクラスのよいところです。"],"files":[{"name":"main.py","main":true,"shell":false,"code":"class Account:\n    def __init__(self, owner, balance):\n        self.owner = owner\n        self.balance = balance\n\n    def deposit(self, amount):\n        self.balance += amount\n\n    def show(self):\n        print(f\"{self.owner} の残高: {self.balance} 円\")\n\na = Account(\"さくら\", 1000)\nb = Account(\"たろう\", 300)\n\na.deposit(500)      # a だけが増える\na.show()\nb.show()"}],"output":"さくら の残高: 1500 円\nたろう の残高: 300 円","run":"python3 main.py"},"11":{"points":["内包表記 `[式 for x in リスト if 条件]` は、「取り出す → しぼる → 作りかえる」を1行で書きます。","スライス `nums[1:4]` は「1番目から4番目の手前まで」。`nums[::-1]` で逆順です。","`a, b = b, a` のように、いくつかの値をまとめて入れられます（アンパック）。","`enumerate` は番号つきで、`zip` は2つのリストをならべて取り出します。"],"files":[{"name":"main.py","main":true,"shell":false,"code":"nums = [1, 2, 3, 4, 5, 6]\n\n# 内包表記: リストから新しいリストを作る\ndoubled = [n * 2 for n in nums]\nevens = [n for n in nums if n % 2 == 0]\nprint(doubled)\nprint(evens)\n\n# スライス: 一部を切り出す\nprint(nums[1:4])\nprint(nums[::-1])\n\n# アンパック: まとめて受け取る\na, b = 1, 2\na, b = b, a            # 入れかえ\nprint(a, b)\n\n# 番号つきで取り出す / 2つを同時に取り出す\nnames = [\"さくら\", \"たろう\"]\nages = [15, 17]\nfor i, name in enumerate(names, start=1):\n    print(i, name)\nfor name, age in zip(names, ages):\n    print(f\"{name} は {age} さい\")"}],"title":"Python らしい書き方","goal":"内包表記・スライス・アンパックを使って、短く読みやすく書けるようになる。","intro":"Python には、よくある処理を1行で書ける書き方がそろっています。ほかの人が書いた Python のコードには必ず出てくるので、読めるようになることが一人前への近道です。","quiz":{"q":"[n * 2 for n in [1, 2, 3] if n != 2] の結果は？","choices":["[2, 4, 6]","[2, 6]","[1, 3]"],"answer":1,"why":"2 以外（1 と 3）だけを取り出して、それぞれ2倍にするので [2, 6] です。"},"task":"1 から 20 までの数のうち、3 の倍数だけを2乗したリストを、内包表記で作ってみよう。","hint":"[n ** 2 for n in range(1, 21) if 条件] の形です。","output":"[2, 4, 6, 8, 10, 12]\n[2, 4, 6]\n[2, 3, 4]\n[6, 5, 4, 3, 2, 1]\n2 1\n1 さくら\n2 たろう\nさくら は 15 さい\nたろう は 17 さい","run":"python3 main.py"},"12":{"points":["1つのファイルが1つの「モジュール」です。`import greeting` で、`greeting.py` を読みこみます。","使うときは `greeting.hello( )` のように、モジュール名をつけて呼びます。","`from greeting import hello` と書くと、`hello( )` だけで呼べます。","`if __name__ == \"__main__\":` の中は、そのファイルを直接実行したときだけ動きます。"],"files":[{"name":"greeting.py","main":false,"shell":false,"code":"# あいさつを作る部品\ndef hello(name):\n    return f\"こんにちは、{name}さん\"\n\ndef bye(name):\n    return f\"さようなら、{name}さん\""},{"name":"main.py","main":true,"shell":false,"code":"import greeting\nfrom greeting import bye\n\nprint(greeting.hello(\"さくら\"))\nprint(bye(\"さくら\"))"}],"output":"こんにちは、さくらさん\nさようなら、さくらさん","run":"python3 main.py"},"13":{"points":["エラーが起きるかもしれない所を `try:` に書き、起きたときの対応を `except エラーの種類:` に書きます。","自分でエラーを起こすには `raise ValueError(\"説明\")` と書きます。","`finally:` の中は、エラーが起きても起きなくても、最後に必ず動きます。","`except:` だけで全部をつかまえるのはさけましょう。どんなエラーかを書くと、思わぬ失敗を見のがしません。"],"files":[{"name":"main.py","main":true,"shell":false,"code":"def divide(a, b):\n    if b == 0:\n        raise ValueError(\"0 で割ることはできません\")\n    return a / b\n\ntry:\n    print(\"10 ÷ 2 =\", divide(10, 2))\n    print(\"10 ÷ 0 =\", divide(10, 0))\n    print(\"ここは動きません\")\nexcept ValueError as e:\n    print(\"エラー:\", e)\n\ntext = \"abc\"\ntry:\n    number = int(text)\n    print(number)\nexcept ValueError:\n    print(f'\"{text}\" は数ではありません')\nfinally:\n    print(\"チェック終わり\")"}],"output":"10 ÷ 2 = 5.0\nエラー: 0 で割ることはできません\n\"abc\" は数ではありません\nチェック終わり","run":"python3 main.py"},"14":{"points":["`with open(...) as f:` と書くと、使い終わったファイルを自動で閉じてくれます。","`\"w\"` は書きこみ（中身は消えて新しくなる）、`\"r\"` は読みこみ、`\"a\"` は後ろに追加です。","日本語をあつかうときは `encoding=\"utf-8\"` を必ず書きます。","ファイルがないときは `FileNotFoundError` が起きます。"],"files":[{"name":"main.py","main":true,"shell":false,"code":"lines = [\"牛乳を買う\", \"宿題をする\", \"本を読む\"]\n\n# 書きこむ\nwith open(\"memo.txt\", \"w\", encoding=\"utf-8\") as f:\n    for line in lines:\n        f.write(line + \"\\n\")\nprint(len(lines), \"行 書きました\")\n\n# 読みこむ\nwith open(\"memo.txt\", \"r\", encoding=\"utf-8\") as f:\n    for i, line in enumerate(f, start=1):\n        print(f\"{i}: {line.strip()}\")\n\n# ないファイルを開こうとしたとき\ntry:\n    with open(\"ない.txt\", encoding=\"utf-8\") as f:\n        print(f.read())\nexcept FileNotFoundError:\n    print(\"ない.txt は開けませんでした\")"}],"output":"3 行 書きました\n1: 牛乳を買う\n2: 宿題をする\n3: 本を読む\nない.txt は開けませんでした","run":"python3 main.py"},"15":{"points":["Python には、テストの道具 `unittest` が最初から入っています。","`test_` で始まるメソッドが、1つのテストになります。","`assertEqual(実際, 期待)` は、2つが同じでなければ「失敗」と知らせます。","仕事では `pytest` という道具もよく使われます。`assert fizzbuzz(3) == \"Fizz\"` とだけ書けばよいので、もっと短くなります。"],"files":[{"name":"main.py","main":true,"shell":false,"code":"import unittest\n\ndef fizzbuzz(n):\n    if n % 15 == 0:\n        return \"FizzBuzz\"\n    if n % 3 == 0:\n        return \"Fizz\"\n    if n % 5 == 0:\n        return \"Buzz\"\n    return str(n)\n\nclass FizzBuzzTest(unittest.TestCase):\n    def test_fizz(self):\n        self.assertEqual(fizzbuzz(3), \"Fizz\")\n\n    def test_buzz(self):\n        self.assertEqual(fizzbuzz(5), \"Buzz\")\n\n    def test_fizzbuzz(self):\n        self.assertEqual(fizzbuzz(15), \"FizzBuzz\")\n\n    def test_number(self):\n        self.assertEqual(fizzbuzz(7), \"7\")\n\nif __name__ == \"__main__\":\n    unittest.main()"}],"mode":"test","output":"test_buzz (main.FizzBuzzTest.test_buzz) ... ok\ntest_fizz (main.FizzBuzzTest.test_fizz) ... ok\ntest_fizzbuzz (main.FizzBuzzTest.test_fizzbuzz) ... ok\ntest_number (main.FizzBuzzTest.test_number) ... ok\n\n----------------------------------------------------------------------\nRan 4 tests in 0.001s\n\nOK","run":"python3 -m unittest -v main"},"16":{"points":["`name: str` のように、変数や引数のあとに型を書けます。`-> int` は「返す値の型」です。","型ヒントは Python 自体はチェックしません。`mypy` やエディタが、実行する前にまちがいを見つけてくれます。","`@dataclass` をつけると、`__init__` や表示用の処理を自動で作ってくれます。","`int | None` は「整数か、何もない（None）か」という意味です。"],"files":[{"name":"main.py","main":true,"shell":false,"code":"from dataclasses import dataclass\n\n@dataclass\nclass Book:\n    title: str\n    price: int\n    stock: int = 0        # 何も渡さなければ 0\n\ndef total_price(books: list[Book]) -> int:\n    return sum(b.price for b in books)\n\ndef find(books: list[Book], title: str) -> Book | None:\n    for b in books:\n        if b.title == title:\n            return b\n    return None           # 見つからなかった\n\nbooks = [Book(\"Python入門\", 2200, 3), Book(\"図かん\", 1800)]\n\nprint(books[0])                      # 中身がそのまま表示できる\nprint(\"合計:\", total_price(books), \"円\")\n\nfound = find(books, \"図かん\")\nif found is not None:\n    print(\"見つけた:\", found.title, found.stock, \"冊\")\nprint(find(books, \"まんが\"))"}],"title":"型ヒントとデータクラス","goal":"型ヒントで「何が入るか」を書き、dataclass でデータの入れ物を手早く作れるようになる。","intro":"Python は型を書かなくても動きますが、大きなプログラムでは「この引数には何を入れるのか」がわからなくなりがちです。そこで、仕事で書かれる Python では「型ヒント」を書くのがふつうになっています。エディタがまちがいを教えてくれるようになり、読む人にも親切です。","quiz":{"q":"型ヒント def area(w: int) -> int: に、文字列を渡して実行するとどうなる？","choices":["実行する前に必ずエラーになる","Python 自体は型ヒントを調べないので、そのまま動こうとする","自動で数に変えてくれる"],"answer":1,"why":"型ヒントは「メモ」で、Python 自体はチェックしません。mypy などの道具やエディタが、実行する前に調べてくれます。"},"task":"名前 (str) と値段 (int) を持つ dataclass「Item」を作り、3つの Item のリストから合計金額を出す関数を、型ヒントつきで書いてみよう。","hint":"def total(items: list[Item]) -> int: の形です。","output":"Book(title='Python入門', price=2200, stock=3)\n合計: 4000 円\n見つけた: 図かん 0 冊\nNone","run":"python3 main.py"},"17":{"points":["仮想環境（venv）は「このプロジェクト専用の道具箱」。ほかのプロジェクトとライブラリがまざりません。","ライブラリは `pip` で入れます。最近は、速くて管理もまとめてできる `uv` もよく使われます。","`ruff` は、書き方をそろえ（フォーマット）、あやしい所を教えてくれます（リント）。","公式ドキュメント（docs.python.org）には日本語版があります。こまったら、まずここを見ます。"],"files":[{"name":"shell","main":false,"shell":true,"code":"# プロジェクト専用の環境を作って、入る\npython3 -m venv .venv\nsource .venv/bin/activate        # Windows は .venv\\Scripts\\activate\n\n# ライブラリを入れる / 入れた物の一覧を残す\npip install requests\npip freeze > requirements.txt\n\n# 書き方をそろえる・まちがいを探す\npip install ruff mypy pytest\nruff format .\nruff check .\nmypy .\n\n# テストを動かす\npytest"}]},"18":{"points":["「読む → 数える → ならべる → 表示する」と、仕事ごとに関数を分けています。","`counts.get(w, 0) + 1` は、「まだなければ 0 として、1 を足す」という辞書の定番の書き方です。","`sorted` の `key` で、ならべる基準を決めます。`(-回数, 単語)` で「回数の多い順、同じならアルファベット順」になります。","空の文章が来たときは、エラーにして知らせています。"],"files":[{"name":"main.py","main":true,"shell":false,"code":"import string\n\ndef split_words(text: str) -> list[str]:\n    \"\"\"文章を、小文字の単語のリストにする\"\"\"\n    words = []\n    for raw in text.lower().split():\n        word = raw.strip(string.punctuation)   # 記号を取る\n        if word:\n            words.append(word)\n    return words\n\ndef count_words(words: list[str]) -> dict[str, int]:\n    counts: dict[str, int] = {}\n    for w in words:\n        counts[w] = counts.get(w, 0) + 1\n    return counts\n\ndef top(counts: dict[str, int], n: int) -> list[tuple[str, int]]:\n    \"\"\"回数の多い順（同じならアルファベット順）に n 個\"\"\"\n    ordered = sorted(counts.items(), key=lambda item: (-item[1], item[0]))\n    return ordered[:n]\n\ndef report(text: str) -> None:\n    words = split_words(text)\n    if not words:\n        raise ValueError(\"単語がありません\")\n    counts = count_words(words)\n    print(f\"全部で {len(words)} 語、{len(counts)} 種類\")\n    for word, count in top(counts, 3):\n        print(f\"{word}: {count}\")\n\nreport(\"The cat saw the dog. The dog saw the bird!\")\n\ntry:\n    report(\"...\")\nexcept ValueError as e:\n    print(\"エラー:\", e)"}],"output":"全部で 10 語、5 種類\nthe: 4\ndog: 2\nsaw: 2\nエラー: 単語がありません","run":"python3 main.py"},"01":{"points":["`print( )` で表示します。表示したあと、自動で改行します。","`#` から行の終わりまではコメントです。プログラムとしては読まれません。","行の終わりに `;` はいりません。1行に1つの命令を書きます。"],"files":[{"name":"main.py","main":true,"shell":false,"code":"# はじめてのプログラム\nprint(\"こんにちは！\")\nprint(\"プログラミングをはじめます。\")\nprint(\"1 + 2 =\", 1 + 2)   # カンマで区切ると、間に空白が入ります"}],"output":"こんにちは！\nプログラミングをはじめます。\n1 + 2 = 3","run":"python3 main.py"},"02":{"points":["変数は `名前 = 値` で作ります。型は書かなくても、入れた値で自動的に決まります。","真・偽は `True` / `False`。最初が大文字です。","文字列の前に `f` をつけると、`{ }` の中の変数が値に置きかわります（f文字列）。","`type(x)` で、いまの型を調べられます。"],"files":[{"name":"main.py","main":true,"shell":false,"code":"name = \"さくら\"      # 文字列 (str)\nage = 15             # 整数 (int)\nheight = 152.5       # 小数 (float)\nis_student = True    # 真か偽か (bool)\n\nprint(f\"名前: {name}\")\nprint(f\"年れい: {age}\")\nprint(f\"身長: {height}\")\nprint(f\"学生: {is_student}\")\n\nage = age + 1        # 変数は、あとから入れなおせます\nprint(f\"来年は {age} さい\")\nprint(type(age), type(height))"}],"output":"名前: さくら\n年れい: 15\n身長: 152.5\n学生: True\n来年は 16 さい\n\u003cclass 'int'> \u003cclass 'float'>","run":"python3 main.py"},"03":{"points":["`/` はいつも小数になります。整数の割り算（切りすて）は `//` です。","`%` はあまり、`**` は累乗（2 ** 3 は 8）です。","文字列は `+` でつなげられます。数とつなぐときは `str( )` で文字列に変えます。","`len( )` で文字数がわかります。"],"files":[{"name":"main.py","main":true,"shell":false,"code":"a = 7\nb = 2\nprint(\"7 + 2 =\", a + b)\nprint(\"7 - 2 =\", a - b)\nprint(\"7 * 2 =\", a * b)\nprint(\"7 / 2 =\", a / b)     # 小数になる\nprint(\"7 // 2 =\", a // b)   # 切りすて\nprint(\"7 % 2 =\", a % b)     # あまり\n\nfamily = \"山田\"\ngiven = \"太郎\"\nfull = family + \" \" + given\nprint(\"フルネーム:\", full)\nprint(\"文字数:\", len(\"program\"))\nprint(\"年れい: \" + str(15) + \" さい\")"}],"output":"7 + 2 = 9\n7 - 2 = 5\n7 * 2 = 14\n7 / 2 = 3.5\n7 // 2 = 3\n7 % 2 = 1\nフルネーム: 山田 太郎\n文字数: 7\n年れい: 15 さい","run":"python3 main.py"},"04":{"points":["`if 条件:` のあと、字下げ（インデント）した行が「当てはまったときにすること」です。字下げは空白4つがきまりです。","`elif` は「そうでなくて、もし」。`else` は「どれでもないとき」。","「かつ」は `and`、「または」は `or`、「〜でない」は `not` と書きます。","等しいかどうかは `==`。`=` 1つは「入れる」なので、まちがえやすいところです。"],"files":[{"name":"main.py","main":true,"shell":false,"code":"score = 72\n\nif score >= 80:\n    print(\"よくできました\")\nelif score >= 60:\n    print(\"合格\")\nelse:\n    print(\"もう少し\")\n\nage = 15\nhas_ticket = True\nif age >= 12 and has_ticket:\n    print(\"入場できます\")\n\nif not has_ticket or age \u003c 12:\n    print(\"入場できません\")\nelse:\n    print(\"ようこそ\")"}],"output":"合格\n入場できます\nようこそ","run":"python3 main.py"},"05":{"points":["`for i in range(1, 6):` は 1 から 5 まで。`range` の右の数は入りません。","`while 条件:` は、条件が成り立つあいだくりかえします。","`continue` は「今回は飛ばして次へ」、`break` は「くりかえしをやめる」です。","`+=` は「足して入れなおす」。`total = total + i` と同じです。"],"files":[{"name":"main.py","main":true,"shell":false,"code":"# 決まった回数くりかえす\nfor i in range(1, 6):\n    print(i, \"回目\")\n\n# 条件が成り立つあいだくりかえす\ncount = 3\nwhile count > 0:\n    print(count)\n    count -= 1\nprint(\"発射！\")\n\n# 1〜10 の偶数だけを足す\ntotal = 0\nfor i in range(1, 11):\n    if i % 2 == 1:\n        continue      # 奇数は飛ばす\n    total += i\nprint(\"偶数の合計:\", total)"}],"output":"1 回目\n2 回目\n3 回目\n4 回目\n5 回目\n3\n2\n1\n発射！\n偶数の合計: 30","run":"python3 main.py"},"06":{"points":["関数は `def 名前(引数):` で作り、`return` で結果を返します。","作っただけでは動きません。`add(3, 4)` のように呼んではじめて動きます。","`def greet(name=\"みなさん\")` のように、引数に「何も渡されなかったときの値」を決められます。","関数の中で作った変数は、関数の外からは見えません。"],"files":[{"name":"main.py","main":true,"shell":false,"code":"def add(a, b):\n    return a + b\n\ndef greet(name=\"みなさん\"):\n    return f\"こんにちは、{name}さん\"\n\ndef is_even(n):\n    return n % 2 == 0\n\nprint(\"3 + 4 =\", add(3, 4))\nprint(greet(\"さくら\"))\nprint(greet())\nprint(\"10 は偶数？\", is_even(10))\nprint(\"7 は偶数？\", is_even(7))"}],"output":"3 + 4 = 7\nこんにちは、さくらさん\nこんにちは、みなさんさん\n10 は偶数？ True\n7 は偶数？ False","run":"python3 main.py"},"07":{"points":["リストは `[ ]` で作ります。番号は 0 から始まります。","`append` で後ろに追加、`len` で個数、`sum` / `max` / `min` で合計・最大・最小。","`scores[-1]` のようにマイナスの番号を使うと、後ろから数えられます。","`for s in scores:` で、中身を1つずつ取り出せます。"],"files":[{"name":"main.py","main":true,"shell":false,"code":"scores = [70, 85, 60]\nscores.append(90)             # 後ろに追加\n\nprint(\"最初の点数:\", scores[0])\nprint(\"最後の点数:\", scores[-1])\nprint(\"人数:\", len(scores))\n\ntotal = 0\nfor s in scores:\n    total += s\nprint(\"合計:\", total)\nprint(\"平均:\", total / len(scores))\nprint(\"最高点:\", max(scores))\n\nscores.sort()                 # 小さい順にならべかえる\nprint(\"ならべかえ:\", scores)"}],"output":"最初の点数: 70\n最後の点数: 90\n人数: 4\n合計: 305\n平均: 76.25\n最高点: 90\nならべかえ: [60, 70, 85, 90]","run":"python3 main.py"},"08":{"points":["辞書は `{キー: 値}` で作ります。`prices[\"りんご\"]` のようにキーで取り出します。","ないキーを `[ ]` で取り出すとエラー（KeyError）。先に `in` で調べるか、`get` を使います。","`for name, price in prices.items():` で、キーと値をいっしょに取り出せます。","辞書は、入れた順番をおぼえています。"],"files":[{"name":"main.py","main":true,"shell":false,"code":"prices = {\"りんご\": 120, \"バナナ\": 80}\nprices[\"みかん\"] = 60          # 追加\n\nprint(\"りんご は\", prices[\"りんご\"], \"円\")\n\nif \"ぶどう\" in prices:\n    print(\"ぶどう は\", prices[\"ぶどう\"], \"円\")\nelse:\n    print(\"ぶどう はありません\")\n\nprint(\"もも:\", prices.get(\"もも\", \"不明\"))   # なければ「不明」\n\nprint(\"--- 一覧 ---\")\nfor name, price in prices.items():\n    print(f\"{name}: {price} 円\")\nprint(\"種類:\", len(prices))"}],"output":"りんご は 120 円\nぶどう はありません\nもも: 不明\n--- 一覧 ---\nりんご: 120 円\nバナナ: 80 円\nみかん: 60 円\n種類: 3","run":"python3 main.py"},"09":{"points":["`split` で分けてリストに、`join` でリストをつないで文字列にします。","文字列は作ったあと書きかえられません。`upper` や `replace` は「新しい文字列」を返します。","`in` で「ふくまれているか」を調べられます。","`strip` は、前後の空白や改行を取りのぞきます。入力された文字を使う前によく使います。"],"files":[{"name":"main.py","main":true,"shell":false,"code":"text = \"apple,banana,cherry\"\n\nfruits = text.split(\",\")           # カンマで分ける\nprint(len(fruits), \"個\")\nprint(\"1番目:\", fruits[0])\nprint(\"大文字:\", fruits[0].upper())\nprint(\"banana をふくむ？\", \"banana\" in text)\nprint(\"つなぐ:\", \" / \".join(fruits))\nprint(\"置きかえ:\", text.replace(\"cherry\", \"melon\"))\n\nmessy = \"   hello   \"\nprint(\"[\" + messy.strip() + \"]\")   # 前後の空白を取る\nprint(\"先頭3文字:\", text[:3])"}],"output":"3 個\n1番目: apple\n大文字: APPLE\nbanana をふくむ？ True\nつなぐ: apple / banana / cherry\n置きかえ: apple,banana,melon\n[hello]\n先頭3文字: app","run":"python3 main.py"}}},{"id":"java","name":"Java","type":"静的型","exec":"コンパイル + JVM","tagline":"大きなシステムを、チームで作るための言語","about":"会社の業務システム、Android アプリ、大きなサーバーで広く使われています。書くことは多めですが、型とクラスのおかげで、まちがいを早く見つけられます。","run":"javac Main.java && java Main","flow":[["Main.java","あなたが書く"],["javac","コンパイラ","tool"],["Main.class","バイトコード"],["JVM","が実行"]],"flowNote":"どのパソコンでも動く「バイトコード」に翻訳して、JVM という実行役が動かします。","ready":["クラスとインターフェースを使って、役割を分けて設計できる","List・Map と Stream を使って、データを加工できる","例外を正しく受けとめ、必要なときは自分で投げられる","Maven か Gradle のプロジェクトで、JUnit のテストを書ける"],"next":["Spring Boot で、Web の API を作る","JDBC や JPA で、データベースとつなぐ","Git を使って、チームでの開発のやり方を身につける"],"lessons":{"10":{"points":["`class` は「設計図」。`new Account(\"さくら\", 1000)` で、設計図から実物（インスタンス）を作ります。","クラスと同じ名前のメソッドが「コンストラクタ」。実物を作るときに1回だけ呼ばれます。","フィールドを `private` にすると、クラスの外から直接さわれなくなります。値を守るための大事な習慣です（カプセル化）。","`this` は「この実物自身」を指します。","1つのファイルに書ける `public` クラスは1つだけです。ふつうは、クラスごとにファイルを分けます。"],"files":[{"name":"Main.java","main":true,"shell":false,"code":"class Account {\n    private String owner;\n    private int balance;\n\n    Account(String owner, int balance) {     // コンストラクタ\n        this.owner = owner;\n        this.balance = balance;\n    }\n\n    void deposit(int amount) {\n        this.balance += amount;\n    }\n\n    int getBalance() {\n        return balance;\n    }\n\n    void show() {\n        System.out.println(owner + \" の残高: \" + balance + \" 円\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Account a = new Account(\"さくら\", 1000);\n        Account b = new Account(\"たろう\", 300);\n\n        a.deposit(500);      // a だけが増える\n        a.show();\n        b.show();\n        System.out.println(a.getBalance());\n    }\n}"}],"output":"さくら の残高: 1500 円\nたろう の残高: 300 円\n1500","run":"javac Main.java && java Main"},"11":{"points":["`interface` には、「どんなメソッドがあるか」だけを書きます。中身は `implements` したクラスが書きます。","`extends` は継承。親クラスのフィールドやメソッドを、そのまま受けつぎます。","`@Override` は「親のメソッドを上書きします」という目じるし。つづりをまちがえると、コンパイラが教えてくれます。","`List\u003cShape>` に、Circle も Rect も入れられます。呼ぶ側は、中身の種類を気にしなくてすみます（ポリモーフィズム）。"],"files":[{"name":"Main.java","main":true,"shell":false,"code":"import java.util.List;\n\ninterface Shape {\n    double area();          // 面積を返す、という約束\n    String name();\n}\n\nclass Rect implements Shape {\n    protected double w, h;\n    Rect(double w, double h) { this.w = w; this.h = h; }\n\n    @Override\n    public double area() { return w * h; }\n\n    @Override\n    public String name() { return \"長方形\"; }\n}\n\nclass Square extends Rect {          // 正方形は、長方形の一種\n    Square(double side) { super(side, side); }\n\n    @Override\n    public String name() { return \"正方形\"; }\n}\n\nclass Circle implements Shape {\n    private double r;\n    Circle(double r) { this.r = r; }\n\n    @Override\n    public double area() { return Math.PI * r * r; }\n\n    @Override\n    public String name() { return \"円\"; }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        List\u003cShape> shapes = List.of(new Rect(3, 4), new Square(5), new Circle(1));\n        for (Shape s : shapes) {\n            System.out.println(String.format(\"%s の面積: %.2f\", s.name(), s.area()));\n        }\n    }\n}"}],"title":"インターフェースと継承","goal":"「同じ使い方ができる、ちがう種類のもの」を、インターフェースと継承で作れるようになる。","intro":"Java の大きなプログラムは、インターフェース（「こう使えます」という約束）を中心に作られています。約束さえ守っていれば中身を入れかえられるので、部品の交換やテストがしやすくなります。Java のライブラリを読むときにも、必ず出てくる考え方です。","quiz":{"q":"interface Shape { double area(); } を implements したクラスが、area() を書かなかったらどうなる？","choices":["実行すると 0 が返る","コンパイルエラーになる","自動で作られる"],"answer":1,"why":"インターフェースは「必ずこのメソッドを持つ」という約束です。守っていないと、コンパイルの時点でエラーになります。"},"task":"Shape を実装した Triangle（三角形。底辺と高さを持つ）クラスを足して、リストに入れて面積を表示してみよう。","hint":"class Triangle implements Shape と書いて、area() と name() を作ります。","output":"長方形 の面積: 12.00\n正方形 の面積: 25.00\n円 の面積: 3.14","run":"javac Main.java && java Main"},"12":{"points":["Java では、ふつう「1つのクラス = 1つのファイル」にします。ファイル名はクラス名と同じにします。","同じフォルダ（同じパッケージ）にあるクラスは、`import` なしで使えます。","大きなプロジェクトでは `package com.example.app;` のようにパッケージで整理し、ほかのパッケージのクラスは `import` して使います。","`static` メソッドは、`new` しなくても `クラス名.メソッド名( )` で呼べます。"],"files":[{"name":"Greeting.java","main":false,"shell":false,"code":"// あいさつを作る部品\npublic class Greeting {\n    public static String hello(String name) {\n        return \"こんにちは、\" + name + \"さん\";\n    }\n\n    public static String bye(String name) {\n        return \"さようなら、\" + name + \"さん\";\n    }\n}"},{"name":"Main.java","main":true,"shell":false,"code":"public class Main {\n    public static void main(String[] args) {\n        System.out.println(Greeting.hello(\"さくら\"));\n        System.out.println(Greeting.bye(\"さくら\"));\n    }\n}"}],"output":"こんにちは、さくらさん\nさようなら、さくらさん","run":"javac *.java && java Main"},"13":{"points":["エラー（例外）が起きるかもしれない所を `try { }` に書き、起きたときの対応を `catch (例外の型 e) { }` に書きます。","自分で例外を起こすには `throw new IllegalArgumentException(\"説明\")` と書きます。","`finally { }` の中は、例外が起きても起きなくても、最後に必ず動きます。","Java には「チェック例外」があります。`IOException` などは、`try-catch` するか、メソッドに `throws` を書かないとコンパイルできません。"],"files":[{"name":"Main.java","main":true,"shell":false,"code":"public class Main {\n    static int divide(int a, int b) {\n        if (b == 0) {\n            throw new IllegalArgumentException(\"0 で割ることはできません\");\n        }\n        return a / b;\n    }\n\n    public static void main(String[] args) {\n        try {\n            System.out.println(\"10 ÷ 2 = \" + divide(10, 2));\n            System.out.println(\"10 ÷ 0 = \" + divide(10, 0));\n            System.out.println(\"ここは動きません\");\n        } catch (IllegalArgumentException e) {\n            System.out.println(\"エラー: \" + e.getMessage());\n        }\n\n        String text = \"abc\";\n        try {\n            int number = Integer.parseInt(text);\n            System.out.println(number);\n        } catch (NumberFormatException e) {\n            System.out.println(\"\\\"\" + text + \"\\\" は数ではありません\");\n        } finally {\n            System.out.println(\"チェック終わり\");\n        }\n    }\n}"}],"output":"10 ÷ 2 = 5\nエラー: 0 で割ることはできません\n\"abc\" は数ではありません\nチェック終わり","run":"javac Main.java && java Main"},"14":{"points":["ファイルは `Files` と `Path` を使うと、短く書けます。","`Files.write` で書きこみ、`Files.readAllLines` で全部の行をリストとして読みこみます。","ファイルの操作は失敗することがあるので、`IOException` への対応が必ず必要です（チェック例外）。","ファイルがないときは `NoSuchFileException`（IOException の一種）が起きます。"],"files":[{"name":"Main.java","main":true,"shell":false,"code":"import java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.NoSuchFileException;\nimport java.nio.file.Path;\nimport java.util.List;\n\npublic class Main {\n    public static void main(String[] args) throws IOException {\n        List\u003cString> lines = List.of(\"牛乳を買う\", \"宿題をする\", \"本を読む\");\n        Path memo = Path.of(\"memo.txt\");\n\n        // 書きこむ\n        Files.write(memo, lines);\n        System.out.println(lines.size() + \" 行 書きました\");\n\n        // 読みこむ\n        List\u003cString> loaded = Files.readAllLines(memo);\n        for (int i = 0; i \u003c loaded.size(); i++) {\n            System.out.println((i + 1) + \": \" + loaded.get(i));\n        }\n\n        // ないファイルを開こうとしたとき\n        try {\n            Files.readAllLines(Path.of(\"ない.txt\"));\n        } catch (NoSuchFileException e) {\n            System.out.println(\"ない.txt は開けませんでした\");\n        }\n    }\n}"}],"output":"3 行 書きました\n1: 牛乳を買う\n2: 宿題をする\n3: 本を読む\nない.txt は開けませんでした","run":"javac Main.java && java Main"},"15":{"points":["ここでは、しくみがわかるように、テストの道具を自分で作っています。「実際の値」と「期待する値」をくらべているだけです。","仕事では `JUnit` を使います。`@Test void fizz() { assertEquals(\"Fizz\", fizzbuzz(3)); }` のように書きます。","JUnit は Maven や Gradle で入れて、`mvn test` / `gradle test` で動かします（「道具をそろえる」で出てきます）。","テストしやすいコードは、「表示する」と「計算する」が分かれています。`fizzbuzz` は文字列を返すだけなので、テストがかんたんです。"],"files":[{"name":"Main.java","main":true,"shell":false,"code":"public class Main {\n    static String fizzbuzz(int n) {\n        if (n % 15 == 0) return \"FizzBuzz\";\n        if (n % 3 == 0) return \"Fizz\";\n        if (n % 5 == 0) return \"Buzz\";\n        return String.valueOf(n);\n    }\n\n    static int passed = 0;\n    static int failed = 0;\n\n    // 実際の値と、期待する値をくらべる\n    static void check(String name, String actual, String expected) {\n        if (actual.equals(expected)) {\n            passed++;\n            System.out.println(\"OK   \" + name);\n        } else {\n            failed++;\n            System.out.println(\"NG   \" + name + \": 期待 \" + expected + \" / 実際 \" + actual);\n        }\n    }\n\n    public static void main(String[] args) {\n        check(\"3 は Fizz\", fizzbuzz(3), \"Fizz\");\n        check(\"5 は Buzz\", fizzbuzz(5), \"Buzz\");\n        check(\"15 は FizzBuzz\", fizzbuzz(15), \"FizzBuzz\");\n        check(\"7 は 7\", fizzbuzz(7), \"7\");\n        System.out.println(\"成功 \" + passed + \" / 失敗 \" + failed);\n    }\n}"}],"output":"OK   3 は Fizz\nOK   5 は Buzz\nOK   15 は FizzBuzz\nOK   7 は 7\n成功 4 / 失敗 0","run":"javac Main.java && java Main"},"16":{"points":["`n -> n * 2` は「ラムダ式」。名前のない小さな関数です。","`stream()` のあとに `filter`（しぼる）、`map`（作りかえる）、`sorted`（ならべる）をつなぎ、最後に `toList()` などでまとめます。","`record Book(String title, int price) {}` は、データの入れ物を1行で作ります。コンストラクタや `title()` などが自動でできます。","`\u003cT>` はジェネリクス。「どんな型でも使えるが、入れた型はおぼえている」メソッドやクラスを作れます。"],"files":[{"name":"Main.java","main":true,"shell":false,"code":"import java.util.Comparator;\nimport java.util.List;\n\nrecord Book(String title, int price) {}\n\npublic class Main {\n    // どんな型のリストでも、最初の要素を返せる\n    static \u003cT> T first(List\u003cT> list) {\n        return list.get(0);\n    }\n\n    public static void main(String[] args) {\n        List\u003cInteger> nums = List.of(1, 2, 3, 4, 5, 6);\n\n        List\u003cInteger> evens = nums.stream().filter(n -> n % 2 == 0).toList();\n        List\u003cInteger> doubled = nums.stream().map(n -> n * 2).toList();\n        int total = nums.stream().mapToInt(n -> n).sum();\n        System.out.println(evens);\n        System.out.println(doubled);\n        System.out.println(\"合計: \" + total);\n\n        List\u003cBook> books = List.of(\n            new Book(\"Java入門\", 2400), new Book(\"図かん\", 1800), new Book(\"まんが\", 600));\n\n        List\u003cString> cheap = books.stream()\n            .filter(b -> b.price() \u003c 2000)                 // しぼる\n            .sorted(Compa
