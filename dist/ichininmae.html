 \"minitest/autorun\"\n\ndef fizzbuzz(n)\n  if n % 15 == 0\n    \"FizzBuzz\"\n  elsif n % 3 == 0\n    \"Fizz\"\n  elsif n % 5 == 0\n    \"Buzz\"\n  else\n    n.to_s\n  end\nend\n\nclass FizzBuzzTest \u003c Minitest::Test\n  def test_fizz\n    assert_equal \"Fizz\", fizzbuzz(3)\n  end\n\n  def test_buzz\n    assert_equal \"Buzz\", fizzbuzz(5)\n  end\n\n  def test_fizzbuzz\n    assert_equal \"FizzBuzz\", fizzbuzz(15)\n  end\n\n  def test_number\n    assert_equal \"7\", fizzbuzz(7)\n  end\nend"}],"mode":"test","output":"4 runs, 4 assertions, 0 failures, 0 errors, 0 skips","run":"ruby main.rb"},"16":{"points":["`class Square \u003c Rect` は継承。親クラスのメソッドを、そのまま受けつぎます。`super` で親の同じ名前のメソッドを呼べます。","`module` は、メソッドのまとまりです。`include` すると、そのクラスのメソッドとして使えるようになります（Mix-in）。","`Comparable` を include して `\u003c=>` を作ると、`\u003c`、`>`、`==`、`between?` が使えるようになります。配列の `sort`、`max`、`min` も使えます。","かんたんなデータの入れ物は、`Struct.new(:name, :price)` でも作れます。"],"files":[{"name":"main.rb","main":true,"shell":false,"code":"# 「説明できる」という機能をまとめたモジュール\nmodule Describable\n  def describe\n    \"#{name} の面積: #{area}\"\n  end\nend\n\nclass Rect\n  include Comparable       # くらべる機能をまぜこむ\n  include Describable      # 自分で作ったモジュールもまぜこめる\n\n  attr_reader :w, :h\n\n  def initialize(w, h)\n    @w = w\n    @h = h\n  end\n\n  def area\n    w * h\n  end\n\n  def name\n    \"長方形\"\n  end\n\n  # これ1つで \u003c, >, == などが全部使えるようになる\n  def \u003c=>(other)\n    area \u003c=> other.area\n  end\nend\n\nclass Square \u003c Rect        # 正方形は、長方形の一種（継承）\n  def initialize(side)\n    super(side, side)      # 親の initialize を呼ぶ\n  end\n\n  def name\n    \"正方形\"\n  end\nend\n\nshapes = [Rect.new(3, 4), Square.new(5), Rect.new(1, 2)]\nshapes.each { |s| puts s.describe }\n\nputs shapes[0] \u003c shapes[1]              # Comparable のおかげ\nputs \"いちばん大きい: #{shapes.max.describe}\"\nputs shapes.sort.map(&:area).join(\" \u003c \")\n\n# かんたんなデータの入れ物\nBook = Struct.new(:title, :price)\nbook = Book.new(\"Ruby入門\", 2400)\nputs \"#{book.title} #{book.price} 円\""}],"title":"継承・モジュール・Mix-in","goal":"継承でクラスを広げ、モジュールを include して機能を足す（Mix-in）ことができるようになる。","intro":"Ruby では、クラスに機能を足す方法が2つあります。親クラスから受けつぐ「継承」と、モジュールをまぜこむ「Mix-in」です。Comparable や Enumerable といった最初からあるモジュールをまぜこむと、少し書くだけでたくさんのメソッドが使えるようになります。Rails のコードは、このしくみの上にできています。","quiz":{"q":"クラスに Comparable を include して使うには、何を作ればよい？","choices":["\u003c と > と == を全部","\u003c=> メソッド1つ","sort メソッド"],"answer":1,"why":"\u003c=> を1つ作るだけで、Comparable が \u003c、>、==、between? などをまとめて用意してくれます。"},"task":"名前と点数を持つ Player クラスを作り、Comparable を include して、点数でくらべられるようにしてみよう。配列の max で、いちばん点数の高い人を表示しよう。","hint":"def \u003c=>(other) の中で、score \u003c=> other.score を返します。","output":"長方形 の面積: 12\n正方形 の面積: 25\n長方形 の面積: 2\ntrue\nいちばん大きい: 正方形 の面積: 25\n2 \u003c 12 \u003c 25\nRuby入門 2400 円","run":"ruby main.rb"},"17":{"points":["ライブラリのことを「gem」とよびます。`gem install` で入れられます。","プロジェクトでは、使う gem を `Gemfile` に書き、Bundler（`bundle install`）でまとめて入れます。","`irb` は、1行ずつ打ってすぐ結果が見られる道具です。メソッドの動きを確かめるのにとても便利です。","RuboCop は、書き方をそろえ、あやしい所を教えてくれます。","仕事では Ruby on Rails を使うことがほとんどです。この先の大きな目標になります。"],"files":[{"name":"shell","main":false,"shell":true,"code":"# バージョンを確かめる\nruby --version\n\n# 1行ずつためす\nirb\n\n# プロジェクトを始めて、gem を入れる\nbundle init\nbundle add minitest rubocop\nbundle install\n\n# Gemfile の gem を使って動かす\nbundle exec ruby main.rb\n\n# 書き方をそろえる・まちがいを探す\nbundle exec rubocop\nbundle exec rubocop -a\n\n# テストを動かす\nbundle exec ruby test/fizzbuzz_test.rb"}]},"18":{"points":["「分ける → 数える → ならべる → 表示する」と、仕事ごとにメソッドを分けています。","`tally` は、「同じ値が何個あるか」を数えてハッシュにしてくれるメソッドです。","`sort_by { |word, count| [-count, word] }` で、「回数の多い順、同じならアルファベット順」にしています。","空の文章が来たときは、例外を起こして知らせています。"],"files":[{"name":"main.rb","main":true,"shell":false,"code":"# 文章を、小文字の単語の配列にする\ndef split_words(text)\n  text.downcase.split.map { |raw| raw.gsub(/[^a-z]/, \"\") }.reject(&:empty?)\nend\n\n# 回数の多い順（同じならアルファベット順）に n 個\ndef top(counts, n)\n  counts.sort_by { |word, count| [-count, word] }.first(n)\nend\n\ndef report(text)\n  words = split_words(text)\n  raise ArgumentError, \"単語がありません\" if words.empty?\n\n  counts = words.tally             # 単語 => 回数\n  puts \"全部で #{words.length} 語、#{counts.size} 種類\"\n  top(counts, 3).each do |word, count|\n    puts \"#{word}: #{count}\"\n  end\nend\n\nreport(\"The cat saw the dog. The dog saw the bird!\")\n\nbegin\n  report(\"...\")\nrescue ArgumentError => e\n  puts \"エラー: #{e.message}\"\nend"}],"output":"全部で 10 語、5 種類\nthe: 4\ndog: 2\nsaw: 2\nエラー: 単語がありません","run":"ruby main.rb"},"01":{"points":["`puts` で表示して改行します。`print` は改行しません。","`#` から行の終わりまではコメントです。","行の終わりに `;` はいりません。かっこ `( )` も、多くの場合は省略できます。","`p` は、中身を「そのままの形」で表示します。調べものに便利です。"],"files":[{"name":"main.rb","main":true,"shell":false,"code":"# はじめてのプログラム\nputs \"こんにちは！\"\nputs \"プログラミングをはじめます。\"\nputs \"1 + 2 = #{1 + 2}\"   # #{ } の中は、計算した結果に置きかわります"}],"output":"こんにちは！\nプログラミングをはじめます。\n1 + 2 = 3","run":"ruby main.rb"},"02":{"points":["変数は `名前 = 値` で作ります。型は書かなくても、入れた値で決まります。","変数の名前は、小文字と `_` で書くのが Ruby のきまりです（`is_student`）。","ダブルクォート `\" \"` の文字列の中では、`#{ }` が値に置きかわります。シングルクォート `' '` では置きかわりません。","Ruby では、数も文字列も全部「オブジェクト（もの）」です。`.class` で、何者かを調べられます。"],"files":[{"name":"main.rb","main":true,"shell":false,"code":"name = \"さくら\"      # 文字列 (String)\nage = 15             # 整数 (Integer)\nheight = 152.5       # 小数 (Float)\nis_student = true    # 真か偽か\n\nputs \"名前: #{name}\"\nputs \"年れい: #{age}\"\nputs \"身長: #{height}\"\nputs \"学生: #{is_student}\"\n\nage = age + 1        # 変数は、あとから入れなおせます\nputs \"来年は #{age} さい\"\nputs age.class\nputs height.class"}],"output":"名前: さくら\n年れい: 15\n身長: 152.5\n学生: true\n来年は 16 さい\nInteger\nFloat","run":"ruby main.rb"},"03":{"points":["整数どうしの `/` は、小数点より下を切りすてます（7 / 2 は 3）。小数がほしいときは、どちらかを小数にします（`7 / 2.0` や `7.to_f`）。","`%` はあまり、`**` は累乗です。","文字列は `+` でつなげられます。数とつなぐときは `to_s` で文字列に変えるか、`#{ }` を使います。","文字数は `length`（または `size`）で調べます。日本語も1文字として数えます。"],"files":[{"name":"main.rb","main":true,"shell":false,"code":"a = 7\nb = 2\nputs \"7 + 2 = #{a + b}\"\nputs \"7 - 2 = #{a - b}\"\nputs \"7 * 2 = #{a * b}\"\nputs \"7 / 2 = #{a / b}\"         # 整数どうしは切りすて\nputs \"7 / 2.0 = #{a / 2.0}\"     # 小数にすると 3.5\nputs \"7 % 2 = #{a % b}\"         # あまり\n\nfamily = \"山田\"\ngiven = \"太郎\"\nfull = family + \" \" + given\nputs \"フルネーム: #{full}\"\nputs \"文字数: #{\"program\".length}\"\nputs \"年れい: \" + 15.to_s + \" さい\""}],"output":"7 + 2 = 9\n7 - 2 = 5\n7 * 2 = 14\n7 / 2 = 3\n7 / 2.0 = 3.5\n7 % 2 = 1\nフルネーム: 山田 太郎\n文字数: 7\n年れい: 15 さい","run":"ruby main.rb"},"04":{"points":["`if 条件` から `end` までが1つのまとまりです。条件に `( )` はいりません。","次の条件は `elsif`（`else` の e がありません）、「どれでもないとき」は `else` です。","「かつ」は `&&`、「または」は `||`、「〜でない」は `!` です。","`unless` は「もし〜でなければ」。`puts \"x\" if 条件` のように、後ろに `if` を書くこともできます。","Ruby で「偽」になるのは `false` と `nil` だけです。0 や空の文字列は「真」です。"],"files":[{"name":"main.rb","main":true,"shell":false,"code":"score = 72\n\nif score >= 80\n  puts \"よくできました\"\nelsif score >= 60\n  puts \"合格\"\nelse\n  puts \"もう少し\"\nend\n\nage = 15\nhas_ticket = true\nif age >= 12 && has_ticket\n  puts \"入場できます\"\nend\n\nputs \"子ども料金です\" if age \u003c 18        # 後ろに if を書く\nputs \"チケットが必要です\" unless has_ticket"}],"output":"合格\n入場できます\n子ども料金です","run":"ruby main.rb"},"05":{"points":["Ruby では、`for` よりも `times` や `each` を使うのがふつうです。","`5.times do |i| ... end` は 5 回くりかえします。`i` は 0 から始まります。","`(1..5)` は「1 から 5 まで」の範囲。`each` で1つずつ取り出します。","`while 条件` もあります。`next` は「今回は飛ばして次へ」、`break` は「くりかえしをやめる」です。"],"files":[{"name":"main.rb","main":true,"shell":false,"code":"# 決まった回数くりかえす\n(1..5).each do |i|\n  puts \"#{i} 回目\"\nend\n\n# 条件が成り立つあいだくりかえす\ncount = 3\nwhile count > 0\n  puts count\n  count -= 1\nend\nputs \"発射！\"\n\n# 1〜10 の偶数だけを足す\ntotal = 0\n(1..10).each do |i|\n  next if i.odd?      # 奇数は飛ばす\n  total += i\nend\nputs \"偶数の合計: #{total}\"\n\n3.times { print \"★\" }  # 短いときは { } でも書ける\nputs"}],"output":"1 回目\n2 回目\n3 回目\n4 回目\n5 回目\n3\n2\n1\n発射！\n偶数の合計: 30\n★★★","run":"ruby main.rb"},"06":{"points":["メソッド（関数）は `def 名前(引数)` から `end` までです。","最後に計算した値が、そのまま返す値になります。`return` は書かなくてもかまいません。","`def greet(name = \"みなさん\")` のように、引数に「何も渡されなかったときの値」を決められます。","真・偽を返すメソッドは、名前の最後に `?` をつけるのがきまりです（`even?`）。"],"files":[{"name":"main.rb","main":true,"shell":false,"code":"def add(a, b)\n  a + b              # 最後の値が返る\nend\n\ndef greet(name = \"みなさん\")\n  \"こんにちは、#{name}さん\"\nend\n\ndef even?(n)\n  n % 2 == 0\nend\n\nputs \"3 + 4 = #{add(3, 4)}\"\nputs greet(\"さくら\")\nputs greet\nputs \"10 は偶数？ #{even?(10)}\"\nputs \"7 は偶数？ #{even?(7)}\""}],"output":"3 + 4 = 7\nこんにちは、さくらさん\nこんにちは、みなさんさん\n10 は偶数？ true\n7 は偶数？ false","run":"ruby main.rb"},"07":{"points":["配列は `[ ]` で作ります。番号は 0 から始まります。","`\u003c\u003c` で後ろに追加、`length` で個数。`first` / `last` で最初と最後が取れます。","`sum`、`max`、`min`、`sort` など、便利なメソッドがたくさんあります。","`sort` は「ならべかえた新しい配列」を返します。もとの配列を変えるのは `sort!` です。`!` つきは「自分を変える」しるしです。"],"files":[{"name":"main.rb","main":true,"shell":false,"code":"scores = [70, 85, 60]\nscores \u003c\u003c 90                    # 後ろに追加\n\nputs \"最初の点数: #{scores[0]}\"\nputs \"最後の点数: #{scores.last}\"\nputs \"人数: #{scores.length}\"\n\ntotal = 0\nscores.each do |s|\n  total += s\nend\nputs \"合計: #{total}\"\nputs \"平均: #{total.to_f / scores.length}\"\nputs \"最高点: #{scores.max}\"\n\nsorted = scores.sort            # 小さい順の新しい配列\np sorted"}],"output":"最初の点数: 70\n最後の点数: 90\n人数: 4\n合計: 305\n平均: 76.25\n最高点: 90\n[60, 70, 85, 90]","run":"ruby main.rb"},"08":{"points":["ハッシュ（辞書）は `{ キー => 値 }` で作ります。`prices[\"りんご\"]` のようにキーで取り出します。","ないキーを取り出すと `nil` になります。`fetch` を使うと、ないときの値を決められます。","`each do |name, price|` で、キーと値をいっしょに取り出せます。","キーには「シンボル」（`:name`）もよく使います。`{ name: \"さくら\", age: 15 }` と書けます。"],"files":[{"name":"main.rb","main":true,"shell":false,"code":"prices = { \"りんご\" => 120, \"バナナ\" => 80 }\nprices[\"みかん\"] = 60          # 追加\n\nputs \"りんご は #{prices[\"りんご\"]} 円\"\n\nif prices.key?(\"ぶどう\")\n  puts \"ぶどう は #{prices[\"ぶどう\"]} 円\"\nelse\n  puts \"ぶどう はありません\"\nend\n\nputs \"もも: #{prices.fetch(\"もも\", \"不明\")}\"   # なければ「不明」\n\nputs \"--- 一覧 ---\"\nprices.each do |name, price|\n  puts \"#{name}: #{price} 円\"\nend\nputs \"種類: #{prices.size}\"\n\n# シンボルをキーにしたハッシュ\nuser = { name: \"さくら\", age: 15 }\nputs \"#{user[:name]} #{user[:age]}\""}],"output":"りんご は 120 円\nぶどう はありません\nもも: 不明\n--- 一覧 ---\nりんご: 120 円\nバナナ: 80 円\nみかん: 60 円\n種類: 3\nさくら 15","run":"ruby main.rb"},"09":{"points":["`split` で分けて配列に、`join` で配列をつないで文字列にします。","`upcase`、`include?`、`sub`（最初の1つを置きかえ）、`gsub`（全部を置きかえ）、`strip`（前後の空白を取る）がよく使われます。","`text[0, 3]` で「0番目から3文字」を取り出せます。","メソッドは `.` でどんどんつなげられます（メソッドチェーン）。"],"files":[{"name":"main.rb","main":true,"shell":false,"code":"text = \"apple,banana,cherry\"\n\nfruits = text.split(\",\")             # カンマで分ける\nputs \"#{fruits.length} 個\"\nputs \"1番目: #{fruits[0]}\"\nputs \"大文字: #{fruits[0].upcase}\"\nputs \"banana をふくむ？ #{text.include?(\"banana\")}\"\nputs \"つなぐ: #{fruits.join(\" / \")}\"\nputs \"置きかえ: #{text.sub(\"cherry\", \"melon\")}\"\nputs \"全部置きかえ: #{text.gsub(\",\", \" \")}\"\n\nmessy = \"   hello   \"\nputs \"[#{messy.strip}]\"              # 前後の空白を取る\nputs \"先頭3文字: #{text[0, 3]}\"\nputs text.split(\",\").map(&:capitalize).join(\" \")   # つなげて書ける"}],"output":"3 個\n1番目: apple\n大文字: APPLE\nbanana をふくむ？ true\nつなぐ: apple / banana / cherry\n置きかえ: apple,banana,melon\n全部置きかえ: apple banana cherry\n[hello]\n先頭3文字: app\nApple Banana Cherry","run":"ruby main.rb"}}},{"id":"go","name":"Go","type":"静的型","exec":"コンパイル","tagline":"シンプルで速い、サーバーのための言語","about":"Google で生まれた言語で、Web サーバーやクラウドの道具（Docker など）に使われています。機能をわざと少なくして、だれが書いても同じような形になるように作られています。","run":"go run main.go","flow":[["main.go","あなたが書く"],["go build","コンパイラ","tool"],["app","機械語のファイル"],["CPU","が直接実行"]],"flowNote":"コンパイルがとても速く、できたファイル1つを置くだけで動きます。`go run` は、コンパイルと実行をまとめて行います。","ready":["構造体・メソッド・インターフェースで、プログラムを組み立てられる","error を返し、if err != nil でもれなく確かめられる","ゴルーチンとチャネルで、同時に動く処理を安全に書ける","go mod でパッケージを分け、go test でテストを書ける"],"next":["net/http で、JSON を返す Web API を作る","コマンドラインの道具を作って、1つのファイルにして配る","context を使って、時間切れや中止をあつかう"],"lessons":{"10":{"points":["Go にクラスはありません。データは `struct`（構造体）にまとめ、それにメソッドをつけます。","`func (a *Account) Deposit(...)` の `(a *Account)` を「レシーバ」といいます。「Account のメソッドです」という意味です。","中身を変えるメソッドは、レシーバを `*Account`（ポインタ）にします。`*` がないとコピーが変わるだけで、もとは変わりません。","名前が大文字で始まる物は、ほかのパッケージから使えます。小文字で始まる物は、そのパッケージの中だけです。","`NewAccount` のように、`New` で始まる関数で実物を作るのが Go のならわしです。"],"files":[{"name":"main.go","main":true,"shell":false,"code":"package main\n\nimport \"fmt\"\n\ntype Account struct {\n\tOwner   string\n\tbalance int // 小文字で始まるので、パッケージの外からはさわれない\n}\n\n// 実物を作る関数\nfunc NewAccount(owner string, balance int) *Account {\n\treturn &Account{Owner: owner, balance: balance}\n}\n\n// 中身を変えるので、レシーバはポインタ (*Account)\nfunc (a *Account) Deposit(amount int) {\n\ta.balance += amount\n}\n\nfunc (a *Account) Balance() int {\n\treturn a.balance\n}\n\nfunc (a *Account) Show() {\n\tfmt.Printf(\"%s の残高: %d 円\\n\", a.Owner, a.balance)\n}\n\nfunc main() {\n\ta := NewAccount(\"さくら\", 1000)\n\tb := NewAccount(\"たろう\", 300)\n\n\ta.Deposit(500) // a だけが増える\n\ta.Show()\n\tb.Show()\n\tfmt.Println(a.Balance())\n}"}],"output":"さくら の残高: 1500 円\nたろう の残高: 300 円\n1500","run":"go run main.go"},"11":{"points":["`interface` には、「どんなメソッドがあるか」だけを書きます。","メソッドがそろっていれば、自動的にそのインターフェースとして使えます。`implements` は書きません。","`[]Shape` に、Rect も Circle も入れられます。呼ぶ側は、中身の種類を気にしなくてすみます。","`String() string` メソッドを作ると、`fmt.Println` で表示するときに使われます（`fmt.Stringer` というインターフェース）。","継承はありません。かわりに、構造体の中にほかの構造体をうめこんで、機能を借ります。"],"files":[{"name":"main.go","main":true,"shell":false,"code":"package main\n\nimport (\n\t\"fmt\"\n\t\"math\"\n)\n\n// 「面積と名前を返せるもの」という約束\ntype Shape interface {\n\tArea() float64\n\tName() string\n}\n\ntype Rect struct {\n\tW, H float64\n}\n\nfunc (r Rect) Area() float64 { return r.W * r.H }\nfunc (r Rect) Name() string  { return \"長方形\" }\n\ntype Circle struct {\n\tR float64\n}\n\nfunc (c Circle) Area() float64 { return math.Pi * c.R * c.R }\nfunc (c Circle) Name() string  { return \"円\" }\n\n// fmt.Println で表示するときに使われる\nfunc (c Circle) String() string {\n\treturn fmt.Sprintf(\"半径 %.0f の円\", c.R)\n}\n\n// Shape なら何でも受けとれる\nfunc describe(s Shape) string {\n\treturn fmt.Sprintf(\"%s の面積: %.2f\", s.Name(), s.Area())\n}\n\nfunc main() {\n\tshapes := []Shape{Rect{3, 4}, Circle{1}, Rect{5, 5}}\n\tfor _, s := range shapes {\n\t\tfmt.Println(describe(s))\n\t}\n\n\tfmt.Println(Circle{2}) // String() が使われる\n}"}],"title":"インターフェース","goal":"「同じ使い方ができる、ちがう種類のもの」を、インターフェースでまとめてあつかえるようになる。","intro":"Go のインターフェースは「このメソッドを持っていること」という約束です。ほかの言語とちがい、「この約束を守ります」と宣言する必要がありません。メソッドがそろっていれば、自動的にそのインターフェースとして使えます。標準ライブラリの io.Reader や error もインターフェースで、Go のコードを読むための土台になります。","quiz":{"q":"type Shape interface { Area() float64 } があるとき、ある型を Shape として使うには？","choices":["implements Shape と書く","Area() float64 というメソッドを持っていればよい","Shape を継承する"],"answer":1,"why":"Go では宣言はいりません。必要なメソッドを持っているだけで、自動的にそのインターフェースとして使えます。"},"task":"Shape を満たす Triangle（三角形。底辺と高さを持つ）を足して、スライスに入れて面積を表示してみよう。","hint":"type Triangle struct { Base, Height float64 } を作り、Area() と Name() の2つのメソッドをつけます。","output":"長方形 の面積: 12.00\n円 の面積: 3.14\n長方形 の面積: 25.00\n半径 2 の円","run":"go run main.go"},"12":{"points":["Go では、1つのフォルダが1つの「パッケージ」です。フォルダの中のファイルは、全部同じ `package 名前` で始めます。","`go.mod` は、プロジェクト（モジュール）の名前と Go のバージョンを書くファイルです。`go mod init 名前` で作ります。","ほかのパッケージは `import \"モジュール名/フォルダ名\"` で読みこみ、`greeting.Hello( )` のように使います。","外から使える物は、名前が大文字で始まる物だけです（`Hello` は使える、`hello` は使えない）。","フォルダごと動かすときは `go run .` と書きます。"],"files":[{"name":"go.mod","main":false,"shell":false,"code":"module example\n\ngo 1.22"},{"name":"greeting/greeting.go","main":false,"shell":false,"code":"// あいさつを作る部品\npackage greeting\n\n// 大文字で始まるので、外から使える\nfunc Hello(name string) string {\n\treturn \"こんにちは、\" + name + suffix()\n}\n\nfunc Bye(name string) string {\n\treturn \"さようなら、\" + name + suffix()\n}\n\n// 小文字で始まるので、このパッケージの中だけで使える\nfunc suffix() string {\n\treturn \"さん\"\n}"},{"name":"main.go","main":true,"shell":false,"code":"package main\n\nimport (\n\t\"fmt\"\n\n\t\"example/greeting\"\n)\n\nfunc main() {\n\tfmt.Println(greeting.Hello(\"さくら\"))\n\tfmt.Println(greeting.Bye(\"さくら\"))\n}"}],"output":"こんにちは、さくらさん\nさようなら、さくらさん","run":"go run ."},"13":{"points":["Go には例外（try / catch）がありません。失敗するかもしれない関数は、最後の返り値として `error` を返します。","呼んだらすぐ `if err != nil { }` で確かめます。Go のコードでいちばんよく見る形です。","エラーは `errors.New(\"説明\")` や `fmt.Errorf(\"...: %w\", err)` で作ります。`%w` は、もとのエラーを中につつみます。","うまくいったときは、エラーの所に `nil`（何もない）を返します。","`panic` は、もうどうにもならないときにプログラムを止める物です。ふつうのエラーには使いません。"],"files":[{"name":"main.go","main":true,"shell":false,"code":"package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"strconv\"\n)\n\n// 答えとエラーの2つを返す\nfunc divide(a, b int) (int, error) {\n\tif b == 0 {\n\t\treturn 0, errors.New(\"0 で割ることはできません\")\n\t}\n\treturn a / b, nil // nil は「エラーなし」\n}\n\nfunc main() {\n\tanswer, err := divide(10, 2)\n\tif err != nil {\n\t\tfmt.Println(\"エラー:\", err)\n\t} else {\n\t\tfmt.Println(\"10 ÷ 2 =\", answer)\n\t}\n\n\t_, err = divide(10, 0)\n\tif err != nil {\n\t\tfmt.Println(\"エラー:\", err)\n\t}\n\n\ttext := \"abc\"\n\tnumber, err := strconv.Atoi(text) // 文字列を数にする\n\tif err != nil {\n\t\tfmt.Printf(\"%q は数ではありません\\n\", text)\n\t} else {\n\t\tfmt.Println(number)\n\t}\n\tfmt.Println(\"チェック終わり\")\n}"}],"output":"10 ÷ 2 = 5\nエラー: 0 で割ることはできません\n\"abc\" は数ではありません\nチェック終わり","run":"go run main.go"},"14":{"points":["`os.WriteFile` で書きこみ、`os.ReadFile` で全部を読みこみます。読んだ物は `[]byte` なので、`string( )` で文字列にします。","ファイルの操作は、必ず `error` を返します。毎回 `if err != nil` で確かめます。","`0644` は、ファイルを「だれが読み書きできるか」の設定です。ふつうのファイルはこれで大丈夫です。","ファイルがないことは `errors.Is(err, os.ErrNotExist)` で調べられます。","`defer` は、「この関数を出るときに必ずやること」を予約します。開いたファイルを閉じるときによく使います。"],"files":[{"name":"main.go","main":true,"shell":false,"code":"package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"os\"\n\t\"strings\"\n)\n\nfunc main() {\n\tlines := []string{\"牛乳を買う\", \"宿題をする\", \"本を読む\"}\n\n\t// 書きこむ\n\terr := os.WriteFile(\"memo.txt\", []byte(strings.Join(lines, \"\\n\")+\"\\n\"), 0644)\n\tif err != nil {\n\t\tfmt.Println(\"書けませんでした:\", err)\n\t\treturn\n\t}\n\tfmt.Println(len(lines), \"行 書きました\")\n\n\t// 読みこむ\n\tdata, err := os.ReadFile(\"memo.txt\")\n\tif err != nil {\n\t\tfmt.Println(\"読めませんでした:\", err)\n\t\treturn\n\t}\n\tloaded := strings.Split(strings.TrimSpace(string(data)), \"\\n\")\n\tfor i, line := range loaded {\n\t\tfmt.Printf(\"%d: %s\\n\", i+1, line)\n\t}\n\n\t// ないファイルを開こうとしたとき\n\t_, err = os.ReadFile(\"ない.txt\")\n\tif errors.Is(err, os.ErrNotExist) {\n\t\tfmt.Println(\"ない.txt は開けませんでした\")\n\t}\n}"}],"output":"3 行 書きました\n1: 牛乳を買う\n2: 宿題をする\n3: 本を読む\nない.txt は開けませんでした","run":"go run main.go"},"15":{"points":["Go には、テストの道具 `testing` が最初から入っています。`go test` で動かします。","テストは、名前が `_test.go` で終わるファイルに書きます。関数の名前は `Test` で始めます。","「入力と期待する答え」を表にならべて、ループで全部ためす書き方（テーブル駆動テスト）が、Go の定番です。","`t.Errorf` は、「失敗」と記録して、そのまま先に進みます。","`go test -v` で、1つずつの結果を見られます。"],"files":[{"name":"go.mod","main":false,"shell":false,"code":"module example\n\ngo 1.22"},{"name":"fizzbuzz.go","main":false,"shell":false,"code":"package fizzbuzz\n\nimport \"strconv\"\n\nfunc FizzBuzz(n int) string {\n\tswitch {\n\tcase n%15 == 0:\n\t\treturn \"FizzBuzz\"\n\tcase n%3 == 0:\n\t\treturn \"Fizz\"\n\tcase n%5 == 0:\n\t\treturn \"Buzz\"\n\tdefault:\n\t\treturn strconv.Itoa(n)\n\t}\n}"},{"name":"fizzbuzz_test.go","main":true,"shell":false,"code":"package fizzbuzz\n\nimport \"testing\"\n\nfunc TestFizzBuzz(t *testing.T) {\n\t// 入力と、期待する答えの表\n\ttests := []struct {\n\t\tn    int\n\t\twant string\n\t}{\n\t\t{3, \"Fizz\"},\n\t\t{5, \"Buzz\"},\n\t\t{15, \"FizzBuzz\"},\n\t\t{7, \"7\"},\n\t}\n\n\tfor _, tt := range tests {\n\t\tgot := FizzBuzz(tt.n)\n\t\tif got != tt.want {\n\t\t\tt.Errorf(\"FizzBuzz(%d) = %q, 期待は %q\", tt.n, got, tt.want)\n\t\t}\n\t}\n}\n\nfunc TestMultipleOfFifteen(t *testing.T) {\n\tif got := FizzBuzz(30); got != \"FizzBuzz\" {\n\t\tt.Errorf(\"FizzBuzz(30) = %q\", got)\n\t}\n}"}],"mode":"test","output":"=== RUN   TestFizzBuzz\n--- PASS: TestFizzBuzz (0.00s)\n=== RUN   TestMultipleOfFifteen\n--- PASS: TestMultipleOfFifteen (0.00s)\nPASS\nok","run":"go test -v"},"16":{"points":["`go 関数( )` と書くと、その関数が別の流れ（ゴルーチン）で動きはじめます。呼んだ側は待たずに先へ進みます。","`sync.WaitGroup` は、「全部のゴルーチンが終わるまで待つ」ための道具です。","チャネル（`chan int`）は、ゴルーチンどうしでデータを受けわたす管です。`ch \u003c- 値` で送り、`\u003c-ch` で受けとります。","送り終わったら `close(ch)` で閉じます。受ける側は `for v := range ch` で、閉じられるまで受けとれます。","いくつものゴルーチンから同じ変数を書きかえると、こわれます（データ競合）。`go run -race` で見つけられます。","ループの中の `i` や `n` をゴルーチンからそのまま使うこの書き方は、Go 1.22 以上で正しく動きます。"],"files":[{"name":"main.go","main":true,"shell":false,"code":"package main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n\t\"time\"\n)\n\n// 時間のかかる仕事のかわり\nfunc square(n int) int {\n\ttime.Sleep(50 * time.Millisecond)\n\treturn n * n\n}\n\n// 数を1つずつチャネルに送る\nfunc generate(ch chan\u003c- int, max int) {\n\tfor i := 1; i \u003c= max; i++ {\n\t\tch \u003c- i\n\t}\n\tclose(ch) // もう送らない、と知らせる\n}\n\nfunc main() {\n\tnums := []int{1, 2, 3, 4, 5}\n\tresults := make([]int, len(nums))\n\n\t// 5つの仕事を同時に動かす\n\tvar wg sync.WaitGroup\n\tstart := time.Now()\n\tfor i, n := range nums {\n\t\twg.Add(1)\n\t\tgo func() {\n\t\t\tdefer wg.Done()\n\t\t\tresults[i] = square(n) // それぞれ別の場所に書くので安全\n\t\t}()\n\t}\n\twg.Wait() // 全部終わるまで待つ\n\n\tfmt.Println(\"結果:\", results)\n\t// 1つ 50 ミリ秒の仕事が5つ。順番にやれば 250 ミリ秒かかるはず\n\tfmt.Println(\"200 ミリ秒より速かった？\", time.Since(start) \u003c 200*time.Millisecond)\n\n\t// チャネル: ゴルーチンから値を受けとる\n\tch := make(chan int)\n\tgo generate(ch, 3)\n\tfor v := range ch { // 閉じられるまで受けとる\n\t\tfmt.Println(\"受けとった:\", v)\n\t}\n}"}],"title":"ゴルーチンとチャネル（並行処理）","goal":"go で処理を同時に動かし、WaitGroup で終わるのを待ち、チャネルで結果を受けわたせるようになる。","intro":"Go がサーバーの開発でえらばれる大きな理由が、「同時にたくさんの仕事をする」プログラムを書きやすいことです。関数の前に go と書くだけで、その関数が別の流れ（ゴルーチン）で動きはじめます。ゴルーチンどうしは、チャネルという「管」を通してデータを受けわたします。","quiz":{"q":"main 関数の中で go work() と書いたあと、何も待たずに main が終わるとどうなる？","choices":["work が終わるまで自動で待ってくれる","work が終わっていなくても、プログラム全体が終わる","コンパイルエラーになる"],"answer":1,"why":"main が終わると、ほかのゴルーチンがとちゅうでもプログラムは終わります。だから WaitGroup やチャネルで「終わるのを待つ」必要があります。"},"task":"1 から 5 までの数をチャネルに送るゴルーチンと、受けとって2乗を表示する main を書いてみよう。","hint":"送る側は for で ch \u003c- i のあと close(ch)。受ける側は for n := range ch { ... } です。","output":"結果: [1 4 9 16 25]\n200 ミリ秒より速かった？ true\n受けとった: 1\n受けとった: 2\n受けとった: 3","run":"go run main.go"},"17":{"points":["Go の道具は、全部 `go` コマンドに入っています。べつに入れる物がほとんどありません。","`gofmt`（`go fmt`）が書き方を自動でそろえます。Go のコードは、だれが書いても同じ見た目になります。","`go vet` は、あやしい所を教えてくれます。`go test` はテストを動かします。","`go mod init` でプロジェクトを始め、`go get` でライブラリを入れます。使うライブラリは `go.mod` に書かれます。","`go build` で、動かせるファイルが1つできます。それをコピーするだけで、ほかのパソコンやサーバーで動きます。","公式の「A Tour of Go」（日本語あり）は、ブラウザだけで Go を一通りためせます。"],"files":[{"name":"shell","main":false,"shell":true,"code":"# バージョンを確かめる\ngo version\n\n# プロジェクトを始める（go.mod ができる）\ngo mod init example\n\n# そのまま動かす / 動かせるファイルを作る\ngo run .\ngo build -o app .\n\n# 書き方をそろえる・まちがいを探す\ngo fmt ./...\ngo vet ./...\n\n# テストを動かす（-race はデータ競合を見つける）\ngo test ./...\ngo test -race ./...\n\n# ライブラリを入れる / いらない物を整理する\ngo get github.com/google/uuid\ngo mod tidy"}]},"18":{"points":["「分ける → 数える → ならべる → 表示する」と、仕事ごとに関数を分けています。","`counts[w]++` は、ないキーが 0 として読まれることを使った、Go の定番の書き方です。","`sort.Slice` に、「どちらを先にするか」を決める関数を渡して、ならべかえています。","単語がないときは、`error` を返して知らせています。呼ぶ側が `if err != nil` で確かめます。"],"files":[{"name":"main.go","main":true,"shell":false,"code":"package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"sort\"\n\t\"strings\"\n\t\"unicode\"\n)\n\n// 文章を、小文字の単語のスライスにする\nfunc splitWords(text string) []string {\n\t// 文字（アルファベットなど）でない所で区切る\n\treturn strings.FieldsFunc(strings.ToLower(text), func(r rune) bool {\n\t\treturn !unicode.IsLetter(r)\n\t})\n}\n\nfunc countWords(words []string) map[string]int {\n\tcounts := map[string]int{}\n\tfor _, w := range words {\n\t\tcounts[w]++\n\t}\n\treturn counts\n}\n\ntype entry struct {\n\tword  string\n\tcount int\n}\n\n// 回数の多い順（同じならアルファベット順）に n 個\nfunc top(counts map[string]int, n int) []entry {\n\tentries := []entry{}\n\tfor w, c := range counts {\n\t\tentries = append(entries, entry{w, c})\n\t}\n\tsort.Slice(entries, func(i, j int) bool {\n\t\tif entries[i].count != entries[j].count {\n\t\t\treturn entries[i].count > entries[j].count\n\t\t}\n\t\treturn entries[i].word \u003c entries[j].word\n\t})\n\tif len(entries) > n {\n\t\tentries = entries[:n]\n\t}\n\treturn entries\n}\n\nfunc report(text string) error {\n\twords := splitWords(text)\n\tif len(words) == 0 {\n\t\treturn errors.New(\"単語がありません\")\n\t}\n\tcounts := countWords(words)\n\tfmt.Printf(\"全部で %d 語、%d 種類\\n\", len(words), len(counts))\n\tfor _, e := range top(counts, 3) {\n\t\tfmt.Printf(\"%s: %d\\n\", e.word, e.count)\n\t}\n\treturn nil\n}\n\nfunc main() {\n\tif err := report(\"The cat saw the dog. The dog saw the bird!\"); err != nil {\n\t\tfmt.Println(\"エラー:\", err)\n\t}\n\tif err := report(\"...\"); err != nil {\n\t\tfmt.Println(\"エラー:\", err)\n\t}\n}"}],"output":"全部で 10 語、5 種類\nthe: 4\ndog: 2\nsaw: 2\nエラー: 単語がありません","run":"go run main.go"},"01":{"points":["Go のファイルは、必ず `package` から始めます。動かすプログラムは `package main` です。","`import \"fmt\"` で、表示の道具を読みこみます。使っていない import があると、コンパイルエラーになります。","プログラムは `func main()` から動きはじめます。","`fmt.Println` で表示して改行します。文の終わりに `;` はいりません。`//` から行の終わりまではコメントです。","`go run main.go` で、コンパイルと実行をまとめてやってくれます。"],"files":[{"name":"main.go","main":true,"shell":false,"code":"// はじめてのプログラム\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(\"こんにちは！\")\n\tfmt.Println(\"プログラミングをはじめます。\")\n\tfmt.Println(\"1 + 2 =\", 1+2) // カンマで区切ると、間に空白が入ります\n}"}],"output":"こんにちは！\nプログラミングをはじめます。\n1 + 2 = 3","run":"go run main.go"},"02":{"points":["`name := \"さくら\"` の `:=` は、「変数を作って値を入れる」書き方です。型は、入れた値から自動で決まります。","型を書きたいときは `var age int = 15` と書きます。型は名前のあとに書きます。","一度決めた型は変えられません。`int` の変数に文字列を入れると、コンパイルエラーになります。","作ったのに使っていない変数があると、コンパイルエラーになります。Go はむだをゆるしません。","`fmt.Printf` では `%s`（文字列）、`%d`（整数）、`%v`（何でも）、`%T`（型）が使えます。"],"files":[{"name":"main.go","main":true,"shell":false,"code":"package main\n\nimport \"fmt\"\n\nfunc main() {\n\tname := \"さくら\"     // 文字列 (string)\n\tvar age int = 15  // 整数 (int)。型を書く書き方\n\theight := 152.5   // 小数 (float64)\n\tisStudent := true // 真か偽か (bool)\n\n\tfmt.Println(\"名前:\", name)\n\tfmt.Println(\"年れい:\", age)\n\tfmt.Println(\"身長:\", height)\n\tfmt.Println(\"学生:\", isStudent)\n\n\tage = age + 1 // 入れなおすときは = を使う（:= ではない）\n\tfmt.Printf(\"来年は %d さい\\n\", age)\n\tfmt.Printf(\"%T %T %T\\n\", name, age, height)\n}"}],"output":"名前: さくら\n年れい: 15\n身長: 152.5\n学生: true\n来年は 16 さい\nstring int float64","run":"go run main.go"},"03":{"points":["整数どうしの `/` は、小数点より下を切りすてます（7 / 2 は 3）。","Go は型を勝手に変えません。`int` と `float64` はそのまま計算できないので、`float64(a)` のように自分で変えます。","文字列は `+` でつなげます。数を文字列にまぜるときは `fmt.Sprintf` を使います。","`len(\"...\")` はバイト数を返します。日本語の文字数は `utf8.RuneCountInString` で数えます。"],"files":[{"name":"main.go","main":true,"shell":false,"code":"package main\n\nimport (\n\t\"fmt\"\n\t\"unicode/utf8\"\n)\n\nfunc main() {\n\ta := 7\n\tb := 2\n\tfmt.Println(\"7 + 2 =\", a+b)\n\tfmt.Println(\"7 - 2 =\", a-b)\n\tfmt.Println(\"7 * 2 =\", a*b)\n\tfmt.Println(\"7 / 2 =\", a/b)                     // 整数どうしは切りすて\n\tfmt.Println(\"7 / 2.0 =\", float64(a)/float64(b)) // 自分で小数に変える\n\tfmt.Println(\"7 % 2 =\", a%b)                     // あまり\n\n\tfamily := \"山田\"\n\tgiven := \"太郎\"\n\tfull := family + \" \" + given\n\tfmt.Println(\"フルネーム:\", full)\n\tfmt.Println(\"文字数:\", len(\"program\"))\n\tfmt.Println(\"バイト数:\", len(full), \"文字数:\", utf8.RuneCountInString(full))\n\n\tmessage := fmt.Sprintf(\"%s さんは %d さい\", given, 15)\n\tfmt.Println(message)\n}"}],"output":"7 + 2 = 9\n7 - 2 = 5\n7 * 2 = 14\n7 / 2 = 3\n7 / 2.0 = 3.5\n7 % 2 = 1\nフルネーム: 山田 太郎\n文字数: 7\nバイト数: 13 文字数: 5\n太郎 さんは 15 さい","run":"go run main.go"},"04":{"points":["`if 条件 { }` の形です。条件に `( )` はいりませんが、`{ }` は必ず書きます。","`else if` や `else` は、`}` と同じ行に書きます（Go のきまりです）。","「かつ」は `&&`、「または」は `||`、「〜でない」は `!` です。","`switch` は、いくつもの場合分けを読みやすく書けます。`break` を書かなくても、下の `case` には進みません。"],"files":[{"name":"main.go","main":true,"shell":false,"code":"package main\n\nimport \"fmt\"\n\nfunc main() {\n\tscore := 72\n\n\tif score >= 80 {\n\t\tfmt.Println(\"よくできました\")\n\t} else if score >= 60 {\n\t\tfmt.Println(\"合格\")\n\t} else {\n\t\tfmt.Println(\"もう少し\")\n\t}\n\n\tage := 15\n\thasTicket := true\n\tif age >= 12 && hasTicket {\n\t\tfmt.Println(\"入場できます\")\n\t}\n\n\tsize := \"M\"\n\tswitch size {\n\tcase \"S\":\n\t\tfmt.Println(\"小さい\")\n\tcase \"M\":\n\t\tfmt.Println(\"ふつう\")\n\tdefault:\n\t\tfmt.Println(\"大きい\")\n\t}\n}"}],"output":"合格\n入場できます\nふつう","run":"go run main.go"},"05":{"points":["Go のくりかえしは `for` だけです。`while` はありません。","`for はじめ; 続ける条件; 毎回すること { }` が基本の形です。","`for 条件 { }` と書くと、ほかの言語の `while` と同じになります。","配列などの中身を1つずつ取り出すときは `for i, v := range 配列 { }` を使います。","`continue` は「今回は飛ばして次へ」、`break` は「くりかえしをやめる」です。"],"files":[{"name":"main.go","main":true,"shell":false,"code":"package main\n\nimport \"fmt\"\n\nfunc main() {\n\t// 決まった回数くりかえす\n\tfor i := 1; i \u003c= 5; i++ {\n\t\tfmt.Println(i, \"回目\")\n\t}\n\n\t// 条件が成り立つあいだくりかえす（while のかわり）\n\tcount := 3\n\tfor count > 0 {\n\t\tfmt.Println(count)\n\t\tcount--\n\t}\n\tfmt.Println(\"発射！\")\n\n\t// 1〜10 の偶数だけを足す\n\ttotal := 0\n\tfor i := 1; i \u003c= 10; i++ {\n\t\tif i%2 == 1 {\n\t\t\tcontinue // 奇数は飛ばす\n\t\t}\n\t\ttotal += i\n\t}\n\tfmt.Println(\"偶数の合計:\", total)\n}"}],"output":"1 回目\n2 回目\n3 回目\n4 回目\n5 回目\n3\n2\n1\n発射！\n偶数の合計: 30","run":"go run main.go"},"06":{"points":["関数は `func 名前(引数 型) 返す型 { }` で作ります。型は名前のあとに書きます。","`func add(a, b int) int` のように、同じ型の引数はまとめて書けます。","Go の関数は、値をいくつも返せます。`func divmod(a, b int) (int, int)` のように書きます。","いらない返り値は `_` で受けとって捨てます。"],"files":[{"name":"main.go","main":true,"shell":false,"code":"package main\n\nimport \"fmt\"\n\nfunc add(a, b int) int {\n\treturn a + b\n}\n\nfunc greet(name string) string {\n\treturn \"こんにちは、\" + name + \"さん\"\n}\n\nfunc isEven(n int) bool {\n\treturn n%2 == 0\n}\n\n// 値を2つ返す: 商とあまり\nfunc divmod(a, b int) (int, int) {\n\treturn a / b, a % b\n}\n\nfunc main() {\n\tfmt.Println(\"3 + 4 =\", add(3, 4))\n\tfmt.Println(greet(\"さくら\"))\n\tfmt.Println(\"10 は偶数？\", isEven(10))\n\tfmt.Println(\"7 は偶数？\", isEven(7))\n\n\tq, r := divmod(17, 5)\n\tfmt.Println(\"17 ÷ 5 =\", q, \"あまり\", r)\n\t_, r2 := divmod(20, 6) // 商はいらないので _ で捨てる\n\tfmt.Println(\"あまりだけ:\", r2)\n}"}],"output":"3 + 4 = 7\nこんにちは、さくらさん\n10 は偶数？ true\n7 は偶数？ false\n17 ÷ 5 = 3 あまり 2\nあまりだけ: 2","run":"go run main.go"},"07":{"points":["`[]int{70, 85, 60}` は「スライス」。あとから長さを変えられる配列で、Go ではふつうこれを使います。","追加は `scores = append(scores, 90)`。結果を、もとの変数に入れなおすのがきまりです。","`len( )` で個数。番号は 0 から始まります。はんいの外を使うと、プログラムが止まります（panic）。","`scores[1:3]` で一部を切り出せます（1番目から3番目の手前まで）。","`slices` パッケージに、`Max`、`Sort`、`Contains` などの便利な関数があります。"],"files":[{"name":"main.go","main":true,"shell":false,"code":"package main\n\nimport (\n\t\"fmt\"\n\t\"slices\"\n)\n\nfunc main() {\n\tscores := []int{70, 85, 60}\n\tscores = append(scores, 90) // 後ろに追加\n\n\tfmt.Println(\"最初の点数:\", scores[0])\n\tfmt.Println(\"最後の点数:\", scores[len(scores)-1])\n\tfmt.Println(\"人数:\", len(scores))\n\n\ttotal := 0\n\tfor _, s := range scores { // 番号はいらないので _ で捨てる\n\t\ttotal += s\n\t}\n\tfmt.Println(\"合計:\", total)\n\tfmt.Println(\"平均:\", float64(total)/float64(len(scores)))\n\tfmt.Println(\"最高点:\", slices.Max(scores))\n\n\tfmt.Println(\"一部:\", scores[1:3])\n\tslices.Sort(scores) // 小さい順にならべかえる\n\tfmt.Println(\"ならべかえ:\", scores)\n}"}],"output":"最初の点数: 70\n最後の点数: 90\n人数: 4\n合計: 305\n平均: 76.25\n最高点: 90\n一部: [85 60]\nならべかえ: [60 70 85 90]","run":"go run main.go"},"08":{"points":["`map[string]int` は「キーが string、値が int」のマップ（辞書）です。","`price, ok := prices[\"ぶどう\"]` と書くと、2つ目の `ok` で「キーがあったか」がわかります。Go の定番の書き方です。","ないキーを取り出すと、エラーにはならず、その型の「ゼロの値」（int なら 0）が返ります。","マップを `for range` で回すと、順番は毎回ばらばらです。順番が大事なときは、キーをならべかえてから使います。"],"files":[{"name":"main.go","main":true,"shell":false,"code":"package main\n\nimport (\n\t\"fmt\"\n\t\"maps\"\n\t\"slices\"\n)\n\nfunc main() {\n\tprices := map[string]int{\"りんご\": 120, \"バナナ\": 80}\n\tprices[\"みかん\"] = 60 // 追加\n\n\tfmt.Println(\"りんご は\", prices[\"りんご\"], \"円\")\n\n\tif price, ok := prices[\"ぶどう\"]; ok {\n\t\tfmt.Println(\"ぶどう は\", price, \"円\")\n\t} else {\n\t\tfmt.Println(\"ぶどう はありません\")\n\t}\n\n\tfmt.Println(\"もも:\", prices[\"もも\"]) // ないキーは 0 が返る\n\n\tfmt.Println(\"--- 一覧（キーの順） ---\")\n\tnames := slices.Sorted(maps.Keys(prices)) // キーをならべかえる\n\tfor _, name := range names {\n\t\tfmt.Printf(\"%s: %d 円\\n\", name, prices[name])\n\t}\n\tfmt.Println(\"種類:\", len(prices))\n\n\tdelete(prices, \"バナナ\") // 消す\n\tfmt.Println(\"種類:\", len(prices))\n}"}],"output":"りんご は 120 円\nぶどう はありません\nもも: 0\n--- 一覧（キーの順） ---\nみかん: 60 円\nりんご: 120 円\nバナナ: 80 円\n種類: 3\n種類: 2","run":"go run main.go"},"09":{"points":["文字列の道具は `strings` パッケージに入っています。`strings.Split(text, \",\")` のように、関数に文字列を渡して使います。","`Split`（分ける）、`Join`（つなぐ）、`ToUpper`（大文字）、`Contains`（ふくむか）、`ReplaceAll`（置きかえ）、`TrimSpace`（前後の空白を取る）がよく使われます。","文字列と数を変えあうのは `strconv` パッケージです（`strconv.Itoa`、`strconv.Atoi`）。","文字列は作ったあと書きかえられません。どの関数も「新しい文字列」を返します。"],"files":[{"name":"main.go","main":true,"shell":false,"code":"package main\n\nimport (\n\t\"fmt\"\n\t\"strconv\"\n\t\"strings\"\n)\n\nfunc main() {\n\ttext := \"apple,banana,cherry\"\n\n\tfruits := strings.Split(text, \",\") // カンマで分ける\n\tfmt.Println(len(fruits), \"個\")\n\tfmt.Println(\"1番目:\", fruits[0])\n\tfmt.Println(\"大文字:\", strings.ToUpper(fruits[0]))\n\tfmt.Println(\"banana をふくむ？\", strings.Contains(text, \"banana\"))\n\tfmt.Println(\"つなぐ:\", strings.Join(fruits, \" / \"))\n\tfmt.Println(\"置きかえ:\", strings.ReplaceAll(text, \"cherry\", \"melon\"))\n\n\tmessy := \"   hello   \"\n\tfmt.Println(\"[\" + strings.TrimSpace(messy) + \"]\") // 前後の空白を取る\n\tfmt.Println(\"先頭3文字:\", text[:3])\n\n\tfmt.Println(\"数を文字列に: \" + strconv.Itoa(42))\n}"}],"output":"3 個\n1番目: apple\n大文字: APPLE\nbanana をふくむ？ true\nつなぐ: apple / banana / cherry\n置きかえ: apple,banana,melon\n[hello]\n先頭3文字: app\n数を文字列に: 42","run":"go run main.go"}}},{"id":"rust","name":"Rust","type":"静的型","exec":"コンパイル","tagline":"速さと安全さを、両方手に入れる言語","about":"C と同じくらい速く、それでいてメモリのまちがいをコンパイルの時点で防ぎます。ブラウザや OS の部品、速さが大事な道具に使われています。ルールはきびしめですが、エラーの説明がていねいです。","run":"rustc main.rs && ./main","flow":[["main.rs","あなたが書く"],["rustc","コンパイラ（安全チェック）","tool"],["main","機械語のファイル"],["CPU","が直接実行"]],"flowNote":"コンパイルのときにメモリの使い方まで細かくチェックするので、実行中にこわれにくいプログラムになります。","ready":["所有権と借用のきまりがわかり、コンパイルエラーを自分でなおせる","Option と Result を、match や ? で正しくあつかえる","struct・enum・トレイトで、データと処理を組み立てられる","Cargo でプロジェクトを作り、テスト・fmt・clippy を動かせる"],"next":["clap を使って、コマンドラインの道具を作る","serde で、JSON を読み書きする","axum で Web API を作る。または、WebAssembly でブラウザの中で動かす"],"lessons":{"10":{"points":["Rust にクラスはありません。データは `struct`（構造体）にまとめ、`impl` の中にメソッドを書きます。","`fn new(...) -> Account` のように、`self` を受けとらない関数は `Account::new( )` と呼びます。実物を作るのによく使います。","`&self` は「読むだけ」、`&mut self` は「中身を変える」メソッドです。","中身を変えるメソッドを呼ぶには、変数も `let mut` で作っておく必要があります。"],"files":[{"name":"main.rs","main":true,"shell":false,"code":"struct Account {\n    owner: String,\n    balance: i32,\n}\n\nimpl Account {\n    // 実物を作る関数。Account::new(...) と呼ぶ\n    fn new(owner: &str, balance: i32) -> Account {\n        Account { owner: owner.to_string(), balance }\n    }\n\n    // 中身を変えるので &mut self\n    fn deposit(&mut self, amount: i32) {\n        self.balance += amount;\n    }\n\n    // 読むだけなので &self\n    fn show(&self) {\n        println!(\"{} の残高: {} 円\", self.owner, self.balance);\n    }\n}\n\nfn main() {\n    let mut a = Account::new(\"さくら\", 1000);\n    let b = Account::new(\"たろう\", 300);\n\n    a.deposit(500);      // a だけが増える\n    a.show();\n    b.show();\n    println!(\"{}\", a.balance);\n}"}],"output":"さくら の残高: 1500 円\nたろう の残高: 300 円\n1500","run":"rustc main.rs && ./main"},"11":{"points":["きまり1: 値には、持ち主（所有者）が1人だけいます。","きまり2: `let b = a;` や関数に渡すと、持ち主がうつります（ムーブ）。もとの変数は、もう使えません。","きまり3: 持ち主がいなくなると（`}` を出ると）、値は自動で片づけられます。","`&x` は「借りる」。持ち主はそのままで、見るだけです。`&mut x` は「変えるために借りる」です。","「見るだけの借り」はいくつあってもよく、「変える借り」は同時に1つだけです。","数（`i32` など）は、渡すと自動でコピーされるので、ムーブしません。コピーしたい `String` は `clone()` を使います。"],"files":[{"name":"main.rs","main":true,"shell":false,"code":"// 持ち主ごと受けとる（呼んだ側は、もう使えなくなる）\nfn take(s: String) {\n    println!(\"もらった: {s}\");\n}   // ここで s は片づけられる\n\n// 借りるだけ（呼んだ側は、あとでも使える）\nfn length(s: &String) -> usize {\n    s.len()\n}\n\n// 変えるために借りる\nfn add_mark(s: &mut String) {\n    s.push_str(\"!\");\n}\n\nfn main() {\n    let a = String::from(\"hello\");\n    let b = a;                  // 持ち主が a から b にうつる（ムーブ）\n    println!(\"{b}\");\n    // println!(\"{a}\");   ← a はもう使えないので、コンパイルエラーになります\n\n    let c = b.clone();          // 中身をコピーして、別の持ち主を作る\n    println!(\"{b} と {c}\");\n\n    let mut s = String::from(\"Rust\");\n    println!(\"長さ: {}\", length(&s));   // 貸すだけ。s はまだ使える\n    add_mark(&mut s);                   // 変えるために貸す\n    println!(\"{s}\");\n\n    take(s);                    // 持ち主ごと渡す\n    // println!(\"{s}\");   ← s はもう使えないので、コンパイルエラーになります\n\n    let x = 5;\n    let y = x;                  // 数はコピーされるので、両方使える\n    println!(\"{x} {y}\");\n}"}],"title":"所有権と借用","goal":"「値の持ち主は1人だけ」という所有権のきまりと、& で「借りる」やり方がわかり、コンパイルエラーを自分でなおせるようになる。","intro":"所有権は、Rust をほかの言語と分けるいちばん大事なしくみで、だれもが最初につまずく所です。Rust は、メモリを自動で片づける係（ガベージコレクタ）を使わずに、「値の持ち主がいなくなったら片づける」というきまりで、メモリを安全にあつかいます。そのかわり、「だれが持ち主か」をコンパイラがきびしく調べます。きまりは3つだけなので、ここでしっかりおぼえましょう。","quiz":{"q":"let a = String::from(\"hi\"); let b = a; のあと、println!(\"{a}\"); と書くとどうなる？","choices":["hi と表示される","コンパイルエラーになる","空の文字が表示される"],"answer":1,"why":"let b = a; で、文字列の持ち主が a から b にうつりました（ムーブ）。a はもう使えないので、コンパイルエラーになります。"},"task":"Vec\u003ci32> を借りて合計を返す関数 total(nums: &Vec\u003ci32>) -> i32 と、借りて全部の要素を2倍にする関数 double_all(nums: &mut Vec\u003ci32>) を作って、順に呼んでみよう。","hint":"double_all の中では for n in nums.iter_mut() { *n *= 2; } と書きます。呼ぶときは double_all(&mut v) です。","output":"hello\nhello と hello\n長さ: 4\nRust!\nもらった: Rust!\n5 5","run":"rustc main.rs && ./main"},"12":{"points":["`mod greeting;` と書くと、同じフォルダの `greeting.rs` を「モジュール」として読みこみます。","モジュールの中の物は、そのままでは外から使えません。使わせたい物に `pub` をつけます。","使うときは `greeting::hello( )` のように `::` でつなぎます。`use greeting::hello;` と書けば、`hello( )` だけで呼べます。","ほかの人が作ったライブラリを「クレート」とよびます。`Cargo.toml` に書いて、`use` で使います。"],"files":[{"name":"greeting.rs","main":false,"shell":false,"code":"// あいさつを作る部品\npub fn hello(name: &str) -> String {\n    format!(\"こんにちは、{name}{}\", suffix())\n}\n\npub fn bye(name: &str) -> String {\n    format!(\"さようなら、{name}{}\", suffix())\n}\n\n// pub がないので、このモジュールの中だけで使える\nfn suffix() -> String {\n    String::from(\"さん\")\n}"},{"name":"main.rs","main":true,"shell":false,"code":"mod greeting;          // greeting.rs を読みこむ\n\nuse greeting::bye;\n\nfn main() {\n    println!(\"{}\", greeting::hello(\"さくら\"));\n    println!(\"{}\", bye(\"さくら\"));\n}"}],"output":"こんにちは、さくらさん\nさようなら、さくらさん","run":"rustc main.rs && ./main"},"13":{"points":["Rust には例外（try / catch）がありません。失敗するかもしれない関数は `Result\u003c成功の型, エラーの型>` を返します。","`Result` は `Ok(値)`（成功）か `Err(エラー)`（失敗）のどちらかです。`match` で、必ず両方を考えることになります。","`?` を値のあとにつけると、「失敗なら、そのエラーをすぐ返す。成功なら、中の値を取り出す」という意味になります。","`unwrap()` は「失敗ならプログラムを止める」。ためすときは便利ですが、仕事のコードではさけます。","`panic!` は、もうどうにもならないときにプログラムを止める物です。ふつうのエラーには `Result` を使います。"],"files":[{"name":"main.rs","main":true,"shell":false,"code":"// 成功なら Ok(答え)、失敗なら Err(説明) を返す\nfn divide(a: i32, b: i32) -> Result\u003ci32, String> {\n    if b == 0 {\n        return Err(String::from(\"0 で割ることはできません\"));\n    }\n    Ok(a / b)\n}\n\n// 文字列を数にして、2倍にする\nfn double(text: &str) -> Result\u003ci32, std::num::ParseIntError> {\n    let n: i32 = text.parse()?;     // 失敗なら、ここでエラーを返す\n    Ok(n * 2)\n}\n\nfn main() {\n    match divide(10, 2) {\n        Ok(answer) => println!(\"10 ÷ 2 = {answer}\"),\n        Err(e) => println!(\"エラー: {e}\"),\n    }\n    match divide(10, 0) {\n        Ok(answer) => println!(\"10 ÷ 0 = {answer}\"),\n        Err(e) => println!(\"エラー: {e}\"),\n    }\n\n    for text in [\"21\", \"abc\"] {\n        match double(text) {\n            Ok(n) => println!(\"{text} の2倍は {n}\"),\n            Err(_) => println!(\"\\\"{text}\\\" は数ではありません\"),\n        }\n    }\n    println!(\"チェック終わり\");\n}"}],"output":"10 ÷ 2 = 5\nエラー: 0 で割ることはできません\n21 の2倍は 42\n\"abc\" は数ではありません\nチェック終わり","run":"rustc main.rs && ./main"},"14":{"points":["ファイルの道具は `std::fs` に入っています。`fs::write` で書きこみ、`fs::read_to_string` で全部を文字列として読みこみます。","どちらも `Result` を返します。`?` をつけると、失敗したときにエラーをそのまま返せます。","`main` を `fn main() -> std::io::Result\u003c()>` とすると、`main` の中でも `?` が使えます。最後に `Ok(())` を返します。","`lines()` で1行ずつ、`enumerate()` で番号つきで取り出せます。","ファイルは、変数が `}` を出ると自動で閉じられます。閉じ忘れがありません。"],"files":[{"name":"main.rs","main":true,"shell":false,"code":"use std::fs;\n\nfn main() -> std::io::Result\u003c()> {\n    let lines = [\"牛乳を買う\", \"宿題をする\", \"本を読む\"];\n\n    // 書きこむ\n    fs::write(\"memo.txt\", lines.join(\"\\n\") + \"\\n\")?;\n    println!(\"{} 行 書きました\", lines.len());\n\n    // 読みこむ\n    let text = fs::read_to_string(\"memo.txt\")?;\n    for (i, line) in text.lines().enumerate() {\n        println!(\"{}: {line}\", i + 1);\n    }\n\n    // ないファイルを開こうとしたとき\n    match fs::read_to_string(\"ない.txt\") {\n        Ok(text) => println!(\"{text}\"),\n        Err(_) => println!(\"ない.txt は開けませんでした\"),\n    }\n    Ok(())\n}"}],"output":"3 行 書きました\n1: 牛乳を買う\n2: 宿題をする\n3: 本を読む\nない.txt は開けませんでした","run":"rustc main.rs && ./main"},"15":{"points":["Rust は、テストの道具が言語に最初から入っています。`cargo test` で動かします。","`#[test]` をつけた関数が、1つのテストになります。","`assert_eq!(実際, 期待)` は、2つが同じでなければ「失敗」と知らせます。","`#[cfg(test)]` をつけた `mod tests` の中は、テストのときだけコンパイルされます。テストは、ためすコードと同じファイルに書くのが Rust のならわしです。","`use super::*;` は、「1つ外側にある物を全部使う」という意味です。"],"files":[{"name":"main.rs","main":true,"shell":false,"code":"fn fizzbuzz(n: u32) -> String {\n    if n % 15 == 0 {\n        String::from(\"FizzBuzz\")\n    } else if n % 3 == 0 {\n        String::from(\"Fizz\")\n    } else if n % 5 == 0 {\n        String::from(\"Buzz\")\n    } else {\n        n.to_string()\n    }\n}\n\nfn main() {\n    for n in 1..=15 {\n        println!(\"{}\", fizzbuzz(n));\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn fizz() {\n        assert_eq!(fizzbuzz(3), \"Fizz\");\n    }\n\n    #[test]\n    fn buzz() {\n        assert_eq!(fizzbuzz(5), \"Buzz\");\n    }\n\n    #[test]\n    fn fizz_buzz() {\n        assert_eq!(fizzbuzz(15), \"FizzBuzz\");\n    }\n\n    #[test]\n    fn number() {\n        assert_eq!(fizzbuzz(7), \"7\");\n    }\n}"}],"mode":"test","output":"running 4 tests\ntest tests::buzz ... ok\ntest tests::fizz ... ok\ntest tests::fizz_buzz ... ok\ntest tests::number ... ok\ntest result: ok. 4 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in 0.00s","run":"rustc --test main.rs -o tests && ./tests"},"16":{"points":["`enum` は「このうちのどれか」を表す型です。種類ごとに、ちがうデータを持たせられます。","`match` で種類ごとに分け、中のデータを取り出します。全部の種類を書かないと、コンパイルエラーになります。","`trait` は「この型はこのメソッドを持つ」という約束です。`impl トレイト for 型` で、型に約束を守らせます。","`#[derive(Debug)]` をつけると、`{:?}` で中身を表示できるようになります。","`&dyn Describe` や `impl Describe` で、「Describe を守っている物なら何でも」受けとれます。"],"files":[{"name":"main.rs","main":true,"shell":false,"code":"// 図形は、この2つのどれか。種類ごとにちがうデータを持つ\n#[derive(Debug)]\nenum Shape {\n    Rect { w: f64, h: f64 },\n    Circle { r: f64 },\n}\n\n// 「説明できる」という約束\ntrait Describe {\n    fn name(&self) -> String;\n    fn area(&self) -> f64;\n\n    // 約束の中に、できあいの中身を書いておくこともできる\n    fn describe(&self) -> String {\n        format!(\"{} の面積: {:.2}\", self.name(), self.area())\n    }\n}\n\nimpl Describe for Shape {\n    fn name(&self) -> String {\n        match self {\n            Shape::Rect { .. } => String::from(\"長方形\"),\n            Shape::Circle { .. } => String::from(\"円\"),\n        }\n    }\n\n    fn area(&self) -> f64 {\n        // 全部の種類を書かないと、コンパイルエラーになる\n        match self {\n            Shape::Rect { w, h } => w * h,\n            Shape::Circle { r } => std::f64::consts::PI * r * r,\n        }\n    }\n}\n\n// Describe を守っている物なら、何でも受けとれる\nfn show(item: &dyn Describe) {\n    println!(\"{}\", item.describe());\n}\n\nfn main() {\n    let shapes = vec![\n        Shape::Rect { w: 3.0, h: 4.0 },\n        Shape::Circle { r: 1.0 },\n    ];\n    for s in &shapes {\n        show(s);\n    }\n    println!(\"{:?}\", shapes[0]);     // derive(Debug) のおかげ\n\n    // Option も enum: Some(値) か None\n    let first: Option\u003c&Shape> = shapes.first();\n    match first {\n        Some(s) => println!(\"最初は {}\", s.name()),\n        None => println!(\"空っぽです\"),\n    }\n}"}],"title":"enum・match・トレイト","goal":"「いくつかの種類のどれか」を enum で表し、match でもれなく場合分けできるようになる。トレイトで、ちがう型に同じ使い方を持たせられるようになる。","intro":"Rust の enum は、種類ごとにちがうデータを持てる、とても強力なしくみです。これまで使ってきた Option（ある・ない）も Result（成功・失敗）も、じつは enum です。match と組み合わせると、「場合分けの書きもらし」をコンパイラが見つけてくれます。トレイトは「この型はこれができる」という約束で、ほかの言語のインターフェースにあたります。","quiz":{"q":"enum に新しい種類を足したのに、match にその場合を書き忘れるとどうなる？","choices":["実行したときに、その種類だけ何も起きない","コンパイルエラーで教えてくれる","自動で最初の場合が使われる"],"answer":1,"why":"match は全部の場合を書かないとコンパイルできません。種類を足したときの直しもれを、コンパイラが全部見つけてくれます。"},"task":"Shape に Triangle { base: f64, height: f64 } を足してみよう。コンパイラのエラーを読んで、直す所を見つけよう。","hint":"enum に足すと、match の所で「Triangle を書いていません」というエラーが出ます。そこに計算を足します。","output":"長方形 の面積: 12.00\n円 の面積: 3.14\nRect { w: 3.0, h: 4.0 }\n最初は 長方形","run":"rustc main.rs && ./main"},"17":{"points":["Cargo は、Rust の「なんでも係」です。プロジェクトを作る、コンパイルする、動かす、テストする、ライブラリを入れる、を全部やってくれます。","使うライブラリ（クレート）は `Cargo.toml` に書かれます。`cargo add` で足せます。","`cargo fmt` は書き方をそろえ、`cargo clippy` は「もっとよい書き方」を教えてくれます。","Rust のコンパイルエラーは、とてもていねいです。「こう直すとよい」まで書いてあるので、まず最後まで読みましょう。","公式の入門書「The Rust Programming Language」（日本語版あり）が、いちばんの教科書です。"],"files":[{"name":"shell","main":false,"shell":true,"code":"# バージョンを確かめる\nrustc --version\ncargo --version\n\n# プロジェクトを始める\ncargo new hello\ncd hello\n\n# コンパイルして動かす / 速い完成版を作る\ncargo run\ncargo build --release\n\n# コンパイルできるかだけを、すばやく確かめる\ncargo check\n\n# 書き方をそろえる・まちがいを探す\ncargo fmt\ncargo clippy\n\n# テストを動かす / ライブラリを入れる\ncargo test\ncargo add serde"}]},"18":{"points":["「分ける → 数える → ならべる → 表示する」と、仕事ごとに関数を分けています。","`*counts.entry(...).or_insert(0) += 1;` は、「なければ 0 を入れて、1 を足す」という HashMap の定番の書き方です。","`sort_by` に、「どちらを先にするか」を決める式を渡しています。`then_with` で、「同じなら次の基準」をつなげます。","単語がないときは `Err` を返して知らせています。呼ぶ側は、`Result` を必ず確かめることになります。"],"files":[{"name":"main.rs","main":true,"shell":false,"code":"use std::collections::HashMap;\n\n// 文章を、小文字の単語の Vec にする\nfn split_words(text: &str) -> Vec\u003cString> {\n    text.to_lowercase()\n        .split(|c: char| !c.is_alphabetic())    // 文字でない所で区切る\n        .filter(|word| !word.is_empty())\n        .map(|word| word.to_string())\n        .collect()\n}\n\nfn count_words(words: &[String]) -> HashMap\u003cString, usize> {\n    let mut counts = HashMap::new();\n    for w in words {\n        *counts.entry(w.clone()).or_insert(0) += 1;\n    }\n    counts\n}\n\n// 回数の多い順（同じならアルファベット順）に n 個\nfn top(counts: &HashMap\u003cString, usize>, n: usize) -> Vec\u003c(String, usize)> {\n    let mut entries: Vec\u003c(String, usize)> =\n        counts.iter().map(|(word, count)| (word.clone(), *count)).collect();\n    entries.sort_by(|a, b| b.1.cmp(&a.1).then_with(|| a.0.cmp(&b.0)));\n    entries.truncate(n);\n    entries\n}\n\nfn report(text: &str) -> Result\u003c(), String> {\n    let words = split_words(text);\n    if words.is_empty() {\n        return Err(String::from(\"単語がありません\"));\n    }\n    let counts = count_words(&words);\n    println!(\"全部で {} 語、{} 種類\", words.len(), counts.len());\n    for (word, count) in top(&counts, 3) {\n        println!(\"{word}: {count}\");\n    }\n    Ok(())\n}\n\nfn main() {\n    if let Err(e) = report(\"The cat saw the dog. The dog saw the bird!\") {\n        println!(\"エラー: {e}\");\n    }\n    if let Err(e) = report(\"...\") {\n        println!(\"エラー: {e}\");\n    }\n}"}],"output":"全部で 10 語、5 種類\nthe: 4\ndog: 2\nsaw: 2\nエラー: 単語がありません","run":"rustc main.rs && ./main"},"01":{"points":["プログラムは `fn main()` から動きはじめます。","`println!` で表示して改行します。`!` がつくのは「マクロ」という特別な命令のしるしです。","`{}` の所に、後ろに書いた値が入ります。","文の終わりには `;` が必要です。`//` から行の終わりまではコメントです。","Rust は、コンパイルしてから動かします。ふだんは Cargo という道具を使い、`cargo run` でコンパイルと実行をまとめて行います。"],"files":[{"name":"main.rs","main":true,"shell":false,"code":"// はじめてのプログラム\nfn main() {\n    println!(\"こんにちは！\");\n    println!(\"プログラミングをはじめます。\");\n    println!(\"1 + 2 = {}\", 1 + 2);   // {} の所に、後ろの値が入ります\n}"}],"output":"こんにちは！\nプログラミングをはじめます。\n1 + 2 = 3","run":"rustc main.rs && ./main"},"02":{"points":["変数は `let` で作ります。そのままでは「変えられない」変数です。変えたいときは `let mut` と書きます。","「変えない」が基本で、変える物だけにしるしをつける。これが Rust の考え方です。","型は自動で決まりますが、`let age: i32 = 15;` のように書くこともできます。","よく使う型: `i32`（整数）、`f64`（小数）、`bool`（真・偽）、`String` と `&str`（文字列）。","`{name}` のように、`{}` の中に変数の名前を直接書けます。"],"files":[{"name":"main.rs","main":true,"shell":false,"code":"fn main() {\n    let name = \"さくら\";          // 文字列 (&str)\n    let mut age: i32 = 15;       // 整数。あとで変えるので mut\n    let height = 152.5;          // 小数 (f64)\n    let is_student = true;       // 真か偽か (bool)\n\n    println!(\"名前: {name}\");\n    println!(\"年れい: {age}\");\n    println!(\"身長: {height}\");\n    println!(\"学生: {is_student}\");\n\n    age = age + 1;               // mut があるので入れなおせます\n    println!(\"来年は {age} さい\");\n\n    // name = \"たろう\";   ← mut がないので、コンパイルエラーになります\n}"}],"output":"名前: さくら\n年れい: 15\n身長: 152.5\n学生: true\n来年は 16 さい","run":"rustc main.rs && ./main"},"03":{"points":["整数どうしの `/` は、小数点より下を切りすてます（7 / 2 は 3）。","Rust は型を勝手に変えません。整数と小数はそのまま計算できないので、`a as f64` のように自分で変えます。","文字列をつなぐには `format!` が便利です。`println!` と同じ書き方で、新しい `String` を作ります。","`len()` はバイト数を返します。文字数は `chars().count()` で数えます。"],"files":[{"name":"main.rs","main":true,"shell":false,"code":"fn main() {\n    let a = 7;\n    let b = 2;\n    println!(\"7 + 2 = {}\", a + b);\n    println!(\"7 - 2 = {}\", a - b);\n    println!(\"7 * 2 = {}\", a * b);\n    println!(\"7 / 2 = {}\", a / b);                     // 整数どうしは切りすて\n    println!(\"7 / 2.0 = {}\", a as f64 / b as f64);     // 自分で小数に変える\n    println!(\"7 % 2 = {}\", a % b);                     // あまり\n\n    let family = \"山田\";\n    let given = \"太郎\";\n    let full = format!(\"{family} {given}\");            // 新しい String を作る\n    println!(\"フルネーム: {full}\");\n    println!(\"文字数: {}\", \"program\".len());\n    println!(\"バイト数: {} 文字数: {}\", full.len(), full.chars().count());\n}"}],"output":"7 + 2 = 9\n7 - 2 = 5\n7 * 2 = 14\n7 / 2 = 3\n7 / 2.0 = 3.5\n7 % 2 = 1\nフルネーム: 山田 太郎\n文字数: 7\nバイト数: 13 文字数: 5","run":"rustc main.rs && ./main"},"04":{"points":["`if 条件 { }` の形です。条件に `( )` はいりませんが、`{ }` は必ず書きます。","「かつ」は `&&`、「または」は `||`、「〜でない」は `!` です。","`if` は「値を返す式」です。`let label = if 条件 { A } else { B };` と書けます。","`match` は、値によって場合分けします。全部の場合を書かないとコンパイルエラーになるので、書きもらしがありません。`_` は「そのほか全部」です。"],"files":[{"name":"main.rs","main":true,"shell":false,"code":"fn main() {\n    let score = 72;\n\n    if score >= 80 {\n        println!(\"よくできました\");\n    } else if score >= 60 {\n        println!(\"合格\");\n    } else {\n        println!(\"もう少し\");\n    }\n\n    let age = 15;\n    let has_ticket = true;\n    if age >= 12 && has_ticket {\n        println!(\"入場できます\");\n    }\n\n    // if は値を返せる\n    let label = if age >= 18 { \"大人\" } else { \"子ども\" };\n    println!(\"{label}\");\n\n    let size = \"M\";\n    match size {\n        \"S\" => println!(\"小さい\"),\n        \"M\" => println!(\"ふつう\"),\n        _ => println!(\"大きい\"),\n    }\n}"}],"output":"合格\n入場できます\n子ども\nふつう","run":"rustc main.rs && ./main"},"05":{"points":["`for i in 1..=5` は 1 から 5 まで。`1..5` と書くと 5 は入りません（1 から 4 まで）。","`while 条件 { }` は、条件が成り立つあいだくりかえします。","`loop { }` は、`break` するまでずっとくりかえします。","`continue` は「今回は飛ばして次へ」、`break` は「くりかえしをやめる」です。","値を変える変数（`count`、`total`）には `mut` が必要です。"],"files":[{"name":"main.rs","main":true,"shell":false,"code":"fn main() {\n    // 決まった回数くりかえす\n    for i in 1..=5 {\n        println!(\"{i} 回目\");\n    }\n\n    // 条件が成り立つあいだくりかえす\n    let mut count = 3;\n    while count > 0 {\n        println!(\"{count}\");\n        count -= 1;\n    }\n    println!(\"発射！\");\n\n    // 1〜10 の偶数だけを足す\n    let mut total = 0;\n    for i in 1..=10 {\n        if i % 2 == 1 {\n            continue;      // 奇数は飛ばす\n        }\n        total += i;\n    }\n    println!(\"偶数の合計: {total}\");\n}"}],"output":"1 回目\n2 回目\n3 回目\n4 回目\n5 回目\n3\n2\n1\n発射！\n偶数の合計: 30","run":"rustc main.rs && ./main"},"06":{"points":["関数は `fn 名前(引数: 型) -> 返す型 { }` で作ります。引数と返す値の型は、必ず書きます。","最後の行に `;` をつけずに書いた式が、そのまま返す値になります。`return` は、とちゅうで返すときに使います。","文字列を受けとるだけの引数は `&str` にします。新しく文字列を作って返すときは `String` です。","関数の名前は、小文字と `_` で書くのがきまりです（`is_even`）。"],"files":[{"name":"main.rs","main":true,"shell":false,"code":"fn add(a: i32, b: i32) -> i32 {\n    a + b              // ; をつけない最後の式が、返す値になる\n}\n\nfn greet(name: &str) -> String {\n    format!(\"こんにちは、{name}さん\")\n}\n\nfn is_even(n: i32) -> bool {\n    n % 2 == 0\n}\n\nfn main() {\n    println!(\"3 + 4 = {}\", add(3, 4));\n    println!(\"{}\", greet(\"さくら\"));\n    println!(\"10 は偶数？ {}\", is_even(10));\n    println!(\"7 は偶数？ {}\", is_even(7));\n}"}],"output":"3 + 4 = 7\nこんにちは、さくらさん\n10 は偶数？ true\n7 は偶数？ false","run":"rustc main.rs && ./main"},"07":{"points":["`Vec`（ベクタ）は、あとから長さを変えられる配列です。`vec![70, 85, 60]` で作ります。","追加するには `push`。中身を変えるので、`let mut` で作っておきます。","`scores[0]` は、はんいの外だとプログラムが止まります（panic）。`scores.get(10)` を使うと、「ないかもしれない」値（`Option`）で安全に受けとれます。","`for s in &scores` の `&` は「借りるだけ」という意味です。`&` をつけないと、ループのあとで `scores` が使えなくなります（くわしくは「所有権」で）。","`iter()` のあとに `sum`、`max` などをつなげて計算できます。"],"files":[{"name":"main.rs","main":true,"shell":false,"code":"fn main() {\n    let mut scores = vec![70, 85, 60];\n    scores.push(90);                    // 後ろに追加\n\n    println!(\"最初の点数: {}\", scores[0]);\n    println!(\"人数: {}\", scores.len());\n\n    let mut total = 0;\n    for s in &scores {                  // & をつけて「借りる」\n        total += s;\n    }\n    println!(\"合計: {total}\");\n    println!(\"平均: {}\", total as f64 / scores.len() as f64);\n\n    // ないかもしれない値は Option で返ってくる\n    if let Some(max) = scores.iter().max() {\n        println!(\"最高点: {max}\");\n    }\n    println!(\"10番目: {:?}\", scores.get(10));   // None（ない）\n\n    scores.sort();                      // 小さい順にならべかえる\n    println!(\"ならべかえ: {:?}\", scores);\n}"}],"output":"最初の点数: 70\n人数: 4\n合計: 305\n平均: 76.25\n最高点: 90\n10番目: None\nならべかえ: [60, 70, 85, 90]","run":"rustc main.rs && ./main"},"08":{"points":["「キーと値」の辞書には `HashMap` と `BTreeMap` があります。使う前に `use std::collections::BTreeMap;` のように書きます。","`get` は `Option` を返します。`Some(値)`（あった）か `None`（なかった）のどちらかで、`match` や `if let` で必ず両方を考えることになります。","`HashMap` は速いかわりに、`for` で回すと順番がばらばらです。`BTreeMap` は、いつもキーの順にならびます。ここでは `BTreeMap` を使っています。","`{:?}` は、中身をそのまま表示する書き方です。調べものに便利です。"],"files":[{"name":"main.rs","main":true,"shell":false,"code":"use std::collections::BTreeMap;\n\nfn main() {\n    // BTreeMap は、いつもキーの順にならんでいる辞書\n    let mut prices = BTreeMap::new();\n    prices.insert(\"りんご\", 120);\n    prices.insert(\"バナナ\", 80);\n    prices.insert(\"みかん\", 60);\n\n    // get は Option を返す: Some（あった）か None（なかった）\n    match prices.get(\"りんご\") {\n        Some(price) => println!(\"りんご は {price} 円\"),\n        None => println!(\"りんご はありません\"),\n    }\n\n    if let Some(price) = prices.get(\"ぶどう\") {\n        println!(\"ぶどう は {price} 円\");\n    } else {\n        println!(\"ぶどう はありません\");\n    }\n\n    // なければ 0 を使う\n    println!(\"もも: {}\", prices.get(\"もも\").unwrap_or(&0));\n\n    println!(\"--- 一覧（キーの順） ---\");\n    for (name, price) in &prices {\n        println!(\"{name}: {price} 円\");\n    }\n    println!(\"種類: {}\", prices.len());\n}"}],"output":"りんご は 120 円\nぶどう はありません\nもも: 0\n--- 一覧（キーの順） ---\nみかん: 60 円\nりんご: 120 円\nバナナ: 80 円\n種類: 3","run":"rustc main.rs && ./main"},"09":{"points":["Rust の文字列には2つの型があります。`&str` は「どこかにある文字列を見ているだけ」、`String` は「自分で持っていて、変えられる文字列」です。","`\"...\"` と書いた物は `&str`。`String` にするには `.to_string()` や `String::from( )` を使います。","`split` の結果は、そのままでは「1つずつ取り出せるもの」です。`collect()` で `Vec` に集めます。","`to_uppercase`、`contains`、`replace`、`trim` がよく使われます。","日本語は1文字が3バイトあるので、`&text[0..3]` のような切り出しはバイト単位です。文字の区切りでない所で切ると、プログラムが止まります。"],"files":[{"name":"main.rs","main":true,"shell":false,"code":"fn main() {\n    let text = \"apple,banana,cherry\";\n\n    let fruits: Vec\u003c&str> = text.split(',').collect();   // 分けて Vec に集める\n    println!(\"{} 個\", fruits.len());\n    println!(\"1番目: {}\", fruits[0]);\n    println!(\"大文字: {}\", fruits[0].to_uppercase());\n    println!(\"banana をふくむ？ {}\", text.contains(\"banana\"));\n    println!(\"つなぐ: {}\", fruits.join(\" / \"));\n    println!(\"置きかえ: {}\", text.replace(\"cherry\", \"melon\"));\n\n    let messy = \"   hello   \";\n    println!(\"[{}]\", messy.trim());                      // 前後の空白を取る\n    println!(\"先頭3文字: {}\", &text[0..3]);\n\n    // String は、あとから足せる文字列\n    let mut s = String::from(\"こんにちは\");\n    s.push_str(\"、世界\");\n    println!(\"{s}（{} 文字）\", s.chars().count());\n}"}],"output":"3 個\n1番目: apple\n大文字: APPLE\nbanana をふくむ？ true\nつなぐ: apple / banana / cherry\n置きかえ: apple,banana,melon\n[hello]\n先頭3文字: app\nこんにちは、世界（8 文字）","run":"rustc main.rs && ./main"}}}]};

/* ---- コードに色をつける ---- */
const KW = new Set(('if else elif elsif elseif for while do end def function fn func return class struct interface impl trait enum type let const var mut ' +
  'public private protected static void int double float bool boolean char long unsigned size_t string String i32 u32 f64 usize ' +
  'new import from export package use mod pub require require_once require_relative include namespace try catch except finally rescue ensure raise throw throws ' +
  'match switch case default break continue next in of as is not and or true false True False nil null None NULL undefined this self super extends implements ' +
  'async await yield lambda with go defer chan range map echo foreach unless begin module typedef sizeof readonly declare global record attr_reader puts print')
  .split(' '));
function tokenRe(lang) {
  const hash = ['python', 'ruby', 'shell'].includes(lang);
  const parts = [];
  if (lang === 'python') parts.push('"""[\\s\\S]*?"""');
  parts.push(hash ? '#[^\\n]*' : '\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/');
  parts.push('"(?:\\\\.|[^"\\\\\\n])*"');
  parts.push(lang === 'rust' ? "'(?:\\\\.|[^'\\\\])'" : "'(?:\\\\.|[^'\\\\\\n])*'");
  if (['js', 'ts', 'go'].includes(lang)) parts.push('`(?:\\\\.|[^`\\\\])*`');
  if (lang === 'c') parts.push('^[ \\t]*#[a-z]+');
  if (lang === 'rust') parts.push('#\\[[^\\]\\n]*\\]');
  if (lang === 'php') parts.push('<\\?php');
  parts.push('\\b\\d+(?:\\.\\d+)?\\b');
  parts.push('[A-Za-z_$][\\w$]*');
  return new RegExp(parts.join('|'), 'gm');
}
function highlight(code, lang) {
  if (lang === 'shell') {
    return esc(code).split('\n').map(l => l.trimStart().startsWith('#') ? `<span class="c">${l}</span>` : l).join('\n');
  }
  const hash = ['python', 'ruby'].includes(lang);
  let out = '', last = 0, m;
  const re = tokenRe(lang);
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const t = m[0], c0 = t[0];
    let cls = '';
    if (t.startsWith('//') || t.startsWith('/*') || (hash && c0 === '#')) cls = 'c';
    else if (t.startsWith('"""') || c0 === '"' || c0 === "'" || c0 === '`') cls = t.startsWith('"""') && lang === 'python' ? 'c' : 's';
    else if (c0 === '#' || t === '<?php' || /^[ \t]*#/.test(t)) cls = 'p';
    else if (/^\d/.test(t)) cls = 'n';
    else if (KW.has(t)) cls = 'k';
    out += cls ? `<span class="${cls}">${esc(t)}</span>` : esc(t);
    last = m.index + t.length;
  }
  return out + esc(code.slice(last));
}
function codeLines(code, lang) {
  // 何行にもまたがるコメントや文字列の色が、行をまたいでも続くようにする
  const html = highlight(code, lang);
  const lines = [];
  let open = '';
  for (const raw of html.split('\n')) {
    let line = open + raw;
    const opens = [...line.matchAll(/<span class="(\w)">|<\/span>/g)];
    let depth = null;
    for (const o of opens) depth = o[1] ? o[1] : null;
    if (depth) { line += '</span>'; open = `<span class="${depth}">`; } else open = '';
    lines.push(`<div class="cl"><span class="tx">${line || ' '}</span></div>`);
  }
  return lines.join('');
}

/* ---- 図 ---- */
function seqRow(items) {
  const dur = items.length * 1.2;
  let h = '';
  items.forEach(([t, sub, kind], k) => {
    if (k) h += `<span class="ar" style="--dur:${dur}s;--d:${(k - 1) * 1.2 + .6}s"><i></i></span>`;
    h += `<span class="bx lit${kind ? ' ' + kind : ''}" style="--dur:${dur}s;--d:${k * 1.2}s">${esc(t)}${sub ? `<small>${esc(sub)}</small>` : ''}</span>`;
  });
  return `<div class="dg-row">${h}</div>`;
}
function cells(vals, round) {
  const dur = vals.length * 0.9;
  return `<div class="cells">${vals.map(([v, idx], k) =>
    `<div class="cell${round ? ' round' : ''}"><span class="bx lit" style="--dur:${dur}s;--d:${k * 0.9}s">${esc(v)}</span>${idx != null ? `<small>${esc(idx)}</small>` : ''}</div>`).join('')}</div>`;
}

    </div>`,
    '実物は、それぞれが自分のデータを持っています。a に入金しても、b の残高は変わりません。'],
  module: () => ['部品のファイルを、使う側が読みこむ',
    seqRow([['greeting', '部品: hello / bye'], ['読みこむ', 'import など', 'tool'], ['main', '使う側']]),
    '部品のファイルは、外に見せる物だけを公開します。使う側は、それを読みこんで呼び出します。'],
  error: () => ['失敗したときの道を、用意しておく',
    `<div class="dg-col">
      <div class="dg-row"><span class="bx">やってみる<small>失敗するかもしれない処理</small></span></div>
      <div class="dg-row"><span class="bx alt-a">うまくいった → そのまま次へ</span><span class="bx alt-b">失敗した → 受けとめて、知らせる</span></div>
    </div>`,
    '失敗したときに何をするかを、前もって書いておきます。そうすれば、プログラムがとつぜん止まることはありません。'],
  file: () => ['変数は消える。ファイルは残る',
    seqRow([['プログラム', '変数は、終わると消える'], ['書く', '', 'tool'], ['memo.txt', 'ファイルは残る'], ['読む', '', 'tool'], ['プログラム', '次に動かしたとき']]),
    'ファイルに書いておけば、プログラムを止めても、次に動かしたときに読みもどせます。'],
  test: () => ['「こうなるはず」と「実際」をくらべる',
    `<div class="tt"><span class="h">入力</span><span class="h">期待する結果</span><span class="h">実際の結果</span><span class="h"></span>${
      [['3', 'Fizz'], ['5', 'Buzz'], ['15', 'FizzBuzz'], ['7', '7']].map(([a, b], i) =>
        `<span class="bx lit" style="--dur:4s;--d:${i}s">${a}</span><span class="bx">${b}</span><span class="bx lit" style="--dur:4s;--d:${i + .3}s">${b}</span><span class="okm">✔</span>`).join('')}</div>`,
    '期待する結果と実際の結果が同じなら合格です。1つでもちがえば、テストが「ここがちがう」と知らせてくれます。'],
  tools: () => ['一人前の道具箱',
    seqRow([['パッケージ管理', 'ライブラリを入れる'], ['フォーマッタ', '書き方をそろえる'], ['リンター', 'あやしい所を探す'], ['テスト', '動きを確かめる']]),
    'コードを書いたら、そろえて、調べて、ためす。この流れを、コマンドで何度でもくりかえします。'],
  build: () => ['仕事を小さく分けて、つなげる',
    seqRow([['文章', '入力'], ['分ける', '単語のならびに', 'tool'], ['数える', '単語 → 回数', 'tool'], ['ならべる', '多い順に', 'tool'], ['表示する', '上位 3 個']]),
    '1つの関数が、1つの仕事をします。前の関数の結果が、次の関数の材料になります。'],
};
function diagram(key, L) {
  if (!key || !DIAGRAMS[key]) return '';
  const [title, body, cap] = DIAGRAMS[key](L);
  return `<figure class="panel dg" style="margin:0"><div class="box-title">図 ｜ ${esc(title)}</div>${body}<figcaption class="dg-cap">${rich(cap)}</figcaption></figure>`;
}

/* ---- 画面: ホーム ---- */
function meterHTML(id) {
  const n = doneList(id).length;
  return `<div class="meter-row"><div class="meter"><i style="width:${n / ORDER.length * 100}%"></i></div><span>${n} / ${ORDER.length}</span></div>`;
}
function badgesHTML(L) {
  return `<div class="badges"><span class="badge ${L.type === '静的型' ? 'static' : 'dynamic'}">${L.type}</span><span class="badge">${esc(L.exec)}</span></div>`;
}
function viewHome() {
  return `<div class="wrap">
    <header class="head">
      <div class="eyebrow">9つの言語 ・ 各 18 レッスン</div>
      <h1>一人前ロードマップ</h1>
      <p class="lead">プログラミング言語を1つえらんで、<b>「一人前」とよばれる所まで</b>の道のりを、順に歩いていく学習ツールです。
      最初に全体の流れを見てから、レッスンを1つずつ進めます。</p>
    </header>
    <ol class="how">
      <li class="panel"><b>全体の流れを見る</b><span>ゴールと、そこまでの 6 つのステージを、最初に地図でたしかめます。</span></li>
      <li class="panel"><b>レッスンを進める</b><span>読む → 結果を予想する → たしかめる → クイズ → 自分で書きかえる、の順に進みます。</span></li>
      <li class="panel"><b>卒業制作を作る</b><span>学んだことを全部使って、小さな作品を自分の手で作ります。</span></li>
    </ol>
    <section class="sec">
      <h2>言語をえらぶ</h2>
      <div class="langs">${LANGS.map(L => `<a class="panel lang" href="#${L.id}">
        <div class="lang-top"><h3>${esc(L.name)}</h3>${badgesHTML(L)}</div>
        <p class="tag">${esc(L.tagline)}</p>
        <p class="about">${esc(L.about)}</p>
        ${meterHTML(L.id)}
        <span class="go">${doneList(L.id).length ? 'つづきから' : '道のりを見る'} →</span>
      </a>`).join('')}</div>
    </section>
    <p class="muted" style="font-size:14px">のっているコードは、すべて実際に動かして、表示される結果をたしかめてあります。進みぐあいは、このブラウザの中にだけ保存されます。</p>
  </div>`;
}

/* ---- 画面: 言語の全体図 ---- */
function viewLang(L) {
  const next = nextOf(L.id), count = doneList(L.id).length;
  const allDone = count === ORDER.length;
  const stagesHTML = STAGES.map((st, k) => {
    const d = st.lessons.filter(no => isDone(L.id, no)).length;
    const cls = d === st.lessons.length ? 'complete' : d || st.lessons.includes(next) ? 'started' : '';
    return `<div class="stage ${cls}" style="--k:${k}">
      <div class="station">${d === st.lessons.length ? '✓' : st.no}</div>
      <div class="panel stage-card">
        <div class="stage-head"><h3>ステージ ${st.no}　${esc(st.title)}</h3><p class="can"><b>ここまで来ると:</b> ${esc(st.can)}</p></div>
        <div class="lessons">${st.lessons.map(no => {
          const les = lessonOf(L, no), dn = isDone(L.id, no);
          return `<a class="lrow${dn ? ' done' : no === next ? ' next' : ''}" href="#${L.id}-${no}">
            <span class="n">${no}</span><span class="t">${esc(les.title)}</span><span class="s">${dn ? '✓ 完了' : no === next ? 'つぎはここ' : ''}</span></a>`;
        }).join('')}</div>
      </div>
    </div>`;
  }).join('');
  return `<div class="wrap">
    <a class="back" href="#home">← 言語をえらぶ</a>
    <header class="hero">
      <div class="eyebrow">全体の流れ</div>
      <h1>${esc(L.name)} で一人前になるまで</h1>
      <p class="lead"><b>${esc(L.tagline)}。</b>${esc(L.about)}</p>
      ${badgesHTML(L)}
    </header>
    ${allDone ? `<div class="done-banner"><b>修了おめでとうございます！</b><span>18 のレッスンを全部終えました。下の「コースのあとに」から、次の一歩をえらびましょう。</span></div>` : ''}
    <div class="two">
      <div class="panel box">
        <div class="box-title">ゴール ｜ ${esc(L.name)} の「一人前」の目安</div>
        <ul class="ready">${L.ready.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
      </div>
      ${diagram('flow', L)}
    </div>
    <div class="panel cta">
      ${meterHTML(L.id)}
      ${next ? `<a class="btn" href="#${L.id}-${next}">${count ? `つづきから：${next} ${esc(lessonOf(L, next).title)}` : '最初のレッスンから始める'} →</a>`
             : `<a class="btn ghost" href="#${L.id}-01">最初から見なおす</a>`}
    </div>
    <section class="sec">
      <h2>6 つのステージ、18 のレッスン</h2>
      <p class="muted" style="font-size:15px">上から順に進むのがおすすめです。知っている所は、飛ばしてもかまいません。</p>
      <div class="route" style="--p:${!count ? 0 : next ? STAGES.indexOf(stageOf(next)) / (STAGES.length - 1) : 1}">${stagesHTML}</div>
    </section>
    <section class="panel box">
      <div class="box-title">コースのあとに</div>
      <p>このコースで身につくのは、一人前になるための<b>土台</b>です。本当に一人前になるには、自分で考えた物を、最後まで作りきる経験が必要です。次は、こんな物に挑戦してみましょう。</p>
      <ul class="after">${L.next.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
    </section>
  </div>`;
}

/* ---- 画面: レッスン ---- */
let ui = { tab: 0, shown: false, picked: null, hint: false };
function shuffled(les, L) {
  // 正解の場所が毎回同じにならないように、レッスンと言語で順番をずらす
  const n = les.quiz.choices.length, shift = (Number(les.no) + LANGS.indexOf(L)) % n;
  return les.quiz.choices.map((_, i) => (i + shift) % n);
}
function viewLesson(L, no) {
  const les = lessonOf(L, no), st = stageOf(no), idx = ORDER.indexOf(no);
  const prev = ORDER[idx - 1], next = ORDER[idx + 1];
  const shell = les.files.every(f => f.shell);
  const file = les.files[Math.min(ui.tab, les.files.length - 1)];
  const fileLang = file.shell ? 'shell' : /\.(json|mod|h)$/.test(file.name) && !/\.h$/.test(file.name) ? 'plain' : L.id;
  const order = shuffled(les, L);
  let step = 0;
  const stepTag = t => `<span class="step">${++step}　${t}</span>`;
  const outLines = (les.output || '').split('\n');
  return `<div class="wrap narrow">
    <nav class="topbar" aria-label="レッスンの位置">
      <a class="back" href="#${L.id}">← ${esc(L.name)} の道のり</a>
      <span class="where">ステージ ${st.no}「${esc(st.title)}」</span>
      <div class="dots">${ORDER.map(n => `<a href="#${L.id}-${n}" title="${n} ${esc(lessonOf(L, n).title)}" aria-label="レッスン ${n}" class="${n === no ? 'cur' : isDone(L.id, n) ? 'done' : ''}"></a>`).join('')}</div>
    </nav>
    <header class="ltitle">
      <div class="eyebrow">${esc(L.name)} ・ レッスン ${idx + 1} / ${ORDER.length}</div>
      <h1>${esc(les.title)}</h1>
    </header>
    <div class="goal"><span class="box-title">このレッスンのねらい</span><span>${esc(les.goal)}</span></div>
    <div class="prose">${les.body.map(p => `<p>${rich(p)}</p>`).join('')}</div>
    ${diagram(les.diagram, L)}

    <section class="sec">
      <h2>${stepTag('読む')} ${shell ? 'コマンドを見る' : 'コードを読む'}</h2>
      <div class="panel codebox">
        <div class="tabs" role="tablist">${les.files.map((f, i) =>
          `<button class="tab" role="tab" data-tab="${i}" aria-selected="${f === file}">${esc(f.shell ? 'ターミナルで打つコマンド' : f.name)}</button>`).join('')}
          <button class="copy" id="copy">コピー</button></div>
        <div class="code" id="code">${codeLines(file.code, fileLang)}</div>
        ${shell ? '' : `<div class="runline">動かし方: <code>${esc(les.run)}</code></div>`}
      </div>
    </section>

    ${shell ? '' : `<section class="sec">
      <h2>${stepTag('予想する')} 動かすと、何が表示される？</h2>
      <div class="panel predict">
        <p>上のコードを動かしたときに表示される物を、<b>頭の中で予想してから</b>、結果を開きましょう。予想とちがっていたら、そこが学ぶ所です。</p>
        ${ui.shown
          ? `<div class="term"><div class="term-title">実際に動かした結果</div>${outLines.map((l, i) => `<div class="tl" style="animation-delay:${Math.min(i * 70, 1400)}ms">${esc(l) || ' '}</div>`).join('')}</div>`
          : `<div><button class="btn" id="reveal">結果を見る</button></div>`}
      </div>
    </section>`}

    <section class="sec">
      <h2>${stepTag('おさえる')} ポイント</h2>
      <ul class="points">${les.points.map(p => `<li class="panel"><span>${rich(p)}</span></li>`).join('')}</ul>
    </section>

    <section class="sec">
      <h2>${stepTag('たしかめる')} クイズ</h2>
      <div class="panel quiz">
        <p class="q">${esc(les.quiz.q)}</p>
        <div class="choices">${order.map(i => {
          const cls = ui.picked === i ? (i === les.quiz.answer ? ' right' : ' wrong') : (ui.picked === les.quiz.answer && i === les.quiz.answer ? ' right' : '');
          return `<button class="choice${cls}" data-choice="${i}">${esc(les.quiz.choices[i])}</button>`;
        }).join('')}</div>
        ${ui.picked == null ? '' : ui.picked === les.quiz.answer
          ? `<p><span class="verdict ok">正解！</span> ${esc(les.quiz.why)}</p>`
          : `<p><span class="verdict ng">おしい。</span> もう一度えらんでみよう。</p>`}
      </div>
    </section>

    <section class="sec">
      <h2>${stepTag('書く')} やってみよう</h2>
      <div class="panel task">
        <p>${esc(les.task)}</p>
        <p class="muted" style="font-size:14px">${shell ? '' : '上のコードを自分のパソコンにコピーして、書きかえて動かしてみましょう。読むだけより、自分の手で書くほうが、何倍も身につきます。'}</p>
        ${ui.hint ? `<div class="hintbox"><b>ヒント:</b> ${esc(les.hint)}</div>` : `<div><button class="btn ghost small" id="hint">ヒントを見る</button></div>`}
      </div>
    </section>

    <div class="lnav">
      ${prev ? `<a class="btn ghost" href="#${L.id}-${prev}">← 前のレッスン</a>` : `<a class="btn ghost" href="#${L.id}">← 道のりにもどる</a>`}
      <button class="btn" id="complete">${isDone(L.id, no) ? '' : '完了にして、'}${next ? '次のレッスンへ →' : '道のりにもどる →'}</button>
    </div>
  </div>`;
}

/* ---- 表示の切りかえ ---- */
let current = { lang: null, no: null };
function parseHash() {
  const h = location.hash.replace(/^#/, '');
  const m = /^([a-z]+)(?:-(\d\d))?$/.exec(h);
  if (m) {
    const L = langOf(m[1]);
    if (L && m[2] && L.lessons[m[2]]) return { lang: L, no: m[2] };
    if (L) return { lang: L, no: null };
  }
  return { lang: null, no: null };
}
function render(keepScroll) {
  const r = parseHash();
  const changed = r.lang !== current.lang || r.no !== current.no;
  if (changed) ui = { tab: 0, shown: false, picked: null, hint: false };
  current = r;
  $('#app').innerHTML = r.no ? viewLesson(r.lang, r.no) : r.lang ? viewLang(r.lang) : viewHome();
  document.title = r.lang ? `${r.lang.name}${r.no ? ' ' + r.no : ''} ｜ 一人前ロードマップ` : '一人前ロードマップ';
  if (changed && !keepScroll) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => render());

document.addEventListener('click', e => {
  const { lang: L, no } = current;
  if (!L || !no) return;
  const t = e.target.closest('button'); if (!t) return;
  const les = lessonOf(L, no);
  if (t.dataset.tab != null) { ui.tab = Number(t.dataset.tab); render(true); }
  else if (t.id === 'reveal') { ui.shown = true; render(true); }
  else if (t.id === 'hint') { ui.hint = true; render(true); }
  else if (t.dataset.choice != null) { ui.picked = Number(t.dataset.choice); render(true); }
  else if (t.id === 'copy') {
    const text = les.files[Math.min(ui.tab, les.files.length - 1)].code;
    Promise.resolve().then(() => navigator.clipboard.writeText(text)).then(() => { t.textContent = 'コピーしました'; }, () => {
      const r = document.createRange(); r.selectNodeContents($('#code'));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); t.textContent = '選びました';
    });
    setTimeout(() => { t.textContent = 'コピー'; }, 1600);
  } else if (t.id === 'complete') {
    setDone(L.id, no);
    const next = ORDER[ORDER.indexOf(no) + 1];
    location.hash = next ? `${L.id}-${next}` : L.id;
  }
});

render(true);
</script>
</body>
</html>
