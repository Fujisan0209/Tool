rator.comparing(Book::price))     // 安い順にならべる\n            .map(Book::title)                              // 題名だけにする\n            .toList();\n        System.out.println(cheap);\n\n        System.out.println(first(books));\n        System.out.println(first(nums));\n    }\n}"}],"title":"ジェネリクス・ラムダ・Stream","goal":"コレクションの「しぼる・作りかえる・まとめる」を、Stream とラムダで書けるようになる。","intro":"いまの Java では、リストの処理を for 文ではなく Stream で書くことがとても多くなっています。「何をしたいか」を上から順に書けるので、慣れると読みやすくなります。あわせて、データの入れ物を1行で作れる record と、型を引数にするジェネリクスも見ておきましょう。","quiz":{"q":"List.of(1, 2, 3, 4).stream().filter(n -> n % 2 == 0).map(n -> n * 10).toList() の結果は？","choices":["[10, 20, 30, 40]","[20, 40]","[2, 4]"],"answer":1,"why":"filter で偶数（2 と 4）だけを残し、map でそれぞれ 10 倍にするので [20, 40] です。"},"task":"値段が 1000 円以上の本だけを取り出して、題名をアルファベット順にならべたリストを、Stream で作ってみよう。","hint":"filter → map(Book::title) → sorted() → toList() の順につなぎます。","output":"[2, 4, 6]\n[2, 4, 6, 8, 10, 12]\n合計: 21\n[まんが, 図かん]\nBook[title=Java入門, price=2400]\n1","run":"javac Main.java && java Main"},"17":{"points":["Java の仕事では、Maven か Gradle でプロジェクトを管理します。ライブラリを入れる、コンパイルする、テストする、を全部やってくれます。","使うライブラリは、Maven なら `pom.xml`、Gradle なら `build.gradle` に書きます。","ソースは `src/main/java`、テストは `src/test/java` に置くのがきまりです。","エディタは IntelliJ IDEA や VS Code（Extension Pack for Java）がよく使われます。まちがいを書いたそばから教えてくれます。"],"files":[{"name":"shell","main":false,"shell":true,"code":"# バージョンを確かめる\njava -version\njavac -version\n\n# 1つのファイルなら、コンパイルなしでそのまま実行できる\njava Main.java\n\n# Maven: コンパイル・テスト・jar ファイルを作る\nmvn compile\nmvn test\nmvn package\n\n# Gradle を使うプロジェクトの場合\n./gradlew build\n./gradlew test"}]},"18":{"points":["「分ける → 数える → ならべる → 表示する」と、仕事ごとにメソッドを分けています。","`counts.merge(w, 1, Integer::sum)` は、「なければ 1 を入れ、あれば 1 を足す」という Map の定番の書き方です。","`Comparator` をつないで、「回数の多い順、同じならアルファベット順」にしています。","空の文章が来たときは、例外を投げて知らせています。"],"files":[{"name":"Main.java","main":true,"shell":false,"code":"import java.util.ArrayList;\nimport java.util.Comparator;\nimport java.util.HashMap;\nimport java.util.List;\nimport java.util.Map;\n\npublic class Main {\n    /** 文章を、小文字の単語のリストにする */\n    static List\u003cString> splitWords(String text) {\n        List\u003cString> words = new ArrayList\u003c>();\n        for (String raw : text.toLowerCase().split(\"\\\\s+\")) {\n            String word = raw.replaceAll(\"[^a-z]\", \"\");     // 記号を取る\n            if (!word.isEmpty()) {\n                words.add(word);\n            }\n        }\n        return words;\n    }\n\n    static Map\u003cString, Integer> countWords(List\u003cString> words) {\n        Map\u003cString, Integer> counts = new HashMap\u003c>();\n        for (String w : words) {\n            counts.merge(w, 1, Integer::sum);\n        }\n        return counts;\n    }\n\n    /** 回数の多い順（同じならアルファベット順）に n 個 */\n    static List\u003cMap.Entry\u003cString, Integer>> top(Map\u003cString, Integer> counts, int n) {\n        return counts.entrySet().stream()\n            .sorted(Map.Entry.\u003cString, Integer>comparingByValue(Comparator.reverseOrder())\n                .thenComparing(Map.Entry.comparingByKey()))\n            .limit(n)\n            .toList();\n    }\n\n    static void report(String text) {\n        List\u003cString> words = splitWords(text);\n        if (words.isEmpty()) {\n            throw new IllegalArgumentException(\"単語がありません\");\n        }\n        Map\u003cString, Integer> counts = countWords(words);\n        System.out.println(\"全部で \" + words.size() + \" 語、\" + counts.size() + \" 種類\");\n        for (Map.Entry\u003cString, Integer> e : top(counts, 3)) {\n            System.out.println(e.getKey() + \": \" + e.getValue());\n        }\n    }\n\n    public static void main(String[] args) {\n        report(\"The cat saw the dog. The dog saw the bird!\");\n\n        try {\n            report(\"...\");\n        } catch (IllegalArgumentException e) {\n            System.out.println(\"エラー: \" + e.getMessage());\n        }\n    }\n}"}],"output":"全部で 10 語、5 種類\nthe: 4\ndog: 2\nsaw: 2\nエラー: 単語がありません","run":"javac Main.java && java Main"},"01":{"points":["Java のコードは、すべて `class` の中に書きます。public クラスの名前とファイル名（`Main.java`）は同じにします。","プログラムは `main` メソッドから動きはじめます。`public static void main(String[] args)` は、まずは形でおぼえましょう。","`System.out.println( )` で表示して改行します。","文の終わりには `;` が必要です。`//` から行の終わりまではコメントです。"],"files":[{"name":"Main.java","main":true,"shell":false,"code":"// はじめてのプログラム\npublic class Main {\n    public static void main(String[] args) {\n        System.out.println(\"こんにちは！\");\n        System.out.println(\"プログラミングをはじめます。\");\n        System.out.println(\"1 + 2 = \" + (1 + 2));\n    }\n}"}],"output":"こんにちは！\nプログラミングをはじめます。\n1 + 2 = 3","run":"javac Main.java && java Main"},"02":{"points":["変数を作るときは、`int age = 15;` のように、先に型を書きます。","よく使う型: `int`（整数）、`double`（小数）、`boolean`（真・偽）、`String`（文字列。大文字で始まる）。","一度決めた型は変えられません。`int` の変数に文字列を入れると、コンパイルエラーになります。","`var` と書くと、右の値から型を自動で決めてくれます（型がなくなるわけではありません）。"],"files":[{"name":"Main.java","main":true,"shell":false,"code":"public class Main {\n    public static void main(String[] args) {\n        String name = \"さくら\";      // 文字列\n        int age = 15;                // 整数\n        double height = 152.5;       // 小数\n        boolean isStudent = true;    // 真か偽か\n\n        System.out.println(\"名前: \" + name);\n        System.out.println(\"年れい: \" + age);\n        System.out.println(\"身長: \" + height);\n        System.out.println(\"学生: \" + isStudent);\n\n        age = age + 1;               // 変数は、あとから入れなおせます\n        System.out.println(\"来年は \" + age + \" さい\");\n\n        var city = \"東京\";           // 型は String に自動で決まる\n        System.out.println(city);\n    }\n}"}],"output":"名前: さくら\n年れい: 15\n身長: 152.5\n学生: true\n来年は 16 さい\n東京","run":"javac Main.java && java Main"},"03":{"points":["整数どうしの `/` は、小数点より下を切りすてます（7 / 2 は 3）。小数がほしいときは、どちらかを `double` にします。","`%` は割り算のあまりです。","文字列は `+` でつなげます。数もそのままつなげられます。","`\"1 + 2 = \" + 1 + 2` は \"1 + 2 = 12\" になります。計算を先にしたいときは `( )` で囲みます。","文字数は `length()` で調べます。"],"files":[{"name":"Main.java","main":true,"shell":false,"code":"public class Main {\n    public static void main(String[] args) {\n        int a = 7;\n        int b = 2;\n        System.out.println(\"7 + 2 = \" + (a + b));\n        System.out.println(\"7 - 2 = \" + (a - b));\n        System.out.println(\"7 * 2 = \" + (a * b));\n        System.out.println(\"7 / 2 = \" + (a / b));            // 整数どうしは切りすて\n        System.out.println(\"7 / 2.0 = \" + (a / 2.0));        // 小数にすると 3.5\n        System.out.println(\"7 % 2 = \" + (a % b));            // あまり\n\n        String family = \"山田\";\n        String given = \"太郎\";\n        String full = family + \" \" + given;\n        System.out.println(\"フルネーム: \" + full);\n        System.out.println(\"文字数: \" + \"program\".length());\n        System.out.println(String.format(\"%s さんは %d さい\", given, 15));\n    }\n}"}],"output":"7 + 2 = 9\n7 - 2 = 5\n7 * 2 = 14\n7 / 2 = 3\n7 / 2.0 = 3.5\n7 % 2 = 1\nフルネーム: 山田 太郎\n文字数: 7\n太郎 さんは 15 さい","run":"javac Main.java && java Main"},"04":{"points":["`if (条件) { }` の `( )` と `{ }` を忘れずに。`else if` で次の条件、`else` で「どれでもないとき」です。","「かつ」は `&&`、「または」は `||`、「〜でない」は `!` です。","数が等しいかは `==` で調べます。","文字列が同じかどうかは `==` ではなく `equals` で調べます。Java でいちばん多いまちがいの1つです。"],"files":[{"name":"Main.java","main":true,"shell":false,"code":"public class Main {\n    public static void main(String[] args) {\n        int score = 72;\n\n        if (score >= 80) {\n            System.out.println(\"よくできました\");\n        } else if (score >= 60) {\n            System.out.println(\"合格\");\n        } else {\n            System.out.println(\"もう少し\");\n        }\n\n        int age = 15;\n        boolean hasTicket = true;\n        if (age >= 12 && hasTicket) {\n            System.out.println(\"入場できます\");\n        }\n\n        String answer = \"はい\";\n        if (answer.equals(\"はい\")) {       // 文字列は equals でくらべる\n            System.out.println(\"ようこそ\");\n        }\n    }\n}"}],"output":"合格\n入場できます\nようこそ","run":"javac Main.java && java Main"},"05":{"points":["`for (はじめ; 続ける条件; 毎回すること)` の3つを `;` で区切ります。","`i++` は「i を 1 ふやす」、`count--` は「1 へらす」です。","`while (条件)` は、条件が成り立つあいだくりかえします。","`continue` は「今回は飛ばして次へ」、`break` は「くりかえしをやめる」です。"],"files":[{"name":"Main.java","main":true,"shell":false,"code":"public class Main {\n    public static void main(String[] args) {\n        // 決まった回数くりかえす\n        for (int i = 1; i \u003c= 5; i++) {\n            System.out.println(i + \" 回目\");\n        }\n\n        // 条件が成り立つあいだくりかえす\n        int count = 3;\n        while (count > 0) {\n            System.out.println(count);\n            count--;\n        }\n        System.out.println(\"発射！\");\n\n        // 1〜10 の偶数だけを足す\n        int total = 0;\n        for (int i = 1; i \u003c= 10; i++) {\n            if (i % 2 == 1) {\n                continue;      // 奇数は飛ばす\n            }\n            total += i;\n        }\n        System.out.println(\"偶数の合計: \" + total);\n    }\n}"}],"output":"1 回目\n2 回目\n3 回目\n4 回目\n5 回目\n3\n2\n1\n発射！\n偶数の合計: 30","run":"javac Main.java && java Main"},"06":{"points":["Java では、関数のことを「メソッド」とよびます。クラスの中に書きます。","`static int add(int a, int b)` は、「int を2つ受けとって、int を返す」という意味です。","何も返さないメソッドは、返す型のところに `void` と書きます。","引数の型や数がちがえば、同じ名前のメソッドをいくつも作れます（オーバーロード）。"],"files":[{"name":"Main.java","main":true,"shell":false,"code":"public class Main {\n    static int add(int a, int b) {\n        return a + b;\n    }\n\n    static String greet(String name) {\n        return \"こんにちは、\" + name + \"さん\";\n    }\n\n    static String greet() {              // 引数なしの greet\n        return greet(\"みなさん\");\n    }\n\n    static boolean isEven(int n) {\n        return n % 2 == 0;\n    }\n\n    public static void main(String[] args) {\n        System.out.println(\"3 + 4 = \" + add(3, 4));\n        System.out.println(greet(\"さくら\"));\n        System.out.println(greet());\n        System.out.println(\"10 は偶数？ \" + isEven(10));\n        System.out.println(\"7 は偶数？ \" + isEven(7));\n    }\n}"}],"output":"3 + 4 = 7\nこんにちは、さくらさん\nこんにちは、みなさんさん\n10 は偶数？ true\n7 は偶数？ false","run":"javac Main.java && java Main"},"07":{"points":["配列 `int[]` は、作ったあと長さを変えられません。あとから増やしたいときは `ArrayList` を使います。","`ArrayList\u003cInteger>` の `\u003c >` の中には、入れる物の型を書きます。`int` ではなく `Integer` と書くのがきまりです。","配列は `a[0]` と `a.length`、ArrayList は `get(0)` と `size()`。書き方がちがうので注意です。","`for (int s : scores)` で、中身を1つずつ取り出せます（拡張 for 文）。"],"files":[{"name":"Main.java","main":true,"shell":false,"code":"import java.util.ArrayList;\nimport java.util.Collections;\nimport java.util.List;\n\npublic class Main {\n    public static void main(String[] args) {\n        int[] fixed = {70, 85, 60};          // 配列: 長さは変えられない\n        System.out.println(\"配列の長さ: \" + fixed.length);\n\n        List\u003cInteger> scores = new ArrayList\u003c>();\n        for (int s : fixed) {\n            scores.add(s);\n        }\n        scores.add(90);                      // 後ろに追加\n\n        System.out.println(\"最初の点数: \" + scores.get(0));\n        System.out.println(\"人数: \" + scores.size());\n\n        int total = 0;\n        for (int s : scores) {\n            total += s;\n        }\n        System.out.println(\"合計: \" + total);\n        System.out.println(\"平均: \" + (double) total / scores.size());\n        System.out.println(\"最高点: \" + Collections.max(scores));\n\n        Collections.sort(scores);            // 小さい順にならべかえる\n        System.out.println(\"ならべかえ: \" + scores);\n    }\n}"}],"output":"配列の長さ: 3\n最初の点数: 70\n人数: 4\n合計: 305\n平均: 76.25\n最高点: 90\nならべかえ: [60, 70, 85, 90]","run":"javac Main.java && java Main"},"08":{"points":["`Map\u003cString, Integer>` は「キーが String、値が Integer」の辞書です。","`put` で入れて、`get` で取り出します。ないキーを `get` すると `null` が返ります。","`HashMap` は順番をおぼえません。入れた順にしたいときは `LinkedHashMap`、キーの順にしたいときは `TreeMap` を使います。","`containsKey` で、キーがあるかを調べます。`getOrDefault` は、ないときの値を決められます。"],"files":[{"name":"Main.java","main":true,"shell":false,"code":"import java.util.LinkedHashMap;\nimport java.util.Map;\n\npublic class Main {\n    public static void main(String[] args) {\n        Map\u003cString, Integer> prices = new LinkedHashMap\u003c>();\n        prices.put(\"りんご\", 120);\n        prices.put(\"バナナ\", 80);\n        prices.put(\"みかん\", 60);\n\n        System.out.println(\"りんご は \" + prices.get(\"りんご\") + \" 円\");\n\n        if (prices.containsKey(\"ぶどう\")) {\n            System.out.println(\"ぶどう は \" + prices.get(\"ぶどう\") + \" 円\");\n        } else {\n            System.out.println(\"ぶどう はありません\");\n        }\n\n        System.out.println(\"もも: \" + prices.getOrDefault(\"もも\", 0));\n\n        System.out.println(\"--- 一覧 ---\");\n        for (Map.Entry\u003cString, Integer> e : prices.entrySet()) {\n            System.out.println(e.getKey() + \": \" + e.getValue() + \" 円\");\n        }\n        System.out.println(\"種類: \" + prices.size());\n    }\n}"}],"output":"りんご は 120 円\nぶどう はありません\nもも: 0\n--- 一覧 ---\nりんご: 120 円\nバナナ: 80 円\nみかん: 60 円\n種類: 3","run":"javac Main.java && java Main"},"09":{"points":["`split` で分けて配列に、`String.join` でつないで文字列にします。","文字列は作ったあと書きかえられません。`toUpperCase` や `replace` は「新しい文字列」を返します。","`contains` で「ふくまれているか」、`strip` で前後の空白を取ります。","ループの中で何度も文字列をつなぐときは、`StringBuilder` を使うと速くなります。"],"files":[{"name":"Main.java","main":true,"shell":false,"code":"public class Main {\n    public static void main(String[] args) {\n        String text = \"apple,banana,cherry\";\n\n        String[] fruits = text.split(\",\");          // カンマで分ける\n        System.out.println(fruits.length + \" 個\");\n        System.out.println(\"1番目: \" + fruits[0]);\n        System.out.println(\"大文字: \" + fruits[0].toUpperCase());\n        System.out.println(\"banana をふくむ？ \" + text.contains(\"banana\"));\n        System.out.println(\"つなぐ: \" + String.join(\" / \", fruits));\n        System.out.println(\"置きかえ: \" + text.replace(\"cherry\", \"melon\"));\n\n        String messy = \"   hello   \";\n        System.out.println(\"[\" + messy.strip() + \"]\");   // 前後の空白を取る\n        System.out.println(\"先頭3文字: \" + text.substring(0, 3));\n\n        StringBuilder sb = new StringBuilder();\n        for (int i = 1; i \u003c= 3; i++) {\n            sb.append(i).append(\"-\");\n        }\n        System.out.println(sb);\n    }\n}"}],"output":"3 個\n1番目: apple\n大文字: APPLE\nbanana をふくむ？ true\nつなぐ: apple / banana / cherry\n置きかえ: apple,banana,melon\n[hello]\n先頭3文字: app\n1-2-3-","run":"javac Main.java && java Main"}}},{"id":"js","name":"JavaScript","type":"動的型","exec":"インタプリタ（JIT）","tagline":"Web ページを動かす、ブラウザの言語","about":"すべてのブラウザに入っていて、Web ページに動きをつけます。Node.js を使えば、サーバーや道具も作れます。Java と名前は似ていますが、別の言語です。","run":"node main.js","flow":[["main.js","あなたが書く"],["Node.js / ブラウザ","実行エンジン","tool"],["その場で実行","よく動く所は速く"]],"flowNote":"ブラウザの中にも実行エンジンが入っているので、Web ページの上でそのまま動きます。","ready":["map・filter・分割代入を使って、配列とオブジェクトを加工できる","async / await で、時間のかかる処理を正しく待てる","import / export で、ファイルを分けて書ける","npm でライブラリを入れ、テストとリンターを動かせる"],"next":["HTML・CSS と組み合わせて、ボタンで動く Web ページを作る（DOM）","fetch で Web API からデータを取ってきて、画面に出す","React などのフレームワークと、TypeScript に進む"],"lessons":{"10":{"points":["`class` は「設計図」。`new Account(\"さくら\", 1000)` で、設計図から実物（インスタンス）を作ります。","`constructor` は、実物を作るときに1回だけ呼ばれ、最初の値を入れます。","`this` は「この実物自身」を指します。","名前を `#` で始めると、クラスの外からさわれない「プライベート」なデータになります。"],"files":[{"name":"main.js","main":true,"shell":false,"code":"class Account {\n  #balance;                      // クラスの外からはさわれない\n\n  constructor(owner, balance) {\n    this.owner = owner;\n    this.#balance = balance;\n  }\n\n  deposit(amount) {\n    this.#balance += amount;\n  }\n\n  get balance() {                // a.balance で読めるようにする\n    return this.#balance;\n  }\n\n  show() {\n    console.log(`${this.owner} の残高: ${this.#balance} 円`);\n  }\n}\n\nconst a = new Account(\"さくら\", 1000);\nconst b = new Account(\"たろう\", 300);\n\na.deposit(500);      // a だけが増える\na.show();\nb.show();\nconsole.log(a.balance);"}],"output":"さくら の残高: 1500 円\nたろう の残高: 300 円\n1500","run":"node main.js"},"11":{"points":["`map` は「全部を作りかえた新しい配列」、`filter` は「条件に合うものだけの新しい配列」を作ります。もとの配列は変わりません。","`reduce` は、配列を1つの値にまとめます（合計など）。","`const { name, price } = item;` は分割代入。オブジェクトから、ほしい物だけを取り出します。","`...` はスプレッド構文。配列やオブジェクトの中身を広げて、コピーや合体ができます。"],"files":[{"name":"main.js","main":true,"shell":false,"code":"const nums = [1, 2, 3, 4, 5, 6];\n\nconst doubled = nums.map((n) => n * 2);             // 作りかえる\nconst evens = nums.filter((n) => n % 2 === 0);      // しぼる\nconst total = nums.reduce((sum, n) => sum + n, 0);  // まとめる\nconsole.log(doubled);\nconsole.log(evens);\nconsole.log(\"合計:\", total);\n\nconst items = [\n  { name: \"りんご\", price: 120 },\n  { name: \"バナナ\", price: 80 },\n  { name: \"メロン\", price: 900 },\n];\n\n// つなげて書ける\nconst names = items.filter((item) => item.price >= 100).map((item) => item.name);\nconsole.log(names);\n\n// 分割代入: ほしい物だけ取り出す\nconst { name, price } = items[0];\nconsole.log(name, price);\nconst [first, second] = nums;\nconsole.log(first, second);\n\n// スプレッド構文: 広げてコピー・合体\nconst more = [...nums, 7, 8];\nconst sale = { ...items[0], price: 100 };\nconsole.log(more.length, sale);"}],"title":"配列を一気にあつかう（map・filter・reduce）","goal":"for 文を使わずに、配列を「作りかえる・しぼる・まとめる」ことができるようになる。あわせて、分割代入とスプレッド構文を読めるようになる。","intro":"JavaScript では、関数をほかの関数に渡す書き方がとても多く使われます。とくに配列の map・filter・reduce は、React などのライブラリでも毎日のように出てきます。これが読めないと、ほかの人のコードが読めません。","quiz":{"q":"[1, 2, 3, 4].filter(n => n > 2).map(n => n * 10) の結果は？","choices":["[10, 20, 30, 40]","[30, 40]","[3, 4]"],"answer":1,"why":"filter で 2 より大きい数（3 と 4）だけを残し、map でそれぞれ 10 倍にするので [30, 40] です。"},"task":"商品の配列から、値段が 100 円以上のものだけを取り出して、名前の配列を作ってみよう。","hint":"items.filter(...).map(item => item.name) の形です。","output":"[ 2, 4, 6, 8, 10, 12 ]\n[ 2, 4, 6 ]\n合計: 21\n[ 'りんご', 'メロン' ]\nりんご 120\n1 2\n8 { name: 'りんご', price: 100 }","run":"node main.js"},"12":{"points":["1つのファイルが1つの「モジュール」です。外で使わせたい物に `export` をつけます。","使う側は `import { hello } from \"./greeting.js\";` と書きます。`./` と拡張子 `.js` を忘れずに。","`import` / `export` を使う書き方を ES モジュールといいます。Node.js では、`package.json` に `\"type\": \"module\"` と書いておくのが確実です。","古いコードには `require( )` と `module.exports` を使う書き方（CommonJS）もあります。読めるようにしておきましょう。"],"files":[{"name":"greeting.js","main":false,"shell":false,"code":"// あいさつを作る部品\nexport function hello(name) {\n  return `こんにちは、${name}さん`;\n}\n\nexport function bye(name) {\n  return `さようなら、${name}さん`;\n}"},{"name":"package.json","main":false,"shell":false,"code":"{\n  \"type\": \"module\"\n}"},{"name":"main.js","main":true,"shell":false,"code":"import { hello, bye } from \"./greeting.js\";\n\nconsole.log(hello(\"さくら\"));\nconsole.log(bye(\"さくら\"));"}],"output":"こんにちは、さくらさん\nさようなら、さくらさん","run":"node main.js"},"13":{"points":["エラーが起きるかもしれない所を `try { }` に書き、起きたときの対応を `catch (e) { }` に書きます。","自分でエラーを起こすには `throw new Error(\"説明\")` と書きます。","`finally { }` の中は、エラーが起きても起きなくても、最後に必ず動きます。","JavaScript は、0 で割ってもエラーにならず `Infinity` に、数にできない文字は `NaN` になります。自分でチェックする必要があります。"],"files":[{"name":"main.js","main":true,"shell":false,"code":"function divide(a, b) {\n  if (b === 0) {\n    throw new Error(\"0 で割ることはできません\");\n  }\n  return a / b;\n}\n\ntry {\n  console.log(\"10 ÷ 2 =\", divide(10, 2));\n  console.log(\"10 ÷ 0 =\", divide(10, 0));\n  console.log(\"ここは動きません\");\n} catch (e) {\n  console.log(\"エラー:\", e.message);\n}\n\nconst text = \"abc\";\ntry {\n  const number = Number(text);\n  if (Number.isNaN(number)) {          // 数にできないと NaN になる\n    throw new Error(`\"${text}\" は数ではありません`);\n  }\n  console.log(number);\n} catch (e) {\n  console.log(e.message);\n} finally {\n  console.log(\"チェック終わり\");\n}"}],"output":"10 ÷ 2 = 5\nエラー: 0 で割ることはできません\n\"abc\" は数ではありません\nチェック終わり","run":"node main.js"},"14":{"points":["ファイルをあつかう道具は、Node.js の `node:fs` モジュールに入っています（ブラウザの JavaScript では使えません）。","`writeFileSync` で書きこみ、`readFileSync(ファイル, \"utf8\")` で文字列として読みこみます。","名前に `Sync` がつく物は「終わるまで待つ」やり方です。サーバーでは、待たない `fs/promises` と `await` を使います（非同期のレッスンで出てきます）。","ファイルがないときは、エラーの `code` が `\"ENOENT\"` になります。"],"files":[{"name":"main.js","main":true,"shell":false,"code":"import { readFileSync, writeFileSync } from \"node:fs\";\n\nconst lines = [\"牛乳を買う\", \"宿題をする\", \"本を読む\"];\n\n// 書きこむ\nwriteFileSync(\"memo.txt\", lines.join(\"\\n\") + \"\\n\");\nconsole.log(lines.length, \"行 書きました\");\n\n// 読みこむ\nconst loaded = readFileSync(\"memo.txt\", \"utf8\").trim().split(\"\\n\");\nloaded.forEach((line, i) => {\n  console.log(`${i + 1}: ${line}`);\n});\n\n// ないファイルを開こうとしたとき\ntry {\n  readFileSync(\"ない.txt\", \"utf8\");\n} catch (e) {\n  if (e.code === \"ENOENT\") {\n    console.log(\"ない.txt は開けませんでした\");\n  } else {\n    throw e;      // 知らないエラーは、そのまま上に知らせる\n  }\n}"}],"output":"3 行 書きました\n1: 牛乳を買う\n2: 宿題をする\n3: 本を読む\nない.txt は開けませんでした","run":"node main.js"},"15":{"points":["Node.js には、テストの道具 `node:test` が最初から入っています。`node --test` で動かします。","`test(\"説明\", () => { ... })` が1つのテストです。","`assert.equal(実際, 期待)` は、2つが同じでなければ「失敗」と知らせます。","仕事では Vitest や Jest もよく使われます。`expect(fizzbuzz(3)).toBe(\"Fizz\")` のように書きますが、考え方は同じです。"],"files":[{"name":"main.js","main":true,"shell":false,"code":"import { test } from \"node:test\";\nimport assert from \"node:assert/strict\";\n\nfunction fizzbuzz(n) {\n  if (n % 15 === 0) return \"FizzBuzz\";\n  if (n % 3 === 0) return \"Fizz\";\n  if (n % 5 === 0) return \"Buzz\";\n  return String(n);\n}\n\ntest(\"3 は Fizz\", () => {\n  assert.equal(fizzbuzz(3), \"Fizz\");\n});\n\ntest(\"5 は Buzz\", () => {\n  assert.equal(fizzbuzz(5), \"Buzz\");\n});\n\ntest(\"15 は FizzBuzz\", () => {\n  assert.equal(fizzbuzz(15), \"FizzBuzz\");\n});\n\ntest(\"7 は 7\", () => {\n  assert.equal(fizzbuzz(7), \"7\");\n});"}],"mode":"test","output":"✔ 3 は Fizz\n✔ 5 は Buzz\n✔ 15 は FizzBuzz\n✔ 7 は 7\nℹ tests 4\nℹ pass 4\nℹ fail 0","run":"node --test main.js"},"16":{"points":["`Promise` は「あとで結果がとどく約束」です。","`async` をつけた関数の中では、`await` で Promise の結果がとどくまで待てます。上から順に読めるコードになります。","`await` は「その関数の中」だけを待たせます。プログラム全体は止まりません。","いくつかの処理を同時に進めて全部待つときは `Promise.all` を使います。","失敗は、ふつうのエラーと同じように `try` / `catch` で受けとれます。"],"files":[{"name":"main.js","main":true,"shell":false,"code":"// ms ミリ秒待つ Promise を作る\nfunction wait(ms) {\n  return new Promise((resolve) => setTimeout(resolve, ms));\n}\n\n// 時間のかかる処理のかわり（通信のつもり）\nasync function fetchPrice(name) {\n  await wait(50);\n  const prices = { りんご: 120, バナナ: 80 };\n  if (!(name in prices)) {\n    throw new Error(`${name} は売っていません`);\n  }\n  return prices[name];\n}\n\nasync function main() {\n  console.log(\"1. 調べはじめます\");\n\n  const apple = await fetchPrice(\"りんご\");      // 結果がとどくまで待つ\n  console.log(\"2. りんご:\", apple, \"円\");\n\n  // 2つを同時に進めて、両方そろうのを待つ\n  const [a, b] = await Promise.all([fetchPrice(\"りんご\"), fetchPrice(\"バナナ\")]);\n  console.log(\"3. 合計:\", a + b, \"円\");\n\n  try {\n    await fetchPrice(\"ぶどう\");\n  } catch (e) {\n    console.log(\"4. エラー:\", e.message);\n  }\n}\n\nmain();\nconsole.log(\"0. main() を呼んだ直後（待たずに先へ進む）\");"}],"title":"非同期処理（Promise と async / await）","goal":"「時間のかかる処理を待つ」コードを、async / await で書けるようになる。","intro":"通信やファイルの読みこみのように、時間のかかる処理があります。JavaScript は、その間ほかの仕事を止めないように「あとで結果を知らせる」しくみ（非同期）で動いています。Web の開発ではさけて通れない、JavaScript でいちばん大事なテーマの1つです。","quiz":{"q":"console.log(\"A\"); setTimeout(() => console.log(\"B\"), 0); console.log(\"C\"); の表示順は？","choices":["A B C","A C B","B A C"],"answer":1,"why":"setTimeout の中身は、待ち時間が 0 でも「いまの仕事が全部終わってから」動きます。だから A C B の順になります。"},"task":"「名前を受けとり、50ミリ秒後に『こんにちは、〇〇さん』を返す」async 関数を作り、await で結果を受けとって表示してみよう。","hint":"await wait(50); のあとで return します。呼ぶ側も async 関数の中で await します。","output":"1. 調べはじめます\n0. main() を呼んだ直後（待たずに先へ進む）\n2. りんご: 120 円\n3. 合計: 200 円\n4. エラー: ぶどう は売っていません","run":"node main.js"},"17":{"points":["`npm` は Node.js についてくる道具で、ライブラリを入れたり、決めておいたコマンドを動かしたりします。","`package.json` に、使うライブラリと、`npm run 〇〇` で動かすコマンドを書きます。","入れたライブラリは `node_modules` フォルダに入ります。とても大きいので、Git には入れません（`.gitignore` に書きます）。","Prettier は書き方をそろえ、ESLint はあやしい所を教えてくれます。","調べものは MDN Web Docs（日本語あり）がいちばん信頼できます。"],"files":[{"name":"shell","main":false,"shell":true,"code":"# バージョンを確かめる\nnode --version\nnpm --version\n\n# プロジェクトを始める（package.json ができる）\nnpm init -y\n\n# ライブラリを入れる（-D は開発のときだけ使う物）\nnpm install dayjs\nnpm install -D prettier eslint\n\n# 書き方をそろえる・まちがいを探す\nnpx prettier --write .\nnpx eslint .\n\n# テストを動かす\nnode --test"}]},"18":{"points":["「分ける → 数える → ならべる → 表示する」と、仕事ごとに関数を分けています。","`(counts.get(w) ?? 0) + 1` は、「まだなければ 0 として、1 を足す」という Map の定番の書き方です。","`sort` に渡す関数で、「回数の多い順、同じならアルファベット順」を決めています。","空の文章が来たときは、エラーを投げて知らせています。"],"files":[{"name":"main.js","main":true,"shell":false,"code":"/** 文章を、小文字の単語の配列にする */\nfunction splitWords(text) {\n  return text\n    .toLowerCase()\n    .split(/\\s+/)\n    .map((raw) => raw.replace(/[^a-z]/g, \"\"))   // 記号を取る\n    .filter((word) => word !== \"\");\n}\n\nfunction countWords(words) {\n  const counts = new Map();\n  for (const w of words) {\n    counts.set(w, (counts.get(w) ?? 0) + 1);\n  }\n  return counts;\n}\n\n/** 回数の多い順（同じならアルファベット順）に n 個 */\nfunction top(counts, n) {\n  return [...counts.entries()]\n    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))\n    .slice(0, n);\n}\n\nfunction report(text) {\n  const words = splitWords(text);\n  if (words.length === 0) {\n    throw new Error(\"単語がありません\");\n  }\n  const counts = countWords(words);\n  console.log(`全部で ${words.length} 語、${counts.size} 種類`);\n  for (const [word, count] of top(counts, 3)) {\n    console.log(`${word}: ${count}`);\n  }\n}\n\nreport(\"The cat saw the dog. The dog saw the bird!\");\n\ntry {\n  report(\"...\");\n} catch (e) {\n  console.log(\"エラー:\", e.message);\n}"}],"output":"全部で 10 語、5 種類\nthe: 4\ndog: 2\nsaw: 2\nエラー: 単語がありません","run":"node main.js"},"01":{"points":["`console.log( )` で表示します。Node.js では画面（ターミナル）に、ブラウザでは開発者ツールの「コンソール」に出ます。","`//` から行の終わりまではコメントです。","文の終わりの `;` は、なくても動くことが多いですが、つけておくのが安全です。","JavaScript は、ブラウザの中でも、Node.js を使ってパソコンの上でも動きます。このコースでは Node.js で動かします。"],"files":[{"name":"main.js","main":true,"shell":false,"code":"// はじめてのプログラム\nconsole.log(\"こんにちは！\");\nconsole.log(\"プログラミングをはじめます。\");\nconsole.log(\"1 + 2 =\", 1 + 2);   // カンマで区切ると、間に空白が入ります"}],"output":"こんにちは！\nプログラミングをはじめます。\n1 + 2 = 3","run":"node main.js"},"02":{"points":["変数は `let`（入れなおせる）か `const`（入れなおせない）で作ります。まず `const` を使い、変える必要があるときだけ `let` にします。","古い書き方の `var` は、いまは使いません。","数は整数も小数も同じ `number` 型です。","バッククォートで囲んだ文字列（テンプレート文字列）では、`${ }` の中の変数が値に置きかわります。","`typeof x` で、いまの型を調べられます。"],"files":[{"name":"main.js","main":true,"shell":false,"code":"const name = \"さくら\";      // 文字列 (string)\nlet age = 15;               // 数 (number)\nconst height = 152.5;       // 小数も number\nconst isStudent = true;     // 真か偽か (boolean)\n\nconsole.log(`名前: ${name}`);\nconsole.log(`年れい: ${age}`);\nconsole.log(`身長: ${height}`);\nconsole.log(`学生: ${isStudent}`);\n\nage = age + 1;              // let の変数は入れなおせます\nconsole.log(`来年は ${age} さい`);\nconsole.log(typeof name, typeof age, typeof isStudent);"}],"output":"名前: さくら\n年れい: 15\n身長: 152.5\n学生: true\n来年は 16 さい\nstring number boolean","run":"node main.js"},"03":{"points":["`/` は小数になります（7 / 2 は 3.5）。切りすてたいときは `Math.floor( )` を使います。","`%` はあまり、`**` は累乗です。","文字列と数を `+` でつなぐと、数が文字列に変わります。`\"1\" + 2` は `\"12\"` になるので注意。","文字列を数に変えるときは `Number(\"42\")` を使います。","文字数は `.length` で調べます。"],"files":[{"name":"main.js","main":true,"shell":false,"code":"const a = 7;\nconst b = 2;\nconsole.log(\"7 + 2 =\", a + b);\nconsole.log(\"7 - 2 =\", a - b);\nconsole.log(\"7 * 2 =\", a * b);\nconsole.log(\"7 / 2 =\", a / b);                 // 小数になる\nconsole.log(\"切りすて:\", Math.floor(a / b));\nconsole.log(\"7 % 2 =\", a % b);                 // あまり\n\nconst family = \"山田\";\nconst given = \"太郎\";\nconst full = family + \" \" + given;\nconsole.log(\"フルネーム:\", full);\nconsole.log(\"文字数:\", \"program\".length);\n\nconsole.log(\"1\" + 2);            // 文字列としてつながる\nconsole.log(Number(\"1\") + 2);    // 数として足す"}],"output":"7 + 2 = 9\n7 - 2 = 5\n7 * 2 = 14\n7 / 2 = 3.5\n切りすて: 3\n7 % 2 = 1\nフルネーム: 山田 太郎\n文字数: 7\n12\n3","run":"node main.js"},"04":{"points":["`if (条件) { }` の形です。`else if` で次の条件、`else` で「どれでもないとき」です。","等しいかどうかは `===` で調べます。`==` は型を勝手に変えてくらべるので（`\"1\" == 1` が true）、使わないのがきまりです。","「かつ」は `&&`、「または」は `||`、「〜でない」は `!` です。","`条件 ? A : B` は、「条件が成り立てば A、そうでなければ B」という短い書き方です（三項演算子）。"],"files":[{"name":"main.js","main":true,"shell":false,"code":"const score = 72;\n\nif (score >= 80) {\n  console.log(\"よくできました\");\n} else if (score >= 60) {\n  console.log(\"合格\");\n} else {\n  console.log(\"もう少し\");\n}\n\nconst age = 15;\nconst hasTicket = true;\nif (age >= 12 && hasTicket) {\n  console.log(\"入場できます\");\n}\n\nconsole.log(\"1\" == 1);    // true（型を勝手に変えてしまう）\nconsole.log(\"1\" === 1);   // false（型もくらべる）\n\nconst label = age >= 18 ? \"大人\" : \"子ども\";\nconsole.log(label);"}],"output":"合格\n入場できます\ntrue\nfalse\n子ども","run":"node main.js"},"05":{"points":["`for (はじめ; 続ける条件; 毎回すること)` の3つを `;` で区切ります。","配列の中身を1つずつ取り出すときは `for (const x of 配列)` が便利です。","`while (条件)` は、条件が成り立つあいだくりかえします。","`continue` は「今回は飛ばして次へ」、`break` は「くりかえしをやめる」です。"],"files":[{"name":"main.js","main":true,"shell":false,"code":"// 決まった回数くりかえす\nfor (let i = 1; i \u003c= 5; i++) {\n  console.log(i, \"回目\");\n}\n\n// 条件が成り立つあいだくりかえす\nlet count = 3;\nwhile (count > 0) {\n  console.log(count);\n  count--;\n}\nconsole.log(\"発射！\");\n\n// 1〜10 の偶数だけを足す\nlet total = 0;\nfor (let i = 1; i \u003c= 10; i++) {\n  if (i % 2 === 1) {\n    continue;      // 奇数は飛ばす\n  }\n  total += i;\n}\nconsole.log(\"偶数の合計:\", total);"}],"output":"1 回目\n2 回目\n3 回目\n4 回目\n5 回目\n3\n2\n1\n発射！\n偶数の合計: 30","run":"node main.js"},"06":{"points":["関数は `function 名前(引数) { }` で作り、`return` で結果を返します。","`const isEven = (n) => n % 2 === 0;` のような「アロー関数」も、とてもよく使われます。1行なら `return` を省略できます。","`name = \"みなさん\"` のように、引数に「何も渡されなかったときの値」を決められます。","JavaScript では、関数も「値」です。変数に入れたり、ほかの関数に渡したりできます。"],"files":[{"name":"main.js","main":true,"shell":false,"code":"function add(a, b) {\n  return a + b;\n}\n\nfunction greet(name = \"みなさん\") {\n  return `こんにちは、${name}さん`;\n}\n\nconst isEven = (n) => n % 2 === 0;   // アロー関数\n\nconsole.log(\"3 + 4 =\", add(3, 4));\nconsole.log(greet(\"さくら\"));\nconsole.log(greet());\nconsole.log(\"10 は偶数？\", isEven(10));\nconsole.log(\"7 は偶数？\", isEven(7));"}],"output":"3 + 4 = 7\nこんにちは、さくらさん\nこんにちは、みなさんさん\n10 は偶数？ true\n7 は偶数？ false","run":"node main.js"},"07":{"points":["配列は `[ ]` で作ります。番号は 0 から始まります。","`push` で後ろに追加、`.length` で個数。最後の要素は `at(-1)` で取れます。","`const` の配列でも、中身の追加や変更はできます（入れなおしができないだけ）。","数をならべかえるときは `sort((a, b) => a - b)` と書きます。ただの `sort()` は文字としてならべるので、10 が 9 より前に来てしまいます。"],"files":[{"name":"main.js","main":true,"shell":false,"code":"const scores = [70, 85, 60];\nscores.push(90);                 // 後ろに追加\n\nconsole.log(\"最初の点数:\", scores[0]);\nconsole.log(\"最後の点数:\", scores.at(-1));\nconsole.log(\"人数:\", scores.length);\n\nlet total = 0;\nfor (const s of scores) {\n  total += s;\n}\nconsole.log(\"合計:\", total);\nconsole.log(\"平均:\", total / scores.length);\nconsole.log(\"最高点:\", Math.max(...scores));\n\nscores.sort((a, b) => a - b);    // 小さい順にならべかえる\nconsole.log(\"ならべかえ:\", scores);"}],"output":"最初の点数: 70\n最後の点数: 90\n人数: 4\n合計: 305\n平均: 76.25\n最高点: 90\nならべかえ: [ 60, 70, 85, 90 ]","run":"node main.js"},"08":{"points":["「キーと値」の組は、オブジェクト `{ }` で表せます。`prices[\"りんご\"]` や `prices.apple` のように取り出します。","ないキーを取り出すと `undefined` になります（エラーにはなりません）。","キーをあとから足したり消したりする「辞書」として使うなら、専用の `Map` が向いています。`set` / `get` / `has` を使います。","`??` は「左が null か undefined なら右を使う」という意味です。"],"files":[{"name":"main.js","main":true,"shell":false,"code":"const prices = new Map();\nprices.set(\"りんご\", 120);\nprices.set(\"バナナ\", 80);\nprices.set(\"みかん\", 60);\n\nconsole.log(\"りんご は\", prices.get(\"りんご\"), \"円\");\n\nif (prices.has(\"ぶどう\")) {\n  console.log(\"ぶどう は\", prices.get(\"ぶどう\"), \"円\");\n} else {\n  console.log(\"ぶどう はありません\");\n}\n\nconsole.log(\"もも:\", prices.get(\"もも\") ?? \"不明\");   // なければ「不明」\n\nconsole.log(\"--- 一覧 ---\");\nfor (const [name, price] of prices) {\n  console.log(`${name}: ${price} 円`);\n}\nconsole.log(\"種類:\", prices.size);\n\n// ひとまとまりのデータには、オブジェクトを使う\nconst user = { name: \"さくら\", age: 15 };\nconsole.log(user.name, user.age);"}],"output":"りんご は 120 円\nぶどう はありません\nもも: 不明\n--- 一覧 ---\nりんご: 120 円\nバナナ: 80 円\nみかん: 60 円\n種類: 3\nさくら 15","run":"node main.js"},"09":{"points":["`split` で分けて配列に、`join` で配列をつないで文字列にします。","文字列は作ったあと書きかえられません。`toUpperCase` や `replace` は「新しい文字列」を返します。","`includes` で「ふくまれているか」、`trim` で前後の空白を取ります。","`replace` は最初の1つだけ、`replaceAll` は全部を置きかえます。"],"files":[{"name":"main.js","main":true,"shell":false,"code":"const text = \"apple,banana,cherry\";\n\nconst fruits = text.split(\",\");           // カンマで分ける\nconsole.log(fruits.length, \"個\");\nconsole.log(\"1番目:\", fruits[0]);\nconsole.log(\"大文字:\", fruits[0].toUpperCase());\nconsole.log(\"banana をふくむ？\", text.includes(\"banana\"));\nconsole.log(\"つなぐ:\", fruits.join(\" / \"));\nconsole.log(\"置きかえ:\", text.replace(\"cherry\", \"melon\"));\nconsole.log(\"全部置きかえ:\", text.replaceAll(\",\", \" \"));\n\nconst messy = \"   hello   \";\nconsole.log(\"[\" + messy.trim() + \"]\");    // 前後の空白を取る\nconsole.log(\"先頭3文字:\", text.slice(0, 3));"}],"output":"3 個\n1番目: apple\n大文字: APPLE\nbanana をふくむ？ true\nつなぐ: apple / banana / cherry\n置きかえ: apple,banana,melon\n全部置きかえ: apple banana cherry\n[hello]\n先頭3文字: app","run":"node main.js"}}},{"id":"ts","name":"TypeScript","type":"静的型","exec":"JS に変換して実行","tagline":"JavaScript に「型」を足した言語","about":"大きめの Web アプリや、チームでの開発でえらばれています。JavaScript のコードはほぼそのまま使えて、型のまちがいを実行する前に見つけてくれます。","run":"npx tsx main.ts","flow":[["main.ts","あなたが書く"],["tsc / tsx","型チェック + 変換","tool"],["JavaScript","型がとれた形"],["Node.js","が実行"]],"flowNote":"実行する前に型をチェックして、まちがいを教えてくれます。そのあと JavaScript に変えて動かします。","ready":["type や interface で、データの形を型として書ける","ユニオン型と型の絞りこみで、「ないかもしれない」を安全にあつかえる","ジェネリクスや Promise の型を読んで、ライブラリを使える","strict の設定で、型エラーなしのプロジェクトを作れる"],"next":["React + TypeScript で、Web アプリの画面を作る","Node.js で、型のついた Web API を作る","zod などで、外から来たデータの形を実行時にも確かめる"],"lessons":{"10":{"points":["クラスでは、フィールド（持っているデータ）の名前と型を先に書きます。","`private` をつけると、クラスの外からさわれなくなります。`readonly` は「最初に入れたら変えられない」です。","`constructor` は、実物を作るときに1回だけ呼ばれます。","TypeScript では、クラスを使わずに「型 + ふつうの関数」で書くこともよくあります。"],"files":[{"name":"main.ts","main":true,"shell":false,"code":"class Account {\n  readonly owner: string;        // あとから変えられない\n  private balance: number;       // クラスの外からはさわれない\n\n  constructor(owner: string, balance: number) {\n    this.owner = owner;\n    this.balance = balance;\n  }\n\n  deposit(amount: number): void {\n    this.balance += amount;\n  }\n\n  getBalance(): number {\n    return this.balance;\n  }\n\n  show(): void {\n    console.log(`${this.owner} の残高: ${this.balance} 円`);\n  }\n}\n\nconst a = new Account(\"さくら\", 1000);\nconst b = new Account(\"たろう\", 300);\n\na.deposit(500);      // a だけが増える\na.show();\nb.show();\nconsole.log(a.getBalance());\n// a.balance = 0;   ← private なので、エラーになります"}],"output":"さくら の残高: 1500 円\nたろう の残高: 300 円\n1500","run":"npx tsx main.ts"},"11":{"points":["`type` や `interface` で、オブジェクトの形に名前をつけられます。","`\"S\" | \"M\" | \"L\"` はユニオン型。「このうちのどれか」だけを入れられます。","`?` をつけたプロパティは「なくてもよい」。型は `string | undefined` になります。","`if` で確かめると、その中では型がしぼられます（型の絞りこみ）。","型は実行するときには消えます。型はあくまで「書いている間のチェック」です。"],"files":[{"name":"main.ts","main":true,"shell":false,"code":"// オブジェクトの形に名前をつける\ntype Size = \"S\" | \"M\" | \"L\";          // この3つのどれか\n\ninterface Item {\n  name: string;\n  price: number;\n  size: Size;\n  memo?: string;                      // なくてもよい\n}\n\nconst items: Item[] = [\n  { name: \"Tシャツ\", price: 1500, size: \"M\" },\n  { name: \"ぼうし\", price: 900, size: \"S\", memo: \"プレゼント用\" },\n];\n\nfunction describe(item: Item): string {\n  // memo はないかもしれないので、確かめてから使う\n  if (item.memo !== undefined) {\n    return `${item.name} (${item.size}) ${item.price} 円 ※${item.memo}`;\n  }\n  return `${item.name} (${item.size}) ${item.price} 円`;\n}\n\nfor (const item of items) {\n  console.log(describe(item));\n}\n\n// 数か文字列、どちらも受けとれる\nfunction toYen(value: number | string): string {\n  if (typeof value === \"number\") {\n    return value.toFixed(0) + \" 円\";    // ここでは number とわかっている\n  }\n  return value + \" 円\";                 // ここでは string\n}\nconsole.log(toYen(1500));\nconsole.log(toYen(\"千五百\"));"}],"title":"型を自分で作る","goal":"type・interface・ユニオン型を使って、データの形を型で表せるようになる。","intro":"TypeScript の本当の力は、「自分のプログラムのデータの形」を型として書けることです。型を書いておくと、エディタが入力をおぎなってくれ、形のまちがいをその場で教えてくれます。仕事の TypeScript は、まず型を作るところから始まります。","quiz":{"q":"type Size = \"S\" | \"M\" | \"L\"; のとき、const s: Size = \"XL\"; はどうなる？","choices":["\"XL\" が入る","実行する前にエラーになる","自動で \"L\" になる"],"answer":1,"why":"Size 型には \"S\" \"M\" \"L\" の3つしか入りません。それ以外を入れると、実行する前にエラーで教えてくれます。"},"task":"「題名 (title)、値段 (price)、読み終わったか (done。なくてもよい)」を持つ Book 型を作り、Book の配列から合計金額を出す関数を書いてみよう。","hint":"type Book = { title: string; price: number; done?: boolean }; の形です。","output":"Tシャツ (M) 1500 円\nぼうし (S) 900 円 ※プレゼント用\n1500 円\n千五百 円","run":"npx tsx main.ts"},"12":{"points":["外で使わせたい物に `export` をつけ、使う側は `import` で読みこみます。JavaScript と同じです。","型も `export` / `import` できます。型だけを読みこむときは `import type { User }` と書きます。","仕事のプロジェクトでは、`tsconfig.json` に TypeScript の設定を書きます。`\"strict\": true` で、きびしくチェックするのがおすすめです。","読みこむときの拡張子（`.ts` か `.js` か、書かないか）は、使う道具と設定で変わります。プロジェクトのやり方に合わせましょう。"],"files":[{"name":"greeting.ts","main":false,"shell":false,"code":"// あいさつを作る部品\nexport type User = { name: string };\n\nexport function hello(user: User): string {\n  return `こんにちは、${user.name}さん`;\n}\n\nexport function bye(user: User): string {\n  return `さようなら、${user.name}さん`;\n}"},{"name":"package.json","main":false,"shell":false,"code":"{\n  \"type\": \"module\"\n}"},{"name":"main.ts","main":true,"shell":false,"code":"import { hello, bye } from \"./greeting.ts\";\nimport type { User } from \"./greeting.ts\";\n\nconst user: User = { name: \"さくら\" };\nconsole.log(hello(user));\nconsole.log(bye(user));"}],"output":"こんにちは、さくらさん\nさようなら、さくらさん","run":"npx tsx main.ts"},"13":{"points":["`try` / `catch` / `finally` と `throw` の使い方は JavaScript と同じです。","`catch (e)` の `e` は `unknown` 型（何が来るかわからない）です。`e instanceof Error` で確かめてから `e.message` を使います。","「失敗するかもしれない」ことを、返す型で表すやり方もあります。`number | null` を返すと、呼ぶ側は null のチェックを忘れられません。"],"files":[{"name":"main.ts","main":true,"shell":false,"code":"function divide(a: number, b: number): number {\n  if (b === 0) {\n    throw new Error(\"0 で割ることはできません\");\n  }\n  return a / b;\n}\n\ntry {\n  console.log(\"10 ÷ 2 =\", divide(10, 2));\n  console.log(\"10 ÷ 0 =\", divide(10, 0));\n  console.log(\"ここは動きません\");\n} catch (e) {\n  if (e instanceof Error) {            // Error かどうか確かめる\n    console.log(\"エラー:\", e.message);\n  }\n}\n\n// 失敗を「返す型」で表すやり方\nfunction parseNumber(text: string): number | null {\n  const n = Number(text);\n  return Number.isNaN(n) ? null : n;\n}\n\nconst text = \"abc\";\nconst result = parseNumber(text);\nif (result === null) {\n  console.log(`\"${text}\" は数ではありません`);\n} else {\n  console.log(result + 1);             // ここでは number とわかっている\n}\nconsole.log(\"チェック終わり\");"}],"output":"10 ÷ 2 = 5\nエラー: 0 で割ることはできません\n\"abc\" は数ではありません\nチェック終わり","run":"npx tsx main.ts"},"14":{"points":["ファイルをあつかう道具は、Node.js の `node:fs` モジュールです。使い方は JavaScript と同じです。","Node.js の道具の型は、`npm install -D @types/node` で入れます。入れると、引数や返す値の型がわかるようになります。","`readFileSync(ファイル, \"utf8\")` の結果は `string` 型になります。","エラーの `code` を調べる前に、`e instanceof Error` などで形を確かめます。"],"files":[{"name":"main.ts","main":true,"shell":false,"code":"import { readFileSync, writeFileSync } from \"node:fs\";\n\nconst lines: string[] = [\"牛乳を買う\", \"宿題をする\", \"本を読む\"];\n\n// 書きこむ\nwriteFileSync(\"memo.txt\", lines.join(\"\\n\") + \"\\n\");\nconsole.log(lines.length, \"行 書きました\");\n\n// 読みこむ\nconst loaded: string[] = readFileSync(\"memo.txt\", \"utf8\").trim().split(\"\\n\");\nloaded.forEach((line, i) => {\n  console.log(`${i + 1}: ${line}`);\n});\n\n// ないファイルを開こうとしたとき\ntry {\n  readFileSync(\"ない.txt\", \"utf8\");\n} catch (e) {\n  if (e instanceof Error && \"code\" in e && e.code === \"ENOENT\") {\n    console.log(\"ない.txt は開けませんでした\");\n  } else {\n    throw e;      // 知らないエラーは、そのまま上に知らせる\n  }\n}"}],"output":"3 行 書きました\n1: 牛乳を買う\n2: 宿題をする\n3: 本を読む\nない.txt は開けませんでした","run":"npx tsx main.ts"},"15":{"points":["Node.js に入っているテストの道具 `node:test` を、TypeScript でもそのまま使えます。","`assert.equal(実際, 期待)` は、2つが同じでなければ「失敗」と知らせます。","TypeScript では「型のチェック」と「テスト」の両方でまちがいを探します。型は形のまちがいを、テストは動きのまちがいを見つけます。","仕事では Vitest や Jest がよく使われます。`expect(fizzbuzz(3)).toBe(\"Fizz\")` のように書きますが、考え方は同じです。"],"files":[{"name":"main.ts","main":true,"shell":false,"code":"import { test } from \"node:test\";\nimport assert from \"node:assert/strict\";\n\nfunction fizzbuzz(n: number): string {\n  if (n % 15 === 0) return \"FizzBuzz\";\n  if (n % 3 === 0) return \"Fizz\";\n  if (n % 5 === 0) return \"Buzz\";\n  return String(n);\n}\n\ntest(\"3 は Fizz\", () => {\n  assert.equal(fizzbuzz(3), \"Fizz\");\n});\n\ntest(\"5 は Buzz\", () => {\n  assert.equal(fizzbuzz(5), \"Buzz\");\n});\n\ntest(\"15 は FizzBuzz\", () => {\n  assert.equal(fizzbuzz(15), \"FizzBuzz\");\n});\n\ntest(\"7 は 7\", () => {\n  assert.equal(fizzbuzz(7), \"7\");\n});"}],"mode":"test","output":"✔ 3 は Fizz\n✔ 5 は Buzz\n✔ 15 は FizzBuzz\n✔ 7 は 7\nℹ tests 4\nℹ pass 4\nℹ fail 0","run":"npx tsx --test main.ts"},"16":{"points":["`\u003cT>` は「型の引数」。呼ぶときに渡した値から、T が何かを自動で決めてくれます。","`Promise\u003cnumber>` は「あとで number がとどく約束」。`async` 関数の返す型は、必ず `Promise\u003c〇〇>` になります。","`Record\u003cstring, number>` は「キーが string、値が number のオブジェクト」という型です。","状態を `kind` などの文字で分けておくと、`if` や `switch` で型がしぼられます（判別できるユニオン型）。"],"files":[{"name":"main.ts","main":true,"shell":false,"code":"// どんな型の配列でも使える。入れた型をおぼえている\nfunction first\u003cT>(list: T[]): T | undefined {\n  return list[0];\n}\nconsole.log(first([10, 20, 30]));      // number | undefined\nconsole.log(first([\"a\", \"b\"]));        // string | undefined\n\n// 成功か失敗かを、型で表す\ntype Result\u003cT> =\n  | { kind: \"ok\"; value: T }\n  | { kind: \"error\"; message: string };\n\nfunction wait(ms: number): Promise\u003cvoid> {\n  return new Promise((resolve) => setTimeout(resolve, ms));\n}\n\n// 時間のかかる処理のかわり（通信のつもり）\nasync function fetchPrice(name: string): Promise\u003cResult\u003cnumber>> {\n  await wait(50);\n  const prices: Record\u003cstring, number> = { りんご: 120, バナナ: 80 };\n  const price = prices[name];\n  if (price === undefined) {\n    return { kind: \"error\", message: `${name} は売っていません` };\n  }\n  return { kind: \"ok\", value: price };\n}\n\nasync function main(): Promise\u003cvoid> {\n  for (const name of [\"りんご\", \"ぶどう\"]) {\n    const result = await fetchPrice(name);\n    if (result.kind === \"ok\") {\n      console.log(`${name}: ${result.value} 円`);     // ここでは value が使える\n    } else {\n      console.log(`エラー: ${result.message}`);       // ここでは message が使える\n    }\n  }\n}\n\nmain();"}],"title":"ジェネリクスと非同期の型","goal":"「どんな型でも使えて、型をおぼえている」関数をジェネリクスで書けるようになる。Promise の型も読めるようになる。","intro":"ライブラリの型を読むと、\u003cT> という書き方がたくさん出てきます。これがジェネリクスで、「型を引数にする」しくみです。配列の Array\u003cT> も、非同期の Promise\u003cT> もジェネリクスです。読めるようになると、ライブラリの使い方が型からわかるようになります。","quiz":{"q":"function first\u003cT>(list: T[]): T | undefined を first([\"a\", \"b\"]) と呼ぶと、返す値の型は？","choices":["any","string | undefined（string か undefined）","number | undefined（number か undefined）"],"answer":1,"why":"渡した配列が string[] なので、T は string と決まります。だから返す型は string | undefined です。"},"task":"配列と数 n を受けとり、最初の n 個を返すジェネリクス関数 take\u003cT> を作って、数の配列と文字列の配列の両方でためしてみよう。","hint":"function take\u003cT>(list: T[], n: number): T[] { return list.slice(0, n); }","output":"10\na\nりんご: 120 円\nエラー: ぶどう は売っていません","run":"npx tsx main.ts"},"17":{"points":["TypeScript は `npm install -D typescript` で、プロジェクトごとに入れます。","`tsconfig.json` が設定ファイルです。`\"strict\": true` にして、きびしくチェックするのがおすすめです。","`npx tsc --noEmit` は、「型のチェックだけ」をします。エラーが 0 になるのが目標です。","`tsx` は、TypeScript をそのまま動かす道具です。ためすときに便利です。","公式の TypeScript Handbook と、エディタ（VS Code）でマウスをのせると出る型の表示が、いちばんの先生です。"],"files":[{"name":"shell","main":false,"shell":true,"code":"# プロジェクトを始めて、TypeScript を入れる\nnpm init -y\nnpm install -D typescript tsx @types/node\n\n# 設定ファイル tsconfig.json を作る\nnpx tsc --init\n\n# 型のチェックだけをする\nnpx tsc --noEmit\n\n# そのまま動かす\nnpx tsx main.ts\n\n# 書き方をそろえる・まちがいを探す\nnpm install -D prettier eslint typescript-eslint\nnpx prettier --write .\nnpx eslint ."}]},"18":{"points":["関数ごとに「何を受けとって、何を返すか」が型でわかります。型が、そのまま説明書になっています。","`Map\u003cstring, number>` で、「単語 → 回数」の辞書を表しています。","`[string, number][]` は、「文字列と数のペア」の配列という型です（タプル）。","空の文章が来たときは、エラーを投げて知らせています。"],"files":[{"name":"main.ts","main":true,"shell":false,"code":"/** 文章を、小文字の単語の配列にする */\nfunction splitWords(text: string): string[] {\n  return text\n    .toLowerCase()\n    .split(/\\s+/)\n    .map((raw) => raw.replace(/[^a-z]/g, \"\"))   // 記号を取る\n    .filter((word) => word !== \"\");\n}\n\nfunction countWords(words: string[]): Map\u003cstring, number> {\n  const counts = new Map\u003cstring, number>();\n  for (const w of words) {\n    counts.set(w, (counts.get(w) ?? 0) + 1);\n  }\n  return counts;\n}\n\n/** 回数の多い順（同じならアルファベット順）に n 個 */\nfunction top(counts: Map\u003cstring, number>, n: number): [string, number][] {\n  return [...counts.entries()]\n    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))\n    .slice(0, n);\n}\n\nfunction report(text: string): void {\n  const words = splitWords(text);\n  if (words.length === 0) {\n    throw new Error(\"単語がありません\");\n  }\n  const counts = countWords(words);\n  console.log(`全部で ${words.length} 語、${counts.size} 種類`);\n  for (const [word, count] of top(counts, 3)) {\n    console.log(`${word}: ${count}`);\n  }\n}\n\nreport(\"The cat saw the dog. The dog saw the bird!\");\n\ntry {\n  report(\"...\");\n} catch (e) {\n  if (e instanceof Error) {\n    console.log(\"エラー:\", e.message);\n  }\n}"}],"output":"全部で 10 語、5 種類\nthe: 4\ndog: 2\nsaw: 2\nエラー: 単語がありません","run":"npx tsx main.ts"},"01":{"points":["TypeScript は、JavaScript に「型」を足した言語です。JavaScript の書き方は、ほぼそのまま使えます。","`console.log( )` で表示します。`//` から行の終わりまではコメントです。","TypeScript のファイルは `.ts`。型をチェックしたあと JavaScript に変えて動かします。`tsx` を使うと、変換と実行を1回でやってくれます。","新しい Node.js（22.18 以上）は、`node main.ts` だけでも動かせます（型のチェックはしません）。"],"files":[{"name":"main.ts","main":true,"shell":false,"code":"// はじめてのプログラム\nconsole.log(\"こんにちは！\");\nconsole.log(\"プログラミングをはじめます。\");\nconsole.log(\"1 + 2 =\", 1 + 2);   // カンマで区切ると、間に空白が入ります"}],"output":"こんにちは！\nプログラミングをはじめます。\n1 + 2 = 3","run":"npx tsx main.ts"},"02":{"points":["変数の名前のあとに `: 型` を書きます。`string`（文字列）、`number`（数）、`boolean`（真・偽）が基本です。","型とちがう値を入れると、実行する前にエラーで教えてくれます。これが TypeScript を使ういちばんの理由です。","右の値から型がわかるときは、型を書かなくてもかまいません（型推論）。`const city = \"東京\"` は、自動で string になります。","`let`（入れなおせる）と `const`（入れなおせない）の使い分けは JavaScript と同じです。"],"files":[{"name":"main.ts","main":true,"shell":false,"code":"const name: string = \"さくら\";      // 文字列\nlet age: number = 15;               // 数\nconst height: number = 152.5;       // 小数も number\nconst isStudent: boolean = true;    // 真か偽か\n\nconsole.log(`名前: ${name}`);\nconsole.log(`年れい: ${age}`);\nconsole.log(`身長: ${height}`);\nconsole.log(`学生: ${isStudent}`);\n\nage = age + 1;                      // let の変数は入れなおせます\nconsole.log(`来年は ${age} さい`);\n\nconst city = \"東京\";                // 型を書かなくても string と決まる\nconsole.log(city);\n\n// age = \"十六\";   ← これを書くと、実行する前にエラーになります"}],"output":"名前: さくら\n年れい: 15\n身長: 152.5\n学生: true\n来年は 16 さい\n東京","run":"npx tsx main.ts"},"03":{"points":["計算のきまりは JavaScript と同じです。`/` は小数になり、切りすては `Math.floor( )` です。","JavaScript では `\"1\" + 2` が `\"12\"` になっても気づきにくいですが、TypeScript は「数のはずの所に文字列がある」ことを型で教えてくれます。","文字列を数に変えるときは `Number(\"42\")` を使います。","文字数は `.length` で調べます。"],"files":[{"name":"main.ts","main":true,"shell":false,"code":"const a: number = 7;\nconst b: number = 2;\nconsole.log(\"7 + 2 =\", a + b);\nconsole.log(\"7 - 2 =\", a - b);\nconsole.log(\"7 * 2 =\", a * b);\nconsole.log(\"7 / 2 =\", a / b);                 // 小数になる\nconsole.log(\"切りすて:\", Math.floor(a / b));\nconsole.log(\"7 % 2 =\", a % b);                 // あまり\n\nconst family: string = \"山田\";\nconst given: string = \"太郎\";\nconst full: string = family + \" \" + given;\nconsole.log(\"フルネーム:\", full);\nconsole.log(\"文字数:\", \"program\".length);\n\nconst input: string = \"42\";         // 入力された文字のつもり\nconst value: number = Number(input);\nconsole.log(value + 1);"}],"output":"7 + 2 = 9\n7 - 2 = 5\n7 * 2 = 14\n7 / 2 = 3.5\n切りすて: 3\n7 % 2 = 1\nフルネーム: 山田 太郎\n文字数: 7\n43","run":"npx tsx main.ts"},"04":{"points":["`if` の書き方は JavaScript と同じです。等しいかどうかは `===` で調べます。","「かつ」は `&&`、「または」は `||`、「〜でない」は `!` です。","型のちがう物を `===` でくらべると、TypeScript が「これは絶対に true になりません」と教えてくれます。","`条件 ? A : B` は、「条件が成り立てば A、そうでなければ B」という短い書き方です。"],"files":[{"name":"main.ts","main":true,"shell":false,"code":"const score: number = 72;\n\nif (score >= 80) {\n  console.log(\"よくできました\");\n} else if (score >= 60) {\n  console.log(\"合格\");\n} else {\n  console.log(\"もう少し\");\n}\n\nconst age: number = 15;\nconst hasTicket: boolean = true;\nif (age >= 12 && hasTicket) {\n  console.log(\"入場できます\");\n}\n\nconst label: string = age >= 18 ? \"大人\" : \"子ども\";\nconsole.log(label);"}],"output":"合格\n入場できます\n子ども","run":"npx tsx main.ts"},"05":{"points":["くりかえしの書き方は JavaScript と同じです。","配列の中身を1つずつ取り出すときは `for (const x of 配列)` が便利です。","`number[]` は「数の配列」という型です。","`continue` は「今回は飛ばして次へ」、`break` は「くりかえしをやめる」です。"],"files":[{"name":"main.ts","main":true,"shell":false,"code":"// 決まった回数くりかえす\nfor (let i = 1; i \u003c= 5; i++) {\n  console.log(i, \"回目\");\n}\n\n// 条件が成り立つあいだくりかえす\nlet count: number = 3;\nwhile (count > 0) {\n  console.log(count);\n  count--;\n}\nconsole.log(\"発射！\");\n\n// 1〜10 の偶数だけを足す\nlet total: number = 0;\nfor (let i = 1; i \u003c= 10; i++) {\n  if (i % 2 === 1) {\n    continue;      // 奇数は飛ばす\n  }\n  total += i;\n}\nconsole.log(\"偶数の合計:\", total);"}],"output":"1 回目\n2 回目\n3 回目\n4 回目\n5 回目\n3\n2\n1\n発射！\n偶数の合計: 30","run":"npx tsx main.ts"},"06":{"points":["関数では、引数の型と、返す値の型（`)` のあとの `: 型`）を書きます。","型を書いておくと、まちがった型で呼んだり、引数の数をまちがえたりしたときに、実行する前にわかります。","`name?: string` の `?` は「渡さなくてもよい引数」。`name = \"みなさん\"` は「渡されなかったときの値」です。","何も返さない関数は、返す型を `void` と書きます。"],"files":[{"name":"main.ts","main":true,"shell":false,"code":"function add(a: number, b: number): number {\n  return a + b;\n}\n\nfunction greet(name: string = \"みなさん\"): string {\n  return `こんにちは、${name}さん`;\n}\n\nconst isEven = (n: number): boolean => n % 2 === 0;   // アロー関数\n\nfunction show(message: string): void {                // 何も返さない\n  console.log(message);\n}\n\nshow(\"3 + 4 = \" + add(3, 4));\nshow(greet(\"さくら\"));\nshow(greet());\nshow(\"10 は偶数？ \" + isEven(10));\n// add(\"3\", 4);   ← 文字列を渡すと、実行する前にエラーになります"}],"output":"3 + 4 = 7\nこんにちは、さくらさん\nこんにちは、みなさんさん\n10 は偶数？ true","run":"npx tsx main.ts"},"07":{"points":["配列の型は `number[]` のように書きます（`Array\u003cnumber>` とも書けます）。","`number[]` の配列に文字列を `push` しようとすると、エラーで教えてくれます。","`readonly number[]` と書くと、「中身を変えない配列」という約束になります。","使い方（`push`、`length`、`sort` など）は JavaScript と同じです。"],"files":[{"name":"main.ts","main":true,"shell":false,"code":"const scores: number[] = [70, 85, 60];\nscores.push(90);                 // 後ろに追加\n\nconsole.log(\"最初の点数:\", scores[0]);\nconsole.log(\"最後の点数:\", scores.at(-1));\nconsole.log(\"人数:\", scores.length);\n\nlet total = 0;\nfor (const s of scores) {\n  total += s;\n}\nconsole.log(\"合計:\", total);\nconsole.log(\"平均:\", total / scores.length);\nconsole.log(\"最高点:\", Math.max(...scores));\n\nscores.sort((a, b) => a - b);    // 小さい順にならべかえる\nconsole.log(\"ならべかえ:\", scores);\n\nconst names: string[] = [\"さくら\", \"たろう\"];\nconsole.log(names.join(\"・\"));"}],"output":"最初の点数: 70\n最後の点数: 90\n人数: 4\n合計: 305\n平均: 76.25\n最高点: 90\nならべかえ: [ 60, 70, 85, 90 ]\nさくら・たろう","run":"npx tsx main.ts"},"08":{"points":["`Map\u003cstring, number>` は「キーが string、値が number」の辞書です。","`get` の結果の型は `number | undefined`（数か、ないか）になります。「ないかもしれない」ことを、型が思い出させてくれます。","`??` は「左が null か undefined なら右を使う」という意味です。","形の決まったデータは、オブジェクトの型を書いて表します（くわしくは「型を自分で作る」で）。"],"files":[{"name":"main.ts","main":true,"shell":false,"code":"const prices = new Map\u003cstring, number>();\nprices.set(\"りんご\", 120);\nprices.set(\"バナナ\", 80);\nprices.set(\"みかん\", 60);\n\nconsole.log(\"りんご は\", prices.get(\"りんご\"), \"円\");\n\nif (prices.has(\"ぶどう\")) {\n  console.log(\"ぶどう は\", prices.get(\"ぶどう\"), \"円\");\n} else {\n  console.log(\"ぶどう はありません\");\n}\n\nconst peach: number | undefined = prices.get(\"もも\");   // ないかもしれない\nconsole.log(\"もも:\", peach ?? \"不明\");\n\nconsole.log(\"--- 一覧 ---\");\nfor (const [name, price] of prices) {\n  console.log(`${name}: ${price} 円`);\n}\nconsole.log(\"種類:\", prices.size);\n\n// 形の決まったデータ\nconst user: { name: string; age: number } = { name: \"さくら\", age: 15 };\nconsole.log(user.name, user.age);"}],"output":"りんご は 120 円\nぶどう はありません\nもも: 不明\n--- 一覧 ---\nりんご: 120 円\nバナナ: 80 円\nみかん: 60 円\n種類: 3\nさくら 15","run":"npx tsx main.ts"},"09":{"points":["文字列の使い方は JavaScript と同じです。`split` の結果は `string[]` 型になります。","`includes` で「ふくまれているか」、`trim` で前後の空白を取ります。","`fruits[0]` のような取り出しは、空の配列だと `undefined` になります。きびしい設定（`noUncheckedIndexedAccess`）にすると、それも型で教えてくれます。","メソッド名を打ちまちがえても（`toUppercase` など）、すぐにエラーで教えてくれます。"],"files":[{"name":"main.ts","main":true,"shell":false,"code":"const text: string = \"apple,banana,cherry\";\n\nconst fruits: string[] = text.split(\",\");   // カンマで分ける\nconsole.log(fruits.length, \"個\");\nconsole.log(\"1番目:\", fruits[0]);\nconsole.log(\"大文字:\", fruits[0]?.toUpperCase());\nconsole.log(\"banana をふくむ？\", text.includes(\"banana\"));\nconsole.log(\"つなぐ:\", fruits.join(\" / \"));\nconsole.log(\"置きかえ:\", text.replace(\"cherry\", \"melon\"));\n\nconst messy: string = \"   hello   \";\nconsole.log(\"[\" + messy.trim() + \"]\");      // 前後の空白を取る\nconsole.log(\"先頭3文字:\", text.slice(0, 3));"}],"output":"3 個\n1番目: apple\n大文字: APPLE\nbanana をふくむ？ true\nつなぐ: apple / banana / cherry\n置きかえ: apple,banana,melon\n[hello]\n先頭3文字: app","run":"npx tsx main.ts"}}},{"id":"php","name":"PHP","type":"動的型","exec":"インタプリタ","tagline":"Web サイトのサーバー側を作る言語","about":"WordPress をはじめ、世界中のとても多くの Web サイトが PHP で動いています。Web サーバーの上で動き、見る人ごとに HTML を作って返すのが得意です。","run":"php main.php","flow":[["main.php","あなたが書く"],["php","インタプリタ","tool"],["その場で実行","Web なら HTML を作る"]],"flowNote":"Web サーバーの上で動いて、見る人ごとに HTML を作って返すのが得意です。","ready":["連想配列と配列関数を使って、データを自由に加工できる","型宣言をつけた関数とクラスを書ける","PDO のプリペアドステートメントで、安全にデータベースを使える","Composer でライブラリを入れ、PHPUnit でテストを書ける"],"next":["フォームから受けとって、データベースに保存する Web アプリを作る","Laravel で、ログインつきの Web アプリを作る","セッション・CSRF 対策など、Web の安全のきほんを学ぶ"],"lessons":{"10":{"points":["`class` は「設計図」。`new Account(\"さくら\", 1000)` で、設計図から実物（インスタンス）を作ります。","`__construct` は、実物を作るときに1回だけ呼ばれます。引数に `private` などをつけると、そのままプロパティ（持っているデータ）になります。","`$this` は「この実物自身」。プロパティやメソッドは `->` で使います（`$a->show()`）。","`private` は、クラスの外からさわれないという意味です。"],"files":[{"name":"main.php","main":true,"shell":false,"code":"\u003c?php\ndeclare(strict_types=1);\n\nclass Account\n{\n    // 引数に private / public をつけると、そのままプロパティになる\n    public function __construct(\n        public readonly string $owner,\n        private int $balance,\n    ) {\n    }\n\n    public function deposit(int $amount): void\n    {\n        $this->balance += $amount;\n    }\n\n    public function getBalance(): int\n    {\n        return $this->balance;\n    }\n\n    public function show(): void\n    {\n        echo \"{$this->owner} の残高: {$this->balance} 円\\n\";\n    }\n}\n\n$a = new Account(\"さくら\", 1000);\n$b = new Account(\"たろう\", 300);\n\n$a->deposit(500);      // $a だけが増える\n$a->show();\n$b->show();\necho $a->getBalance(), \"\\n\";"}],"output":"さくら の残高: 1500 円\nたろう の残高: 300 円\n1500","run":"php main.php"},"11":{"points":["`array_map` は「全部を作りかえた新しい配列」、`array_filter` は「条件に合うものだけの配列」を作ります。","`array_filter` の結果は、もとの番号がそのまま残ります。0 から番号をふりなおすには `array_values` を使います。","`array_column` は、「連想配列の配列」から1つの列だけを取り出します。","`usort` は、自分で決めた順番でならべかえます。`\u003c=>` は「小さい・同じ・大きい」を -1・0・1 で返す演算子です。","`in_array`（値があるか）、`array_keys`（キーの一覧）、`array_merge`（合体）もよく使います。"],"files":[{"name":"main.php","main":true,"shell":false,"code":"\u003c?php\ndeclare(strict_types=1);\n\n$nums = [1, 2, 3, 4, 5, 6];\n\n$doubled = array_map(fn($n) => $n * 2, $nums);                  // 作りかえる\n$evens = array_values(array_filter($nums, fn($n) => $n % 2 === 0));   // しぼる\necho implode(\", \", $doubled), \"\\n\";\necho implode(\", \", $evens), \"\\n\";\necho \"合計: \", array_sum($nums), \"\\n\";\n\n// 連想配列の配列（データベースの結果は、この形で来る）\n$items = [\n    [\"name\" => \"りんご\", \"price\" => 120],\n    [\"name\" => \"バナナ\", \"price\" => 80],\n    [\"name\" => \"メロン\", \"price\" => 900],\n];\n\n// 1つの列だけ取り出す\n$names = array_column($items, \"name\");\necho implode(\"・\", $names), \"\\n\";\n\n// 値段の高い順にならべかえる\nusort($items, fn($a, $b) => $b[\"price\"] \u003c=> $a[\"price\"]);\nforeach ($items as $item) {\n    echo \"{$item['name']}: {$item['price']} 円\\n\";\n}\n\n// あるかどうか / 合体\nvar_dump(in_array(\"バナナ\", $names, true));\n$all = array_merge($nums, [7, 8]);\necho count($all), \" 個\\n\";"}],"title":"配列を使いこなす","goal":"「連想配列の配列」を、array_map・array_filter・usort などで自由に加工できるようになる。","intro":"PHP の仕事では、データベースから取り出したデータも、フォームから送られたデータも、ほとんどが「連想配列の配列」の形でやってきます。それをしぼる、作りかえる、ならべかえる。PHP を書く時間の多くは、配列の加工です。配列用の関数を知っているかどうかで、書く速さが大きく変わります。","quiz":{"q":"array_map(fn($n) => $n * 2, [1, 2, 3]) の結果は？","choices":["[2, 4, 6]","12","[1, 2, 3, 1, 2, 3]"],"answer":0,"why":"array_map は、配列の全部の要素に関数を当てはめた「新しい配列」を作ります。それぞれ 2 倍になるので [2, 4, 6] です。"},"task":"商品の配列から、値段が 100 円以上の物だけを取り出し、値段の高い順にならべて、名前を表示してみよう。","hint":"array_filter でしぼり、usort で fn($a, $b) => $b[\"price\"] \u003c=> $a[\"price\"] とならべます。","output":"2, 4, 6, 8, 10, 12\n2, 4, 6\n合計: 21\nりんご・バナナ・メロン\nメロン: 900 円\nりんご: 120 円\nバナナ: 80 円\nbool(true)\n8 個","run":"php main.php"},"12":{"points":["ほかのファイルを読みこむには `require_once` を使います。`__DIR__` は「このファイルがあるフォルダ」です。","`namespace` で、関数やクラスの名前に「名字」をつけます。ほかの人のコードと名前がぶつからなくなります。","使う側は `use function App\\Greeting\\hello;` のように書いてから使います。","仕事のプロジェクトでは、Composer の「オートロード」が、クラスのファイルを自動で読みこんでくれます。`require_once` をならべることはあまりありません。"],"files":[{"name":"greeting.php","main":false,"shell":false,"code":"\u003c?php\n// あいさつを作る部品\ndeclare(strict_types=1);\n\nnamespace App\\Greeting;\n\nfunction hello(string $name): string\n{\n    return \"こんにちは、{$name}さん\";\n}\n\nfunction bye(string $name): string\n{\n    return \"さようなら、{$name}さん\";\n}"},{"name":"main.php","main":true,"shell":false,"code":"\u003c?php\ndeclare(strict_types=1);\n\nrequire_once __DIR__ . \"/greeting.php\";\n\nuse function App\\Greeting\\hello;\nuse function App\\Greeting\\bye;\n\necho hello(\"さくら\"), \"\\n\";\necho bye(\"さくら\"), \"\\n\";"}],"output":"こんにちは、さくらさん\nさようなら、さくらさん","run":"php main.php"},"13":{"points":["エラー（例外）が起きるかもしれない所を `try { }` に書き、起きたときの対応を `catch (例外の型 $e) { }` に書きます。","自分で例外を起こすには `throw new InvalidArgumentException(\"説明\")` と書きます。","`finally { }` の中は、例外が起きても起きなくても、最後に必ず動きます。","文字列が数かどうかは `is_numeric( )` で確かめられます。","開発中は、エラーを全部表示する設定（`error_reporting(E_ALL)`）にしておくと、まちがいに早く気づけます。"],"files":[{"name":"main.php","main":true,"shell":false,"code":"\u003c?php\ndeclare(strict_types=1);\n\nfunction divide(int $a, int $b): float\n{\n    if ($b === 0) {\n        throw new InvalidArgumentException(\"0 で割ることはできません\");\n    }\n    return $a / $b;\n}\n\ntry {\n    echo \"10 ÷ 2 = \" . divide(10, 2) . \"\\n\";\n    echo \"10 ÷ 0 = \" . divide(10, 0) . \"\\n\";\n    echo \"ここは動きません\\n\";\n} catch (InvalidArgumentException $e) {\n    echo \"エラー: \", $e->getMessage(), \"\\n\";\n}\n\n$text = \"abc\";\ntry {\n    if (!is_numeric($text)) {\n        throw new UnexpectedValueException(\"\\\"{$text}\\\" は数ではありません\");\n    }\n    echo (int) $text, \"\\n\";\n} catch (UnexpectedValueException $e) {\n    echo $e->getMessage(), \"\\n\";\n} finally {\n    echo \"チェック終わり\\n\";\n}"}],"output":"10 ÷ 2 = 5\nエラー: 0 で割ることはできません\n\"abc\" は数ではありません\nチェック終わり","run":"php main.php"},"14":{"points":["`file_put_contents` で書きこみ、`file_get_contents` で全部を文字列として読みこみます。手軽でよく使います。","`file( )` は、1行ずつの配列として読みこみます。","ファイルがあるかどうかは `file_exists( )` で先に確かめられます。","`file_get_contents` は、失敗すると `false` を返して警告を出します。`=== false` で確かめましょう。"],"files":[{"name":"main.php","main":true,"shell":false,"code":"\u003c?php\ndeclare(strict_types=1);\n\n$lines = [\"牛乳を買う\", \"宿題をする\", \"本を読む\"];\n\n// 書きこむ\nfile_put_contents(\"memo.txt\", implode(\"\\n\", $lines) . \"\\n\");\necho count($lines), \" 行 書きました\\n\";\n\n// 読みこむ（1行ずつの配列になる）\n$loaded = file(\"memo.txt\", FILE_IGNORE_NEW_LINES);\nforeach ($loaded as $i => $line) {\n    echo $i + 1, \": {$line}\\n\";\n}\n\n// ないファイルを開こうとしたとき\nif (!file_exists(\"ない.txt\")) {\n    echo \"ない.txt は開けませんでした\\n\";\n}"}],"output":"3 行 書きました\n1: 牛乳を買う\n2: 宿題をする\n3: 本を読む\nない.txt は開けませんでした","run":"php main.php"},"15":{"points":["ここでは、しくみがわかるように、テストの道具を自分で作っています。「実際の値」と「期待する値」を `===` でくらべているだけです。","仕事では PHPUnit を使います。`$this->assertSame(\"Fizz\", fizzbuzz(3));` のように書きます。","PHPUnit は Composer で入れて、`vendor/bin/phpunit` で動かします（「道具をそろえる」で出てきます）。","テストしやすいコードは、「表示する」と「計算する」が分かれています。`fizzbuzz` は文字列を返すだけなので、テストがかんたんです。"],"files":[{"name":"main.php","main":true,"shell":false,"code":"\u003c?php\ndeclare(strict_types=1);\n\nfunction fizzbuzz(int $n): string\n{\n    if ($n % 15 === 0) {\n        return \"FizzBuzz\";\n    }\n    if ($n % 3 === 0) {\n        return \"Fizz\";\n    }\n    if ($n % 5 === 0) {\n        return \"Buzz\";\n    }\n    return (string) $n;\n}\n\n$passed = 0;\n$failed = 0;\n\n// 実際の値と、期待する値をくらべる\nfunction check(string $name, string $actual, string $expected): void\n{\n    global $passed, $failed;\n    if ($actual === $expected) {\n        $passed++;\n        echo \"OK   {$name}\\n\";\n    } else {\n        $failed++;\n        echo \"NG   {$name}: 期待 {$expected} / 実際 {$actual}\\n\";\n    }\n}\n\ncheck(\"3 は Fizz\", fizzbuzz(3), \"Fizz\");\ncheck(\"5 は Buzz\", fizzbuzz(5), \"Buzz\");\ncheck(\"15 は FizzBuzz\", fizzbuzz(15), \"FizzBuzz\");\ncheck(\"7 は 7\", fizzbuzz(7), \"7\");\necho \"成功 {$passed} / 失敗 {$failed}\\n\";"}],"output":"OK   3 は Fizz\nOK   5 は Buzz\nOK   15 は FizzBuzz\nOK   7 は 7\n成功 4 / 失敗 0","run":"php main.php"},"16":{"points":["`PDO` は、データベースをあつかう PHP の標準の道具です。MySQL でも PostgreSQL でも SQLite でも、同じ書き方で使えます。","値を入れる所を `?` にした SQL を `prepare` し、`execute` で値を渡します（プリペアドステートメント）。入力を SQL に直接つなげてはいけません。","画面に出すときは、必ず `htmlspecialchars( )` を通します。入力にまぜられた `\u003cscript>` などが、ただの文字になります（XSS 対策）。","フォームの値は `$_POST[\"name\"]` や `$_GET[\"id\"]` で受けとります。受けとった値は、必ず確かめてから使います。","ここでは、ファイルもサーバーもいらない SQLite の「メモリの中のデータベース」でためしています。"],"files":[{"name":"main.php","main":true,"shell":false,"code":"\u003c?php\ndeclare(strict_types=1);\n\n// メモリの中にデータベースを作る（ためすのに便利）\n$db = new PDO(\"sqlite::memory:\");\n$db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);   // 失敗したら例外にする\n\n$db->exec(\"CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT, age INTEGER)\");\n\n// 入れる: 値の所は ? にして、あとから渡す\n$insert = $db->prepare(\"INSERT INTO users (name, age) VALUES (?, ?)\");\n$insert->execute([\"さくら\", 15]);\n$insert->execute([\"たろう\", 17]);\n$insert->execute([\"\u003cscript>alert(1)\u003c/script>\", 20]);   // わるい入力のつもり\n\n// 取り出す\n$select = $db->prepare(\"SELECT name, age FROM users WHERE age >= ? ORDER BY age\");\n$select->execute([16]);\n$rows = $select->fetchAll(PDO::FETCH_ASSOC);     // 連想配列の配列になる\n\nforeach ($rows as $row) {\n    // 画面に出す前に、必ず htmlspecialchars を通す\n    $safe = htmlspecialchars($row[\"name\"], ENT_QUOTES, \"UTF-8\");\n    echo \"{$safe} ({$row['age']})\\n\";\n}\n\n// わるい入力で検索しても、ただの文字としてあつかわれる\n$attack = \"' OR '1'='1\";\n$find = $db->prepare(\"SELECT COUNT(*) FROM users WHERE name = ?\");\n$find->execute([$attack]);\necho \"見つかった数: \", $find->fetchColumn(), \"\\n\";"}],"title":"データベースと安全な Web","goal":"PDO でデータベースを使い、プリペアドステートメントと htmlspecialchars で、安全にデータをあつかえるようになる。","intro":"PHP の仕事のほとんどは、「フォームから受けとる → データベースに入れる・取り出す → HTML にして返す」という流れです。このとき、入力をそのまま SQL や HTML にまぜると、データをぬすまれたり書きかえられたりする、大きな事故になります。安全な書き方は決まっているので、最初から正しい形でおぼえましょう。","quiz":{"q":"ユーザーが入力した名前で検索するとき、安全な書き方は？","choices":["\"SELECT * FROM users WHERE name = '$name'\" と文字列に直接入れる","prepare で ? を使った SQL を作り、execute で値を渡す","入力から空白を取ってから文字列に入れる"],"answer":1,"why":"文字列に直接入れると、入力に SQL を書かれて悪用されます（SQL インジェクション）。prepare と execute を使えば、入力は必ず「ただの値」としてあつかわれます。"},"task":"books テーブル（title と price）を作り、3冊入れて、1000 円以上の本だけを値段の高い順に表示してみよう。","hint":"SELECT title, price FROM books WHERE price >= ? ORDER BY price DESC を prepare して、execute([1000]) とします。","output":"たろう (17)\n&lt;script&gt;alert(1)&lt;/script&gt; (20)\n見つかった数: 0","run":"php main.php"},"17":{"points":["Composer は、PHP のライブラリを入れて管理する道具です。使うライブラリは `composer.json` に書かれます。","入れたライブラリは `vendor` フォルダに入ります。`require \"vendor/autoload.php\";` の1行で、全部使えるようになります。","`php -S localhost:8000` で、ためすための Web サーバーがすぐに動きます。","PHPStan はまちがいを探し、PHP-CS-Fixer は書き方をそろえます。書き方のきまりは PSR-12 が標準です。","仕事では、Laravel などのフレームワークを使うことがほとんどです。この先の大きな目標になります。"],"files":[{"name":"shell","main":false,"shell":true,"code":"# バージョンを確かめる\nphp --version\n\n# 文法のまちがいだけを調べる\nphp -l main.php\n\n# ためすための Web サーバーを動かす（ブラウザで http://localhost:8000 を開く）\nphp -S localhost:8000\n\n# Composer でプロジェクトを始めて、ライブラリを入れる\ncomposer init\ncomposer require --dev phpunit/phpunit phpstan/phpstan friendsofphp/php-cs-fixer\n\n# テスト・まちがい探し・書き方をそろえる\nvendor/bin/phpunit tests\nvendor/bin/phpstan analyse src\nvendor/bin/php-cs-fixer fix"}]},"18":{"points":["「分ける → 数える → ならべる → 表示する」と、仕事ごとに関数を分けています。","`array_count_values` は、「同じ値が何個あるか」を数えて連想配列にしてくれる関数です。","`uksort` と `\u003c=>` で、「回数の多い順、同じならアルファベット順」にしています。","空の文章が来たときは、例外を投げて知らせています。"],"files":[{"name":"main.php","main":true,"shell":false,"code":"\u003c?php\ndeclare(strict_types=1);\n\n/** 文章を、小文字の単語の配列にする */\nfunction splitWords(string $text): array\n{\n    $words = [];\n    foreach (preg_split('/\\s+/', strtolower($text)) as $raw) {\n        $word = preg_replace('/[^a-z]/', '', $raw);    // 記号を取る\n        if ($word !== \"\") {\n            $words[] = $word;\n        }\n    }\n    return $words;\n}\n\n/** 回数の多い順（同じならアルファベット順）に n 個 */\nfunction top(array $counts, int $n): array\n{\n    uksort($counts, fn($a, $b) => [$counts[$b], $a] \u003c=> [$counts[$a], $b]);\n    return array_slice($counts, 0, $n, true);\n}\n\nfunction report(string $text): void\n{\n    $words = splitWords($text);\n    if (count($words) === 0) {\n        throw new InvalidArgumentException(\"単語がありません\");\n    }\n    $counts = array_count_values($words);      // 単語 => 回数\n    echo \"全部で \", count($words), \" 語、\", count($counts), \" 種類\\n\";\n    foreach (top($counts, 3) as $word => $count) {\n        echo \"{$word}: {$count}\\n\";\n    }\n}\n\nreport(\"The cat saw the dog. The dog saw the bird!\");\n\ntry {\n    report(\"...\");\n} catch (InvalidArgumentException $e) {\n    echo \"エラー: \", $e->getMessage(), \"\\n\";\n}"}],"output":"全部で 10 語、5 種類\nthe: 4\ndog: 2\nsaw: 2\nエラー: 単語がありません","run":"php main.php"},"01":{"points":["PHP のコードは `\u003c?php` から始めます。PHP だけのファイルなら、終わりの `?>` は書きません。","`echo` で表示します。自動では改行しないので、`\\n` や `PHP_EOL` を書きます。","文の終わりには `;` が必要です。`//` と `#` から行の終わりまではコメントです。","PHP はもともと Web ページを作るための言語です。Web サーバーで動かすと、`echo` した物がブラウザに送られます。このコースではまず、コマンド（`php main.php`）で動かします。"],"files":[{"name":"main.php","main":true,"shell":false,"code":"\u003c?php\n// はじめてのプログラム\necho \"こんにちは！\\n\";\necho \"プログラミングをはじめます。\\n\";\necho \"1 + 2 = \", 1 + 2, \"\\n\";   // カンマで区切って、いくつも表示できます"}],"output":"こんにちは！\nプログラミングをはじめます。\n1 + 2 = 3","run":"php main.php"},"02":{"points":["変数の名前は、必ず `$` で始めます。型は書かなくても、入れた値で決まります。","ダブルクォート `\" \"` の文字列の中では、`{$name}` が値に置きかわります。シングルクォート `' '` では置きかわりません。","真・偽は `true` / `false`。`echo` すると、true は `1`、false は何も表示されません。","中身と型をくわしく見たいときは `var_dump($x)` を使います。調べものの基本の道具です。"],"files":[{"name":"main.php","main":true,"shell":false,"code":"\u003c?php\n$name = \"さくら\";      // 文字列 (string)\n$age = 15;             // 整数 (int)\n$height = 152.5;       // 小数 (float)\n$isStudent = true;     // 真か偽か (bool)\n\necho \"名前: {$name}\\n\";\necho \"年れい: {$age}\\n\";\necho \"身長: {$height}\\n\";\necho \"学生: \" . ($isStudent ? \"はい\" : \"いいえ\") . \"\\n\";\n\n$age = $age + 1;       // 変数は、あとから入れなおせます\necho \"来年は {$age} さい\\n\";\n\nvar_dump($age);        // 型と中身を表示\nvar_dump($isStudent);"}],"output":"名前: さくら\n年れい: 15\n身長: 152.5\n学生: はい\n来年は 16 さい\nint(16)\nbool(true)","run":"php main.php"},"03":{"points":["`/` は、割り切れなければ小数になります。整数の割り算（切りすて）は `intdiv( )` です。","`%` はあまり、`**` は累乗です。","文字列をつなぐのは `.`（ドット）です。`+` は数の足し算だけに使います。","`strlen` はバイト数を返します。日本語の文字数を数えるときは `mb_strlen` を使います。"],"files":[{"name":"main.php","main":true,"shell":false,"code":"\u003c?php\n$a = 7;\n$b = 2;\necho \"7 + 2 = \", $a + $b, \"\\n\";\necho \"7 - 2 = \", $a - $b, \"\\n\";\necho \"7 * 2 = \", $a * $b, \"\\n\";\necho \"7 / 2 = \", $a / $b, \"\\n\";             // 小数になる\necho \"切りすて: \", intdiv($a, $b), \"\\n\";\necho \"7 % 2 = \", $a % $b, \"\\n\";             // あまり\n\n$family = \"山田\";\n$given = \"太郎\";\n$full = $family . \" \" . $given;             // . でつなぐ\necho \"フルネーム: {$full}\\n\";\necho \"文字数: \", strlen(\"program\"), \"\\n\";\necho \"日本語の文字数: \", mb_strlen($full), \"\\n\";"}],"output":"7 + 2 = 9\n7 - 2 = 5\n7 * 2 = 14\n7 / 2 = 3.5\n切りすて: 3\n7 % 2 = 1\nフルネーム: 山田 太郎\n文字数: 7\n日本語の文字数: 5","run":"php main.php"},"04":{"points":["`if (条件) { }` の形です。次の条件は `elseif`（つなげて書く）、「どれでもないとき」は `else` です。","等しいかどうかは `===` で調べます。`==` は型を勝手に変えてくらべるので（`\"1\" == 1` が true）、使わないのが安全です。","「かつ」は `&&`、「または」は `||`、「〜でない」は `!` です。","`match` は、値によって結果を選ぶ書き方です。`===` でくらべてくれます。"],"files":[{"name":"main.php","main":true,"shell":false,"code":"\u003c?php\n$score = 72;\n\nif ($score >= 80) {\n    echo \"よくできました\\n\";\n} elseif ($score >= 60) {\n    echo \"合格\\n\";\n} else {\n    echo \"もう少し\\n\";\n}\n\n$age = 15;\n$hasTicket = true;\nif ($age >= 12 && $hasTicket) {\n    echo \"入場できます\\n\";\n}\n\nvar_dump(\"1\" == 1);     // true（型を勝手に変えてしまう）\nvar_dump(\"1\" === 1);    // false（型もくらべる）\n\n$size = \"M\";\n$label = match ($size) {\n    \"S\" => \"小さい\",\n    \"M\" => \"ふつう\",\n    default => \"大きい\",\n};\necho $label, \"\\n\";"}],"output":"合格\n入場できます\nbool(true)\nbool(false)\nふつう","run":"php main.php"},"05":{"points":["`for (はじめ; 続ける条件; 毎回すること)` の3つを `;` で区切ります。","配列の中身を1つずつ取り出すときは `foreach ($配列 as $x)` を使います。PHP でいちばんよく使うくりかえしです。","`while (条件)` は、条件が成り立つあいだくりかえします。","`continue` は「今回は飛ばして次へ」、`break` は「くりかえしをやめる」です。"],"files":[{"name":"main.php","main":true,"shell":false,"code":"\u003c?php\n// 決まった回数くりかえす\nfor ($i = 1; $i \u003c= 5; $i++) {\n    echo \"{$i} 回目\\n\";\n}\n\n// 条件が成り立つあいだくりかえす\n$count = 3;\nwhile ($count > 0) {\n    echo $count, \"\\n\";\n    $count--;\n}\necho \"発射！\\n\";\n\n// 1〜10 の偶数だけを足す\n$total = 0;\nfor ($i = 1; $i \u003c= 10; $i++) {\n    if ($i % 2 === 1) {\n        continue;      // 奇数は飛ばす\n    }\n    $total += $i;\n}\necho \"偶数の合計: {$total}\\n\";"}],"output":"1 回目\n2 回目\n3 回目\n4 回目\n5 回目\n3\n2\n1\n発射！\n偶数の合計: 30","run":"php main.php"},"06":{"points":["関数は `function 名前(引数) { }` で作り、`return` で結果を返します。","`int $a` や `): int` のように、引数と返す値の型を書けます。書いておくと、まちがった型を渡したときにエラーで教えてくれます。","ファイルの先頭に `declare(strict_types=1);` と書くと、型を勝手に変えずに、きびしくチェックします。仕事のコードではよく書かれます。","`fn($n) => $n % 2 === 0` は、1行で書ける「アロー関数」です。"],"files":[{"name":"main.php","main":true,"shell":false,"code":"\u003c?php\ndeclare(strict_types=1);      // 型をきびしくチェックする\n\nfunction add(int $a, int $b): int\n{\n    return $a + $b;\n}\n\nfunction greet(string $name = \"みなさん\"): string\n{\n    return \"こんにちは、{$name}さん\";\n}\n\n$isEven = fn(int $n): bool => $n % 2 === 0;   // アロー関数\n\necho \"3 + 4 = \", add(3, 4), \"\\n\";\necho greet(\"さくら\"), \"\\n\";\necho greet(), \"\\n\";\necho \"10 は偶数？ \", $isEven(10) ? \"はい\" : \"いいえ\", \"\\n\";\necho \"7 は偶数？ \", $isEven(7) ? \"はい\" : \"いいえ\", \"\\n\";"}],"output":"3 + 4 = 7\nこんにちは、さくらさん\nこんにちは、みなさんさん\n10 は偶数？ はい\n7 は偶数？ いいえ","run":"php main.php"},"07":{"points":["配列は `[ ]` で作ります。番号は 0 から始まります。","`$scores[] = 90;` で後ろに追加、`count( )` で個数です。","`array_sum`、`max`、`min`、`sort` など、配列用の関数がたくさんあります。","中身をまとめて見たいときは `print_r( )` が便利です。`implode` は、配列をつないで文字列にします。"],"files":[{"name":"main.php","main":true,"shell":false,"code":"\u003c?php\n$scores = [70, 85, 60];\n$scores[] = 90;                  // 後ろに追加\n\necho \"最初の点数: \", $scores[0], \"\\n\";\necho \"人数: \", count($scores), \"\\n\";\n\n$total = 0;\nforeach ($scores as $s) {\n    $total += $s;\n}\necho \"合計: {$total}\\n\";\necho \"平均: \", $total / count($scores), \"\\n\";\necho \"最高点: \", max($scores), \"\\n\";\n\nsort($scores);                   // 小さい順にならべかえる\necho \"ならべかえ: \", implode(\", \", $scores), \"\\n\";"}],"output":"最初の点数: 70\n人数: 4\n合計: 305\n平均: 76.25\n最高点: 90\nならべかえ: 60, 70, 85, 90","run":"php main.php"},"08":{"points":["PHP の配列は、キーを文字列にもできます（連想配列）。`[\"りんご\" => 120]` のように `=>` で組にします。","`foreach ($prices as $name => $price)` で、キーと値をいっしょに取り出せます。","キーがあるかどうかは `isset( )` や `array_key_exists( )` で調べます。","`??` は「左がない（または null）なら右を使う」という意味です。","連想配列は、入れた順番をおぼえています。"],"files":[{"name":"main.php","main":true,"shell":false,"code":"\u003c?php\n$prices = [\"りんご\" => 120, \"バナナ\" => 80];\n$prices[\"みかん\"] = 60;          // 追加\n\necho \"りんご は \", $prices[\"りんご\"], \" 円\\n\";\n\nif (isset($prices[\"ぶどう\"])) {\n    echo \"ぶどう は \", $prices[\"ぶどう\"], \" 円\\n\";\n} else {\n    echo \"ぶどう はありません\\n\";\n}\n\necho \"もも: \", $prices[\"もも\"] ?? \"不明\", \"\\n\";   // なければ「不明」\n\necho \"--- 一覧 ---\\n\";\nforeach ($prices as $name => $price) {\n    echo \"{$name}: {$price} 円\\n\";\n}\necho \"種類: \", count($prices), \"\\n\";"}],"output":"りんご は 120 円\nぶどう はありません\nもも: 不明\n--- 一覧 ---\nりんご: 120 円\nバナナ: 80 円\nみかん: 60 円\n種類: 3","run":"php main.php"},"09":{"points":["`explode` で分けて配列に、`implode` で配列をつないで文字列にします。","`str_contains` で「ふくまれているか」、`str_replace` で置きかえ、`trim` で前後の空白を取ります。","日本語をあつかうときは、`mb_` で始まる関数（`mb_strlen`、`mb_substr` など）を使います。`strlen` や `substr` はバイト単位なので、文字がこわれます。","関数によって引数の順番がちがいます。使う前に公式マニュアル（php.net。日本語あり）で確かめる習慣をつけましょう。"],"files":[{"name":"main.php","main":true,"shell":false,"code":"\u003c?php\n$text = \"apple,banana,cherry\";\n\n$fruits = explode(\",\", $text);            // カンマで分ける\necho count($fruits), \" 個\\n\";\necho \"1番目: \", $fruits[0], \"\\n\";\necho \"大文字: \", strtoupper($fruits[0]), \"\\n\";\necho \"banana をふくむ？ \", str_contains($text, \"banana\") ? \"はい\" : \"いいえ\", \"\\n\";\necho \"つなぐ: \", implode(\" / \", $fruits), \"\\n\";\necho \"置きかえ: \", str_replace(\"cherry\", \"melon\", $text), \"\\n\";\n\n$messy = \"   hello   \";\necho \"[\", trim($messy), \"]\\n\";            // 前後の空白を取る\necho \"先頭3文字: \", substr($text, 0, 3), \"\\n\";\n\n$ja = \"こんにちは世界\";\necho mb_substr($ja, 0, 5), \" / \", mb_strlen($ja), \" 文字\\n\";"}],"output":"3 個\n1番目: apple\n大文字: APPLE\nbanana をふくむ？ はい\nつなぐ: apple / banana / cherry\n置きかえ: apple,banana,melon\n[hello]\n先頭3文字: app\nこんにちは / 7 文字","run":"php main.php"}}},{"id":"ruby","name":"Ruby","type":"動的型","exec":"インタプリタ","tagline":"書いていて楽しい、日本生まれの言語","about":"まつもとゆきひろさんが作った、日本生まれの言語です。Ruby on Rails という Web アプリの道具で世界中に広まりました。英語の文のように読めるコードが書けます。","run":"ruby main.rb","flow":[["main.rb","あなたが書く"],["ruby","インタプリタ","tool"],["その場で実行","上から順に"]],"flowNote":"インタプリタがコードを読みながら実行します。すぐためせるので、少しずつ作るのに向いています。","ready":["ブロックと each・map・select を使って、データを加工できる","クラス・継承・モジュール（Mix-in）で、機能を整理できる","例外を rescue で受けとめ、ファイルを安全にあつかえる","Bundler で gem を入れ、minitest か RSpec でテストを書ける"],"next":["Ruby on Rails で、データベースを使う Web アプリを作る","よく使う作業を自動化する、小さなコマンドを作る","ほかの人が作った gem のコードを読んでみる"],"lessons":{"10":{"points":["`class` は「設計図」。`Account.new(\"さくら\", 1000)` で、設計図から実物（インスタンス）を作ります。","`initialize` は、実物を作るときに1回だけ呼ばれます。","`@` で始まる変数は「インスタンス変数」。その実物が持っているデータです。クラスの外からは直接さわれません。","`attr_reader :balance` と書くと、外から読むためのメソッドを自動で作ってくれます。書きかえもゆるすなら `attr_accessor` です。"],"files":[{"name":"main.rb","main":true,"shell":false,"code":"class Account\n  attr_reader :owner, :balance     # 外から読めるようにする\n\n  def initialize(owner, balance)\n    @owner = owner\n    @balance = balance\n  end\n\n  def deposit(amount)\n    @balance += amount\n  end\n\n  def show\n    puts \"#{@owner} の残高: #{@balance} 円\"\n  end\nend\n\na = Account.new(\"さくら\", 1000)\nb = Account.new(\"たろう\", 300)\n\na.deposit(500)      # a だけが増える\na.show\nb.show\nputs a.balance"}],"output":"さくら の残高: 1500 円\nたろう の残高: 300 円\n1500","run":"ruby main.rb"},"11":{"points":["ブロックは、メソッドに渡す「ひとまとまりの処理」です。`|n|` は、ブロックが受けとる引数です。","`map` は「全部を作りかえた新しい配列」、`select` は「条件に合うものだけ」、`reject` はその反対です。","`sum`、`sort_by`、`find`、`each_with_index`、`group_by` もよく使います。","`map(&:upcase)` は、`map { |x| x.upcase }` の短い書き方です。","自分のメソッドの中で `yield` と書くと、渡されたブロックを呼び出せます。"],"files":[{"name":"main.rb","main":true,"shell":false,"code":"nums = [1, 2, 3, 4, 5, 6]\n\ndoubled = nums.map { |n| n * 2 }          # 作りかえる\nevens = nums.select { |n| n.even? }       # しぼる\ntotal = nums.sum                          # まとめる\np doubled\np evens\nputs \"合計: #{total}\"\n\nitems = [\n  { name: \"りんご\", price: 120 },\n  { name: \"バナナ\", price: 80 },\n  { name: \"メロン\", price: 900 },\n]\n\n# つなげて書ける\nnames = items.select { |item| item[:price] >= 100 }.map { |item| item[:name] }\np names\n\n# 値段の安い順にならべて、番号つきで表示\nitems.sort_by { |item| item[:price] }.each_with_index do |item, i|\n  puts \"#{i + 1}. #{item[:name]}\"\nend\n\n# 短い書き方\np [\"a\", \"b\"].map(&:upcase)\n\n# ブロックを受けとるメソッドを自分で作る\ndef twice\n  yield 1\n  yield 2\nend\n\ntwice { |n| puts \"#{n} 回目の呼び出し\" }"}],"title":"ブロックとイテレータ","goal":"each・map・select などにブロックを渡して、配列を自由に加工できるようになる。自分でもブロックを受けとるメソッドを作れるようになる。","intro":"Ruby らしさのまん中にあるのが「ブロック」です。do 〜 end や { } で囲んだ「ひとまとまりの処理」を、メソッドに渡すしくみです。Ruby のコードは、ループを for で書くかわりに、ほとんどをブロックで書きます。Ruby on Rails のコードも、ブロックだらけです。","quiz":{"q":"[1, 2, 3, 4].select { |n| n.even? }.map { |n| n * 10 } の結果は？","choices":["[10, 20, 30, 40]","[20, 40]","[2, 4]"],"answer":1,"why":"select で偶数（2 と 4）だけを残し、map でそれぞれ 10 倍にするので [20, 40] です。"},"task":"商品のハッシュの配列から、値段が 100 円以上の物だけを取り出して、名前の配列を作ってみよう。","hint":"items.select { |item| item[:price] >= 100 }.map { |item| item[:name] } の形です。","output":"[2, 4, 6, 8, 10, 12]\n[2, 4, 6]\n合計: 21\n[\"りんご\", \"メロン\"]\n1. バナナ\n2. りんご\n3. メロン\n[\"A\", \"B\"]\n1 回目の呼び出し\n2 回目の呼び出し","run":"ruby main.rb"},"12":{"points":["同じフォルダのファイルを読みこむには `require_relative \"greeting\"` と書きます（`.rb` は書きません）。","最初から入っているライブラリや、あとから入れたライブラリ（gem）は `require \"json\"` のように読みこみます。","`module` で、メソッドをひとまとめにして名前をつけられます。ほかのコードと名前がぶつかりません。","`def self.hello` は、`Greeting.hello` のように、モジュールの名前で直接呼べるメソッドです。"],"files":[{"name":"greeting.rb","main":false,"shell":false,"code":"# あいさつを作る部品\nmodule Greeting\n  def self.hello(name)\n    \"こんにちは、#{name}さん\"\n  end\n\n  def self.bye(name)\n    \"さようなら、#{name}さん\"\n  end\nend"},{"name":"main.rb","main":true,"shell":false,"code":"require_relative \"greeting\"\n\nputs Greeting.hello(\"さくら\")\nputs Greeting.bye(\"さくら\")"}],"output":"こんにちは、さくらさん\nさようなら、さくらさん","run":"ruby main.rb"},"13":{"points":["エラー（例外）が起きるかもしれない所を `begin` に書き、起きたときの対応を `rescue 例外の種類 => e` に書きます。","自分で例外を起こすには `raise ArgumentError, \"説明\"` と書きます。","`ensure` の中は、例外が起きても起きなくても、最後に必ず動きます。","メソッドの中では、`begin` を書かずに `def` 〜 `rescue` 〜 `end` と書けます。","`Integer(\"abc\")` は例外を起こします。`\"abc\".to_i` はエラーにならず 0 になるので、入力のチェックには向きません。"],"files":[{"name":"main.rb","main":true,"shell":false,"code":"def divide(a, b)\n  raise ArgumentError, \"0 で割ることはできません\" if b == 0\n  a / b\nend\n\nbegin\n  puts \"10 ÷ 2 = #{divide(10, 2)}\"\n  puts \"10 ÷ 0 = #{divide(10, 0)}\"\n  puts \"ここは動きません\"\nrescue ArgumentError => e\n  puts \"エラー: #{e.message}\"\nend\n\ntext = \"abc\"\nbegin\n  number = Integer(text)       # 数にできなければ例外\n  puts number\nrescue ArgumentError\n  puts \"\\\"#{text}\\\" は数ではありません\"\nensure\n  puts \"チェック終わり\"\nend"}],"output":"10 ÷ 2 = 5\nエラー: 0 で割ることはできません\n\"abc\" は数ではありません\nチェック終わり","run":"ruby main.rb"},"14":{"points":["`File.write` で書きこみ、`File.read` で全部を文字列として読みこみます。","`File.readlines(ファイル, chomp: true)` は、改行を取った1行ずつの配列にします。","`File.open(...) do |f| ... end` とブロックで書くと、使い終わったファイルを自動で閉じてくれます。","ファイルがないときは `Errno::ENOENT` という例外が起きます。"],"files":[{"name":"main.rb","main":true,"shell":false,"code":"lines = [\"牛乳を買う\", \"宿題をする\", \"本を読む\"]\n\n# 書きこむ（ブロックを出ると、自動で閉じられる）\nFile.open(\"memo.txt\", \"w\") do |f|\n  lines.each { |line| f.puts line }\nend\nputs \"#{lines.length} 行 書きました\"\n\n# 読みこむ\nFile.readlines(\"memo.txt\", chomp: true).each_with_index do |line, i|\n  puts \"#{i + 1}: #{line}\"\nend\n\n# ないファイルを開こうとしたとき\nbegin\n  File.read(\"ない.txt\")\nrescue Errno::ENOENT\n  puts \"ない.txt は開けませんでした\"\nend"}],"output":"3 行 書きました\n1: 牛乳を買う\n2: 宿題をする\n3: 本を読む\nない.txt は開けませんでした","run":"ruby main.rb"},"15":{"points":["Ruby には、テストの道具 `minitest` が最初から入っています。","`test_` で始まるメソッドが、1つのテストになります。","`assert_equal 期待, 実際` は、2つが同じでなければ「失敗」と知らせます（期待する値を先に書きます）。","Rails の仕事では RSpec もよく使われます。`expect(fizzbuzz(3)).to eq \"Fizz\"` のように書きますが、考え方は同じです。"],"files":[{"name":"main.rb","main":true,"shell":false,"code":"require
